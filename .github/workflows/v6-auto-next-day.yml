name: V6 next-day automatic rollover isolated
on:
  push:
    branches: [main, feat/v6-auto-next-day-20261115]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate bridge JS syntax
        run: node --check v6/r5-bridge.js
      - name: Install isolated PostgreSQL emulator
        run: npm install --prefix /tmp/v6-autoroll --no-save @electric-sql/pglite@0.3.15
      - name: Run atomic rollover and family safety tests
        run: |
          ln -s /tmp/v6-autoroll/node_modules node_modules
          node tests/auto-day-rollover.test.mjs
  min-nong-preview:
    name: Min Nong speech regression and preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check speech controls and parse scripts
        run: |
          node tools/test-min-nong-audio.cjs
          node --check v6/poem-audio.js
          node --check v6/poem-speech-check.js
          node --check v6/chinese-daily-questions.js
      - name: Build independent preview archive
        run: |
          mkdir -p out/v6/audio
          cp v6/chinese-day6-preview.html v6/poem-audio.js v6/poem-speech-check.js v6/chinese-daily-questions.js out/v6/
          cp 'v6/悯农诗意田园课堂.png' 'v6/拼音复习_山蓝门本林金.png' 'v6/识字描红_禾田午趣味课堂.png' 'v6/一粒米的奇妙旅程.png' out/v6/
          cp -R v6/audio/poems out/v6/audio/
      - uses: actions/upload-artifact@v4
        with:
          name: v6-min-nong-speech-preview
          path: out/
          if-no-files-found: error
