name: V6 Chinese parent day diagnostic
on:
  push:
    branches: [fix/v6-parent-check-chinese-and-crossday-diagnosis-20261115]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/v6-parent-check-chinese.test.mjs
      - run: node --check v6/r5-bridge.js
