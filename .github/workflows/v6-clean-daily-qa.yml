name: V6 clean home and daily learning acceptance
on:
  push:
    branches: [validation/v6-clean-daily-20261109]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: npm install --ignore-scripts --prefix qa
      - run: node qa/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-clean-daily-evidence
          path: qa-output/
