name: V6 Fragment DB Safety (isolated)
on:
  push:
    branches:
      - feat/v6-garage-restore-20261114
  pull_request:
    branches:
      - main
    paths:
      - 'db/**'
      - '.github/workflows/v6-fragment-db-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    if: github.head_ref == 'feat/v6-garage-restore-20261114' || github.ref == 'refs/heads/feat/v6-garage-restore-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: db/isolated/package-lock.json
      - name: Install pinned PGlite; no CloudBase credentials
        run: npm ci --prefix db/isolated --no-audit --no-fund
      - name: Inspect V2 production runtime and GLB assets read-only
        uses: actions/checkout@v4
        with:
          repository: Sadkikyo0930/little-racing-v2
          ref: main
          path: v2-source
          persist-credentials: false
      - name: Verify V6 assembly unlock IDs match deployed V2 car models
        run: |
          set -o pipefail
          node tests/v6-v2-fragment-contract.test.mjs | tee v2-contract.log
          grep -q "ALL 12 V2 FRAGMENT VEHICLE CONTRACT CHECKS PASSED" v2-contract.log
      - name: Assert curated car thumbnails outrank stale placeholder metadata
        run: |
          set -o pipefail
          node tests/garage-thumbnail-priority.test.mjs | tee garage-thumbnail-priority.log
          grep -q "ALL 5 GARAGE THUMBNAIL PRIORITY CHECKS PASSED" garage-thumbnail-priority.log
      - name: Verify native SQL and gateway fragment response contracts
        run: |
          set -o pipefail
          node tests/fragment-rpc-compat.test.mjs | tee fragment-rpc.log
          grep -q "ALL 14 FRAGMENT RPC COMPATIBILITY TESTS PASSED" fragment-rpc.log
      - name: Check both fragment cars and stale-token family fallback
        run: |
          set -o pipefail
          node tests/garage-device-fallback.test.mjs | tee garage-device.log
          grep -q "ALL 12 GARAGE CROSS-DEVICE THUMBNAIL CHECKS PASSED" garage-device.log
      - name: Verify opt-in family auto-restore and duplicate upload suppression
        run: |
          set -o pipefail
          node tests/family-auto-restore-integration.test.mjs | tee family-auto-restore.log
          grep -q "ALL 3 FAMILY AUTO-RESTORE INTEGRATION CHECKS PASSED" family-auto-restore.log
      - name: Test cross-device additive progress recovery
        run: |
          set -o pipefail
          node tests/family-progress-merge.test.mjs | tee family-progress.log
          grep -q "ALL 15 FAMILY PROGRESS RESTORE CHECKS PASSED" family-progress.log
      - name: Rehearse production read-only preflight against synthetic schema drift
        run: |
          set -o pipefail
          node db/isolated/run-preflight-validation.mjs | tee preflight-validation.log
          grep -q "ALL 4 PREFLIGHT SCHEMA VALIDATION CHECKS PASSED" preflight-validation.log
      - name: Verify approved drop rate does not activate production rewards
        run: |
          set -o pipefail
          node tests/reward-approval-boundary.test.mjs | tee approval-boundary.log
          grep -q "ALL 3 APPROVAL BOUNDARY CHECKS PASSED" approval-boundary.log
      - name: Verify current V6 Chinese and fragment-garage candidate
        run: |
          set -o pipefail
          node tests/v6-candidate-smoke.test.mjs | tee v6-smoke.log
          grep -q "V6 CANDIDATE SMOKE CHECKS PASSED" v6-smoke.log
      - name: Check denied/unknown reward status cannot show success
        run: |
          set -o pipefail
          node tests/fragment-reward-status.test.mjs | tee reward-ui.log
          grep -q "ALL 13 REWARD UI STATUS TESTS PASSED" reward-ui.log
      - name: Assert reward gate and negative cases
        run: |
          set -o pipefail
          node db/isolated/run-authority.mjs | tee authority.log
          grep -q "K7 " authority.log
          grep -q "VERDICT PASS" authority.log
      - name: Verify existing DB authorization cases
        run: node db/isolated/run.mjs | tee authz.log
      - name: Verify SQL transaction rollback and COMMIT
        run: |
          set -o pipefail
          node db/isolated/run-migration-atomicity.mjs | tee atomicity.log
          grep -q "ALL 4 ISOLATED TRANSACTION REHEARSALS PASSED" atomicity.log
      - name: Verify committed synthetic reverse migration
        run: |
          set -o pipefail
          node db/isolated/run-postcommit-reversal.mjs | tee reversal.log
          grep -q "SUCCESS: 2/2 isolated" reversal.log
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fragment-db-safety-logs
          retention-days: 7
          path: |
            authority.log
            reward-ui.log
            approval-boundary.log
            preflight-validation.log
            family-progress.log
            family-auto-restore.log
            garage-device.log
            fragment-rpc.log
            garage-thumbnail-priority.log
            v2-contract.log
            v6-smoke.log
            authz.log
            atomicity.log
            reversal.log
            evidence/transaction-rehearsal/atomicity-results.json
          if-no-files-found: ignore
