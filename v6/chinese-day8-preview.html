<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>第八个语文日·森林里的神秘脚印</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:linear-gradient(#c6f3d9,#f8ffed);color:#25523f}body.embed{background:transparent}main{max-width:740px;margin:auto;padding:12px}body.embed main{padding:0;max-width:none}.scene{padding:9px;background:#fff;border-radius:20px;margin-bottom:14px;box-shadow:0 6px 19px #246c3830}.scene h2{font-size:18px;margin:6px 6px 10px}.picture{position:relative;border-radius:14px;overflow:hidden;background:#d8efd0}.picture img{display:block;width:100%;height:auto}.hot{position:absolute;appearance:none;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.hot:focus-visible{outline:3px solid #edb631;background:#fee66535}.note{font-size:13px;color:#4c7059;line-height:1.7;margin:9px 6px}.veil{position:fixed;inset:0;z-index:100;background:#0b2d23d9;display:none;align-items:center;justify-content:center;padding:12px}.veil.open{display:flex}.dialog{background:#fff;border-radius:20px;padding:18px;width:min(100%,550px);max-height:94dvh;overflow-y:auto}.close{float:right;border:0;background:#e7f5ed;border-radius:50%;width:42px;height:42px;font-size:25px;color:#1d5744}.cta,.choice{display:block;width:100%;border:0;border-radius:13px;padding:14px 12px;margin-top:10px;font-size:17px;font-weight:750}.cta{background:#159b7d;color:white}.choice{background:#f1fff4;color:#235742;border:2px solid #a7d7b9;text-align:left}.choice:disabled{opacity:.75}.status{font-size:15px;font-weight:750;color:#25824f;min-height:22px}.trace{height:255px;position:relative;border:2px solid #9fcbaa;border-radius:12px;background:linear-gradient(0deg,transparent calc(50% - 1px),#c2ddc6 50%,transparent calc(50% + 1px)),linear-gradient(90deg,transparent calc(50% - 1px),#c2ddc6 50%,transparent calc(50% + 1px))}.trace span{position:absolute;inset:0;display:grid;place-items:center;color:#dbe9da;font-size:160px;pointer-events:none}.trace canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.missing{padding:20px;text-align:center;display:none;background:#def2e3}.words{font-size:19px;line-height:2}.sub{line-height:1.8;color:#55715d}.choice-grid{display:grid;gap:8px}.letter{display:inline-flex;align-items:center;justify-content:center;background:#f9cb60;border-radius:50%;width:27px;height:27px;margin-right:10px}
</style></head><body><main>
<section class="scene"><h2>🔎 一、拼音侦探</h2><div class="picture"><img src="./01_%E6%8B%BC%E9%9F%B3%E4%BE%A6%E6%8E%A2.png?v=1" alt="脚、印、林拼音学习卡" onerror="missing(this)"><div class="missing">拼音侦探图片尚未载入</div><button class="hot" style="left:7%;top:48.5%;width:27%;height:17%" onclick="word('脚')" aria-label="听脚 jiǎo"></button><button class="hot" style="left:37%;top:48.5%;width:26%;height:17%" onclick="word('印')" aria-label="听印 yìn"></button><button class="hot" style="left:67%;top:48.5%;width:26%;height:17%" onclick="word('林')" aria-label="听林 lín"></button><button class="hot" style="left:6%;top:68%;width:88%;height:27%" onclick="word('脚印')" aria-label="拼读脚印"></button></div><p class="note">点击图片中的字卡听发音，学习 jiǎo（脚）、yìn（印）、lín（林）。</p></section>
<section class="scene"><h2>📖 二、绘本故事</h2><div class="picture"><img src="./02_%E7%BB%98%E6%9C%AC%E6%95%85%E4%BA%8B.png?v=1" alt="森林里的神秘脚印故事画面" onerror="missing(this)"><div class="missing">绘本故事图片尚未载入</div><button class="hot" style="inset:0" onclick="story()" aria-label="点击绘本听故事"></button></div><p class="note">点击整张绘本，听小兔和小狐狸寻找脚印的故事。</p></section>
<section class="scene"><h2>🧠 三、故事理解</h2><div class="picture"><img src="./03_%E6%95%85%E4%BA%8B%E7%90%86%E8%A7%A3.png?v=1" alt="故事理解三道选择题" onerror="missing(this)"><div class="missing">故事理解图片尚未载入</div><button class="hot" style="inset:0" onclick="quizStart()" aria-label="开始三道故事理解题"></button></div><p class="note">点击图片开始闯关，答题后可自动记录本页成绩。</p></section>
<section class="scene"><h2>✍️ 四、识字描红</h2><div class="picture"><img src="./04_%E8%AF%86%E5%AD%97%E6%8F%8F%E7%BA%A2.png?v=1" alt="脚、印、林识字描红学习图" onerror="missing(this)"><div class="missing">描红图片尚未载入</div><button class="hot" style="left:10%;top:18%;width:30%;height:65%" onclick="trace('脚')" aria-label="描红脚"></button><button class="hot" style="left:40%;top:18%;width:30%;height:65%" onclick="trace('印')" aria-label="描红印"></button><button class="hot" style="left:70%;top:18%;width:30%;height:65%" onclick="trace('林')" aria-label="描红林"></button></div><p class="note">直接点击图片上的字，打开手指描红板；每天只学习三个生字。</p></section>
</main><div class="veil" id="veil" role="dialog" aria-modal="true"><div class="dialog"><button class="close" onclick="dismiss()" aria-label="关闭">×</button><div id="detail"></div></div></div><script>
const $=id=>document.getElementById(id);let qi=0,score=0,answered=false;
const storyText='森林里的神秘脚印。清晨，小兔白白走出家门，发现门前的泥地上有一串奇怪的脚印。脚印从小河边一直延伸到树林深处。白白有点害怕，急忙找来小狐狸。小狐狸仔细看了看，说：这些脚印旁边有水迹，主人可能刚从河里出来。他们沿着脚印向前走，发现草地上有几片湿树叶。白白问：是不是一只大怪兽？小狐狸说：我们还没有找到证据，不能随便猜。突然，前方传来扑通扑通的声音。他们悄悄拨开草丛，看见一只小鸭子正在水坑里开心地玩耍。原来，小鸭子早晨游过河，走进树林寻找食物，留下了这些脚印。小狐狸笑着说：遇到不明白的事情，要先观察，再寻找线索，最后作出判断。';
const questions=[['小狐狸为什么猜脚印的主人刚从河里出来？',['脚印旁边有水迹','听到了小鸭唱歌','看到了小鸭羽毛'],0],['小兔为什么一开始害怕？',['因为树林里下雨了','因为不知道脚印是谁留下的','因为找不到小狐狸'],1],['故事告诉我们什么？',['所有脚印都是鸭子留下的','遇到奇怪的事要马上逃跑','先观察证据，再作判断'],2]];
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.78;speechSynthesis.speak(u)}
function show(h){$('detail').innerHTML=h;$('veil').classList.add('open')}
function dismiss(){speechSynthesis?.cancel();$('veil').classList.remove('open')}
$('veil').addEventListener('click',e=>{if(e.target===$('veil'))dismiss()});
function missing(im){im.style.display='none';im.nextElementSibling.style.display='block'}
function word(w){const m={'脚':['jiǎo','脚步、脚印'],'印':['yìn','脚印、印章'],'林':['lín','树林、森林'],'脚印':['jiǎo yìn','小兔发现了脚印。']};const a=m[w];show('<h2>'+w+' · '+a[0]+'</h2><p class="words">'+a[1]+'</p><button class="cta" onclick="speak(\''+w+'，'+a[1]+'\')">🔊 点击听读</button>');speak(w+'。'+a[1])}
function story(){show('<h2>📖 森林里的神秘脚印</h2><p class="sub">'+storyText+'</p><button class="cta" onclick="speak(storyText)">🔊 再听一遍</button>');speak(storyText)}
function quizStart(){qi=0;score=0;drawQuestion()}
function drawQuestion(){if(qi>=questions.length){const msg='完成啦！三道题答对 '+score+' 道。';show('<h2>🌟 故事闯关完成</h2><p>'+msg+'</p><button class="cta" onclick="dismiss()">返回课程</button>');try{sessionStorage.setItem('forestLessonQuiz',JSON.stringify({score,total:3,at:new Date().toISOString()}))}catch(e){}speak(msg);return}answered=false;const q=questions[qi];show('<h2>第 '+(qi+1)+' / 3 题</h2><p class="words">'+q[0]+'</p><div class="choice-grid">'+q[1].map((v,i)=>'<button class="choice" data-answer="'+i+'"><span class="letter">'+['A','B','C'][i]+'</span>'+v+'</button>').join('')+'</div><p id="feedback" class="status"></p><button class="cta" onclick="speak(questions[qi][0]+\'。\'+questions[qi][1].join(\'。\'))">🔊 听题目</button><button class="cta" id="nextQ" style="display:none" onclick="qi++;drawQuestion()">下一题 →</button>');$('detail').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let ok=Number(b.dataset.answer)===q[2];if(ok)score++;$('feedback').textContent=ok?'🌟 恭喜你回答正确！':'正确答案是：'+q[1][q[2]];speak(ok?'恭喜你回答正确':'哦哦，正确答案是'+q[1][q[2]]);$('detail').querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);$('nextQ').style.display='block'})}
function trace(w){show('<h2>✍️ '+w+' · 手指描红</h2><p class="sub">在字形上用手指描写。此处是练习画板，不能自动判断笔顺是否正确。</p><div class="trace"><span>'+w+'</span><canvas id="pad"></canvas></div><button class="cta" onclick="trace(\''+w+'\')">清除重写</button><button class="cta" onclick="speak(\''+w+'\')">🔊 听读生字</button><button class="cta" onclick="dismiss()">完成描红</button>');const c=$('pad'),rect=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=rect.width*dpr;c.height=rect.height*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#e96556';let drawing=false;c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)};c.onpointermove=e=>{if(!drawing)return;const r=c.getBoundingClientRect();ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false}
</script></body></html>
