<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6·七天语文课程</title><style>body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f4fbfc;color:#17414e;margin:0;padding-bottom:90px}header{position:sticky;top:0;background:#fff;padding:14px;box-shadow:0 2px 10px #b6d9df;z-index:2;display:flex;justify-content:space-between;align-items:center}a{color:#008b8c;text-decoration:none}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #cee3e5}h2{margin:0 0 8px}.hero{background:linear-gradient(130deg,#a6eff4,#fff4c7);text-align:center;font-size:90px;padding:22px;border-radius:22px;margin-bottom:16px}button{font:inherit;border:0;border-radius:16px;padding:13px 14px;cursor:pointer;background:#eaf6fb;color:#125664}button:active{transform:scale(.98)}button.primary{background:#00a9ab;color:#fff;font-weight:bold}.pill{background:#ffeeb9;padding:8px 12px;border-radius:30px;display:inline-block;margin:4px}.choices{display:grid;gap:9px}.choice{background:#e8f9f7;text-align:left;font-size:17px}.selected{background:#ffe7a1;border:2px solid #ffb828}.days{display:flex;gap:7px;overflow:auto;padding:12px 0}.days button{min-width:52px}.active{background:#008b8c;color:white}.nav{position:fixed;bottom:0;width:100%;background:white;display:flex;justify-content:space-around;padding:8px 0;box-shadow:0 -2px 10px #cedfe0}.nav a{font-size:13px}#phonics{display:flex;flex-wrap:wrap;gap:8px}.ph{font-size:22px;background:#fff0cc;flex:1;min-width:64px}#status{font-size:13px;color:#6b7e86}</style></head><body><header><a href="./index.html">‹ 返回原版 V6</a><b>🦁 语文 · 七天探索</b></header><main><div class="days" id="days"></div><section class="card"><h2>🎵 拼音听读 · 点击直接发音</h2><div id="phonics"></div><p id="status">音频独立对应拼音；若加载失败不会播放其他音节代替。</p></section><div class="hero" id="hero"></div><section class="card"><small id="dayNo"></small><h2 id="title"></h2><button class="primary" id="listen">🔊 老师讲故事</button><p id="story"></p><div id="words"></div></section><section class="card"><h2>🎯 听问题，选答案</h2><button id="ask">🔊 听题目</button><p id="question"></p><div class="choices" id="choices"></div><p id="feedback" aria-live="polite"></p><button class="primary" id="next">完成本课，下一天 →</button></section></main><div class="nav"><a href="./index.html">🏠 首页</a><a href="./index.html">📖 原语文</a><a href="./index.html">📈 原成长中心</a></div><script>const lessons=[["消失的小水滴","太阳晒着水，水会慢慢变成看不见的水蒸气。水蒸气升到空中，遇冷凝结成细小水滴，聚在一起形成云。当云里的水滴变大，就可能落下雨来。","蒸发","凝结","降落","为什么碟子里的水慢慢变少了？","水蒸发进入空气","水变成了沙子","被云直接吸走",0,"💧☀️☁️🌧️"],["蚂蚁为什么排队？","一只蚂蚁发现一大块饼干屑，自己搬不动。它回到蚁巢，在路上留下特别的气味。伙伴沿着气味找到食物，大家一起把饼干屑搬回家。原来蚂蚁会用信息素帮助同伴寻找道路。","蚁巢","路线","合作","其他蚂蚁怎么找到饼干屑？","跟着气味找","看路牌","听见蚂蚁唱歌",0,"🐜🐜🍪"],["会变长的影子","早晨，果果发现影子长长的。中午，影子变短了。下午，它又变长了。老师说，影子的样子跟光照射的方向有关。果果决定每天都观察，记录太阳的位置和影子的变化。","照射","方向","观察","什么会影响影子的方向与长度？","光照方向","鞋子的颜色","说话声音",0,"☀️🌳👤"],["一本书的旅行","童童在图书馆借到一本海洋故事书。读完后，他很想留下。管理员告诉他，借阅的书应该按时归还，其他读者也能看到。童童小心地把书还回去，第二天，这本书又陪伴另一个小朋友探索大海。","借阅","归还","爱护","为什么童童要归还图书？","方便其他人借阅","书里的内容会消失","图书馆只许读一次",0,"📚🐳🏫"],["种子里的秘密","朵朵把绿豆放在湿润的纸巾上。几天后，豆子裂开，长出小小的根。另一组绿豆放在干燥盒子里，却没有发芽。爷爷告诉她，种子发芽通常需要合适的水、空气和温度。","发芽","嫩根","条件","哪种环境更适合绿豆发芽？","温暖湿润并有空气","完全干燥","浸没密封无空气",0,"🫘🌱🌿"],["磁铁侦探社","乐乐用磁铁靠近铁钉，铁钉被吸住了。可木筷和铝箔没有被吸住。老师解释，磁铁能吸引铁等一些材料，但不是所有金属都能被普通磁铁吸住。乐乐把物品分类，认真记录实验结果。","磁铁","材料","分类","普通磁铁能吸起哪一个？","铁钉","木筷","铝箔",0,"🧲🔩🪵"],["超市里的小侦探","安安带十元钱去买水果。每个苹果三元，每个橘子两元。他先买两个苹果，花了六元，还剩四元。安安又买两个橘子，刚好用完。他还检查水果是否完好，再核对价钱。","价格","剩余","核对","买了两个三元的苹果后，还剩多少钱？","四元","六元","八元",0,"🍎🍊🛒"]];const syllables=['zhi','chi','shi','ri','zi','ci','si'];const base='https://raw.githubusercontent.com/hugolpz/audio-cmn/master/64k/syllabs/';let day=0,audio=null,seq=0;const el=id=>document.getElementById(id);function play(i){seq++;if(audio){audio.pause();audio=null}speechSynthesis?.cancel();const token=seq;const name=syllables[i];audio=new Audio(base+'cmn-'+name+'1.mp3');el('status').textContent='🔊 '+name+' 第一声';audio.onerror=()=>{if(token===seq)el('status').textContent='录音加载失败，请联网后重试。';};audio.play().catch(()=>{if(token===seq)el('status').textContent='请再点击音节以播放';});}function say(s){if(audio)audio.pause();speechSynthesis?.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.78;speechSynthesis.speak(u)}syllables.forEach((s,i)=>{let b=document.createElement('button');b.className='ph';b.textContent=s;b.onclick=()=>play(i);el('phonics').append(b)});function render(){let d=lessons[day];el('days').innerHTML='';lessons.forEach((x,i)=>{let b=document.createElement('button');b.textContent='第'+(i+1)+'天';b.className=i===day?'active':'';b.onclick=()=>{day=i;render()};el('days').append(b)});el('hero').textContent=d[9];el('dayNo').textContent='第 '+(day+1)+' / 7 天';el('title').textContent=d[0];el('story').textContent=d[1];el('words').innerHTML='';for(let i=2;i<=4;i++){let s=document.createElement('span');s.className='pill';s.textContent=d[i];el('words').append(s)}el('question').textContent=d[5];el('feedback').textContent='';el('choices').innerHTML='';for(let i=0;i<3;i++){let b=document.createElement('button');b.className='choice';b.textContent=['A. ','B. ','C. '][i]+d[6+i];b.onclick=()=>{el('choices').querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');el('feedback').textContent=i===0?'答对了！⭐':'再听一遍故事，想一想。';};el('choices').append(b)}el('listen').onclick=()=>say(d[1]);el('ask').onclick=()=>say(d[5]+'。A，'+d[6]+'。B，'+d[7]+'。C，'+d[8]);el('next').onclick=()=>{day=(day+1)%7;render();scrollTo(0,0)}}render();</script></body></html>
