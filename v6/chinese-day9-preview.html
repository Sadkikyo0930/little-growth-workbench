*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:linear-gradient(#daefff,#f4fff0);color:#235b66;margin:0}body.embed{background:transparent}main{max-width:740px;padding:10px;margin:auto}body.embed main{padding:0}.scene{background:#fff;border-radius:20px;margin-bottom:14px;padding:9px;box-shadow:0 5px 18px #428e9d2b}.scene h2{font-size:19px;margin:7px 8px 11px}.picture{position:relative;overflow:hidden;border-radius:16px;background:#e4f3fd}.picture img{width:100%;height:auto;display:block}.hotspots{position:absolute;inset:0}.hotspots button{position:absolute;appearance:none;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.hotspots button:focus-visible{outline:3px solid #ffa931;background:#ffd9433b}.tip{font-size:13px;margin:9px 7px;color:#47717b;line-height:1.6}.modal{position:fixed;inset:0;z-index:100;background:#163d55c9;display:none;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.dialog{max-width:560px;width:100%;max-height:94dvh;overflow-y:auto;border-radius:19px;padding:18px;background:white}.close{float:right;border:0;background:#e5f5fa;color:#24566a;font-size:25px;border-radius:50%;width:43px;height:43px}.cta,.opt{display:block;border:0;border-radius:13px;padding:14px 12px;margin-top:11px;width:100%;font-size:17px;font-weight:750;cursor:pointer}.cta{background:#149cba;color:white}.opt{background:#f1fcff;color:#185b72;border:2px solid #a3dae7;text-align:left}.opt:disabled{opacity:.7}.text{font-size:17px;line-height:1.9}.small{font-size:14px;line-height:1.7;color:#52757d}.status{min-height:28px;font-weight:750;color:#14915a}.trace{height:240px;position:relative;border:2px solid #99d1d9;border-radius:13px;background:linear-gradient(0deg,transparent 49.7%,#b8dce2 50%,transparent 50.3%),linear-gradient(90deg,transparent 49.7%,#b8dce2 50%,transparent 50.3%)}.trace span{position:absolute;inset:0;display:grid;place-items:center;font-size:148px;color:#d </style></head><body><main><section class="scene"><h2>一、拼音小侦探</h2><div class="picture"><img loading="eager" src="./036DAB35-50DA-4CC8-A068-336D88492648.png?v=1" alt="一、拼音小侦探" /><div class="hotspots"><button aria-label="听读风" style="left:3%;width:31%;top:25%;height:62%" onclick="word('风')"></button><button aria-label="听读线" style="left:36%;width:31%;top:25%;height:62%" onclick="word('线')"></button><button aria-label="听读找" style="left:69%;width:31%;top:25%;height:62%" onclick="word('找')"></button></div></div><p class="tip">点击图片上的风、线、找，听准确发音。</p></section>
<section class="scene"><h2>二、绘本故事</h2><div class="picture"><img loading="eager" src="./4126CDD2-9E80-4A43-ADA4-6E2054B8EBB5.png?v=1" alt="二、绘本故事" /><div class="hotspots"><button aria-label="点击故事插画，听《消失的红色风筝》。" style="inset:0" onclick="tellStory()"></button></div></div><p class="tip">点击故事插画，听《消失的红色风筝》。</p></section>
<section class="scene"><h2>三、阅读理解</h2><div class="picture"><img loading="eager" src="./2AB25121-1741-4418-A76F-9200B9339358.png?v=1" alt="三、阅读理解" /><div class="hotspots"><button aria-label="点击图片开始三道阅读闯关题。" style="inset:0" onclick="startQuiz()"></button></div></div><p class="tip">点击图片开始三道阅读闯关题。</p></section>
<section class="scene"><h2>四、识字描红</h2><div class="picture"><img loading="eager" src="./5C200510-1C0D-44A5-9F29-CD2AD6141A2A.png?v=1" alt="四、识字描红" /><div class="hotspots"><button aria-label="描红风" style="left:3%;width:31%;top:25%;height:62%" onclick="trace('风')"></button><button aria-label="描红线" style="left:36%;width:31%;top:25%;height:62%" onclick="trace('线')"></button><button aria-label="描红找" style="left:69%;width:31%;top:25%;height:62%" onclick="trace('找')"></button></div></div><p class="tip">点击图片上的风、线、找，手指描红。</p></section></main><div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeModal()" aria-label="关闭">×</button><div id="content"></div></div></div><script>
'use strict';
const $=id=>document.getElementById(id);let index=0,correctCount=0,locked=false;
const fullStory="星期天，小明和妹妹去公园放风筝。一阵大风吹来，风筝线突然断了。红色风筝越飞越高，最后消失在树林后面。妹妹着急地说：风筝是不是飞到河里去了？小明想了想：刚才风是从我们背后吹来的，风筝应该朝树林的方向飞了。他们走到树林旁，发现草地上有一根细细的红线。妹妹高兴地喊：找到了！可是顺着红线往前走，他们只看见一棵高大的树，树下没有风筝。小明抬起头，发现红色风筝正挂在树枝上。妹妹想爬树去拿，小明拦住了她：树太高了，爬上去很危险，我们去找大人帮忙。不一会儿，公园管理员叔叔用长长的工具，安全地取下了风筝。小明说：我们要观察线索，也要注意安全。";
const questions=[["风筝为什么会飞走？",["因为风筝线断了","因为下雨了","因为妹妹放手了"],0],["他们先找到了什么线索？",["一个新风筝","一根细细的红线","一只小鸟"],1],["这个故事告诉我们什么？",["看到风筝就要爬树","找东西时只靠猜","观察线索，也要注意安全"],2]];
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.82;speechSynthesis.speak(u)}
function show(s){$('content').innerHTML=s;$('modal').classList.add('open')}
function closeModal(){speechSynthesis?.cancel();$('modal').classList.remove('open')}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
const vocab={风:['fēng','大风，风筝'],线:['xiàn','毛线，风筝线'],找:['zhǎo','找到，寻找']};
function word(w){const a=vocab[w];show('<h2>'+w+' · '+a[0]+'</h2><p class="text">'+a[1]+'</p><button class="cta" onclick="say(\''+w+'，'+a[1]+'\')">🔊 再听一遍</button>');say(w+'。'+a[1])}
function tellStory(){show('<h2>📖 消失的红色风筝</h2><p class="text">'+fullStory+'</p><button class="cta" onclick="say(fullStory)">🔊 再听一遍</button>');say(fullStory)}
function startQuiz(){index=0;correctCount=0;renderQuestion()}
function renderQuestion(){if(index===questions.length){const message='故事闯关完成，三题答对'+correctCount+'道';show('<h2>🌟 闯关完成</h2><p class="text">'+message+'</p><button class="cta" onclick="closeModal()">返回课程</button>');const detail={score:correctCount,total:3,at:new Date().toISOString()};try{sessionStorage.setItem('kiteDay9Quiz',JSON.stringify(detail))}catch(e){}if(new URLSearchParams(location.search).get('embed')==='1'&&parent!==window)parent.postMessage({type:'v6-kite-quiz-complete',lessonDay:16,score:correctCount,total:3},location.origin);say(message);return}locked=false;const q=questions[index];show('<h2>第'+(index+1)+'/3题</h2><p class="text">'+q[0]+'</p>'+q[1].map((v,j)=>'<button class="opt" data-a="'+j+'">'+String.fromCharCode(65+j)+'．'+v+'</button>').join('')+'<p class="status" id="feedback"></p><button class="cta" onclick="say(questions[index][0]+\'。\'+questions[index][1].join(\'。\'))">🔊 听题目</button><button class="cta" id="next" style="display:none" onclick="index++;renderQuestion()">下一题 →</button>');$('content').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const ok=Number(b.dataset.a)===q[2];if(ok)correctCount++;$('feedback').textContent=ok?'恭喜你回答正确！':'哦哦，正确答案是：'+q[1][q[2]];say(ok?'恭喜你回答正确':'哦哦，正确答案是'+q[1][q[2]]);$('content').querySelectorAll('[data-a]').forEach(e=>e.disabled=true);$('next').style.display='block'})}
function trace(w){show('<h2>✍️ '+w+' · 手指描红</h2><p class="small">跟着田字格练习书写。本画板不自动判定笔顺。</p><div class="trace"><span>'+w+'</span><canvas id="pad"></canvas></div><button class="cta" onclick="trace(\''+w+'\')">清除重写</button><button class="cta" onclick="say(\''+w+'\')">🔊 听读</button><button class="cta" onclick="closeModal()">完成描红</button>');const c=$('pad'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const ctx=c.getContext('2d');ctx.scale(d,d);ctx.strokeStyle='#eb5c50';ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';let drawing=false;c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)};c.onpointermove=e=>{if(!drawing)return;const r=c.getBoundingClientRect();ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false}
</script></body></html>
