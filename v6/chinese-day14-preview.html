<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11月25日语文 · 校门口的蓝色雨伞</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#edf7f4;color:#274753}main{width:min(100%,760px);margin:auto;padding:10px}.panel{background:white;border-radius:18px;overflow:hidden;padding:10px;margin-bottom:14px;box-shadow:0 4px 18px #77999933}.panel h2{font-size:20px;margin:8px 5px 12px}.image-wrap{position:relative}.image-wrap img{display:block;width:100%;height:auto;border-radius:12px}.overlay{position:absolute;inset:0}.overlay button{position:absolute;background:transparent;border:0;cursor:pointer;touch-action:manipulation}.overlay button:focus-visible{outline:3px solid #ffc65f;background:#ffe38d44}.hint{font-size:13px;color:#627e84;line-height:1.7;margin:8px 4px}.dialogBack{position:fixed;inset:0;background:#102c3bca;display:none;align-items:center;justify-content:center;padding:12px;z-index:900}.dialogBack.open{display:flex}.dialog{width:100%;max-width:560px;max-height:93dvh;overflow:auto;background:white;border-radius:19px;padding:16px}.dialog header{display:flex;align-items:start;justify-content:space-between;gap:10px}.dialog header h2{font-size:21px;margin:6px 0 12px}.close{width:42px;height:42px;border-radius:50%;border:0;font-size:25px;background:#eaf6f9}.dialogText{font-size:17px;line-height:1.9;white-space:pre-line;margin:8px 0 14px}.big,.choice{display:block;width:100%;border:0;border-radius:12px;background:#1599ba;color:white;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin:8px 0}.choice{background:#e8f8fd;border:2px solid #9dd8e6;color:#22506b}.answerRow{display:flex;gap:8px;align-items:stretch;margin:9px 0}.option{flex:1;text-align:left;background:#eafaff;border:2px solid #99d7e4;border-radius:12px;padding:14px;font-size:16px;min-width:0}.speakOption{flex:0 0 58px;border:2px solid #8acdda;backgr size:clamp(54px,14vw,86px);line-height:1.1;font-weight:800;color:#233d4b}.studyPinyin{font-size:clamp(19px,5vw,27px);font-weight:800;color:#5e5279}.studyParts{font-size:clamp(12px,3.4vw,17px);color:#456a79;font-weight:700}.studyBtn{border:0;background:#1898bf;color:white;border-radius:12px;width:100%;padding:11px 3px;font-size:clamp(11px,2.8vw,15px);font-weight:700;cursor:pointer}.studyBtn.hear{background:#477bb9}.studyBtn.trace{background:#b97842}.studyBtn:focus-visible{outline:3px solid #faca60}.poemCard{border-radius:18px;border:2px solid #e6cbbd;background:#fff5e7;padding:16px;text-align:center;line-height:1.9}.poemCard h3{margin:4px}.poemCard button{border:0;border-radius:12px;background:#c67853;color:white;padding:12px 20px;font-size:16px;font-weight:700}@media(max-width:360px){.studyGrid{gap:5px}.studyCard{padding:8px 4px}}</style></head><body><main><section class="panel"><h2>一、拼音小课堂</h2><div class="image-wrap"><img src="./11-25_01_pinyin.jpg?v=1" alt="一、拼音小课堂"><div class="overlay"><button aria-label="伞：打开拼音闯关" data-blend="伞" style="left:10%;top:22%;width:80%;height:20%"></button><button aria-label="蓝：打开拼音闯关" data-blend="蓝" style="left:10%;top:42%;width:80%;height:20%"></button><button aria-label="等：打开拼音闯关" data-blend="等" style="left:10%;top:62%;width:80%;height:20%"></button></div></div><p class="hint">点三行生字卡进入声母、韵母、声调拼读。新字是伞、蓝、等。</p></section><section class="panel"><h2>二、绘本故事</h2><div class="image-wrap"><img src="./11-25_02_story.jpg?v=1" alt="二、绘本故事"><div class="overlay"><button data-story aria-label="朗读蓝色雨伞故事" style="inset:0;width:100%;height:100%"></button></div></div><p class="hint">点击整张四格故事图，收听完整故事。</p></section><section class="panel"><h2>三、阅读理解闯关</h2><div class="image-wrap"><img src="./11-25_03_quiz.jpg?v=1" alt="三、阅读理解闯关"><div class="overlay"><button data-quiz aria-label="打开四道阅读理解题" style="inset:0;width:100%;height:100%"></button></div></div><p class="hint">点击图片只打开第 1 题；题目和每个答案都有独立语音，不能从图片直接提交答案。</p></section><section class="panel"><h2>四、识字与手指描红</h2><p class="hint">这部分不用重复的图片，点击卡片上的功能按钮直接练习。</p><div class="studyGrid"><article class="studyCard"><div class="studyIcon">☂️</div><div class="studyChar">伞</div><div class="studyPinyin">sǎn</div><div class="studyParts">s + an</div><button class="studyBtn" data-blend="伞">🧩 拼音闯关</button><button class="studyBtn hear" data-hear="伞">🔊 听完整读音</button><button class="studyBtn trace" data-trace="伞">✍️ 手指描红</button></article><article class="studyCard"><div class="studyIcon">💙</div><div class="studyChar">蓝</div><div class="studyPinyin">lán</div><div class="studyParts">l + an</div><button class="studyBtn" data-blend="蓝">🧩 拼音闯关</button><button class="studyBtn hear" data-hear="蓝">🔊 听完整读音</button><button class="studyBtn trace" data-trace="蓝">✍️ 手指描红</button></article><article class="studyCard"><div class="studyIcon">⏳</div><div class="studyChar">等</div><div class="studyPinyin">děng</div><div class="studyParts">d + eng</div><button class="studyBtn" data-blend="等">🧩 拼音闯关</button><button class="studyBtn hear" data-hear="等">🔊 听完整读音</button><button class="studyBtn trace" data-trace="等">✍️ 手指描红</button></article></div></section><section class="panel"><h2>五、古诗接句复习</h2><div class="poemCard"><h3>《赠汪伦》· 李白</h3>桃花潭水深千尺，__________。<p><button data-review>🎵 听上句接下句</button></p></div></section></main><div id="modal" class="dialogBack"><div class="dialog"><header><h2 id="dialogTitle"></h2><button id="close" class="close" aria-label="关闭">×</button></header><p id="dialogText" class="dialogText"></p><div id="dialogControls"></div><p id="dialogHint" class="hint"></p></div></div><script>const LESSON_DATA={"story":"星期三下午，天空突然下起了大雨。放学后，小宇在校门口的长椅上，发现一把蓝色雨伞，伞柄系着黄色丝带，上面写着“王奶奶”。小宇没有把雨伞带走，而是交给值班老师，说：老师，这把伞是别人落下的，请您帮忙保管。老师夸奖他做得对。过了一会儿，同学乐乐急匆匆地跑过来，说：老师，我想借一把伞去接奶奶，她还在校门口等我，雨这么大，会淋湿的。老师说：这把蓝色雨伞还没确认主人，我们不能随便借走。不过学校有一把备用伞，你先拿去帮助奶奶吧。小宇又指着蓝伞上的丝带，说：上面写着“王奶奶”，会不会是乐乐的奶奶？老师和乐乐联系了王奶奶。原来，这正是王奶奶早晨不小心落在学校的伞。后来王奶奶来到学校，从老师手中领回自己的蓝色雨伞。她高兴地说：谢谢你们！多亏了你们的帮助。小宇和乐乐都笑了。小宇明白了：不是自己的东西不能随便拿走，而留心小线索、关心别人，也能解决问题。","questions":[["是谁先发现校门口的蓝色雨伞？",["小宇","乐乐","值班老师"],0],["老师为什么没有直接把蓝伞借给乐乐？",["因为还没有确认伞的主人","因为蓝色雨伞坏了","因为乐乐不想回家"],0],["雨伞的黄色丝带提供了什么线索？",["雨伞是去年买的","上面写着“王奶奶”","雨伞很贵"],1],["小宇做了哪件有意义的事？",["把陌生人的伞直接带回家","帮忙把失物交给老师并寻找主人","把雨伞丢在长椅上"],1]],"chars":[{"c":"伞","p":"sǎn","initial":"s","final":"an","tone":3,"word":"雨伞","emoji":"☂️"},{"c":"蓝","p":"lán","initial":"l","final":"an","tone":2,"word":"蓝色","emoji":"💙"},{"c":"等","p":"děng","initial":"d","final":"eng","tone":3,"word":"等待","emoji":"⏳"}]};(function lesson(){
"use strict";
const $=id=>document.getElementById(id);
const story=LESSON_DATA.story, questions=LESSON_DATA.questions;
const chars=Object.fromEntries(LESSON_DATA.chars.map(x=>[x.c,x]));
let qi=0,answers=[],score=0,current="",phase=0,poemStage=0;
function speak(t){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.78;window.speechSynthesis.speak(u)}
function mk(label,fn,cls="big"){const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=label;b.onclick=fn;return b}
function modal(title,text,buttons){$("dialogTitle").textContent=title;$("dialogText").textContent=text;$("dialogControls").replaceChildren(...buttons);$("dialogHint").textContent="";$("modal").classList.add("open")}
function close(){window.speechSynthesis?.cancel();$("modal").classList.remove("open")}
function readStory(){modal("📖 校门口的蓝色雨伞",story,[mk("🔊 再听完整故事",()=>speak(story))]);speak(story)}
function startQuiz(){qi=0;score=0;answers=Array(questions.length).fill(null);showQuiz()}
function readQuiz(){const q=questions[qi];speak(q[0]+"。"+q[1].map((a,i)=>"选项"+String.fromCharCode(65+i)+"，"+a).join("。"))}
function showQuiz(){
 if(qi>=questions.length){endQuiz();return}
 const q=questions[qi],locked=answers[qi]!==null;
 const buttons=[mk("🔊 朗读题目和三个选项",readQuiz)];
 q[1].forEach((a,i)=>{const row=document.createElement("div");row.className="answerRow";const select=mk(String.fromCharCode(65+i)+"．"+a,()=>selectQuiz(i),"option");select.disabled=locked;const audio=mk("🔊",()=>speak(String.fromCharCode(65+i)+"，"+a),"speakOption");audio.setAttribute("aria-label","朗读"+String.fromCharCode(65+i)+"选项");row.append(select,audio);buttons.push(row)});
 if(locked){const p=document.createElement("p");p.className="feedback";p.textContent=answers[qi]===q[2]?"恭喜你回答正确！":"正确答案："+q[1][q[2]];buttons.push(p);buttons.push(mk("下一题 →",()=>{qi++;showQuiz()}))}
 modal("☔ 雨伞阅读闯关 · 第"+(qi+1)+" / "+questions.length+"题",q[0],buttons)
}
function selectQuiz(i){if(answers[qi]!==null)return;answers[qi]=i;const ok=i===questions[qi][2];if(ok)score++;showQuiz();speak(ok?"恭喜你回答正确！":"哦哦，正确答案是"+questions[qi][1][questions[qi][2]])}
function endQuiz(){const msg="阅读闯关完成。答对"+score+"题，共四题。";modal("🌟 闯关完成",msg,[mk("完成",close)]);try{sessionStorage.setItem("umbrellaDay14Quiz",JSON.stringify({score,total:4,at:new Date().toISOString()}))}catch(e){}if(new URLSearchParams(location.search).get("embed")==="1"&&parent!==window)parent.postMessage({type:"v6-umbrella-quiz-complete",lessonDay:25,score,total:4},location.origin);speak(msg)}
function steps(d){return[{key:"initial",label:"声母",options:["s","l","d"]},{key:"final",label:"韵母",options:["an","eng","in"]},{key:"tone",label:"声调",options:[1,2,3,4]}]}
function openBlend(c){current=c;phase=0;renderBlend();speak(c+"。"+chars[c].word)}
function renderBlend(){
 const d=chars[current],ss=steps(d);
 if(phase>=ss.length){modal("🌟 拼读成功 · "+current,d.initial+" + "+d.final+" → "+d.p,[mk("🔊 听标准读音",()=>speak(current+"。"+d.word)),mk("✍️ 手指描红",()=>trace(current)),mk("🔁 再练一遍",()=>openBlend(current))]);speak(current+"。"+d.word);return}
 const st=ss[phase];const buttons=st.options.map(v=>mk(st.key==="tone"?["","一声","二声","三声","四声"][v]:v,()=>{if(v!==d[st.key]){$("dialogHint").textContent="再试一次，找出正确的拼音部分。";return}phase++;renderBlend()},"choice"));
 buttons.push(mk("🔊 听完整汉字",()=>speak(current+"。"+d.word)));
 modal("🔤 "+current+" · "+d.p,"第"+(phase+1)+"步：请选择"+st.label,buttons);$("dialogHint").textContent="声母和韵母暂不播放未经校验的独立字母音。"
}
function trace(c){
 modal("✍️ "+c+" · 手指描红","在田字格中沿着浅色范字描写。",[mk("清除重写",()=>trace(c)),mk("🔊 听读汉字",()=>speak(c)),mk("✅ 完成描红",close)]);
 const zone=document.createElement("div");zone.className="traceArea";const glyph=document.createElement("span");glyph.textContent=c;const canvas=document.createElement("canvas");zone.append(glyph,canvas);$("dialogControls").prepend(zone);
 const box=canvas.getBoundingClientRect(),scale=window.devicePixelRatio||1;canvas.width=Math.round(box.width*scale);canvas.height=Math.round(box.height*scale);const ctx=canvas.getContext("2d");ctx.scale(scale,scale);ctx.lineWidth=8;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#f05a43";let down=false;
 canvas.onpointerdown=e=>{down=true;canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)};
 canvas.onpointermove=e=>{if(!down)return;const r=canvas.getBoundingClientRect();ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()};
 canvas.onpointerup=()=>down=false;canvas.onpointercancel=()=>down=false
}
const poem="李白乘舟将欲行，忽闻岸上踏歌声。桃花潭水深千尺，不及汪伦送我情。";
function reviewPoem(){poemStage=0;modal("🌸 古诗复习 · 赠汪伦","李白乘舟将欲行，忽闻岸上踏歌声。\n桃花潭水深千尺，__________。",[mk("🔊 听上句",()=>speak("桃花潭水深千尺")),mk("揭晓下一句",revealPoem)]);speak("桃花潭水深千尺")}
function revealPoem(){modal("《赠汪伦》 · 接句答案","桃花潭水深千尺，不及汪伦送我情。",[mk("🔊 听完整古诗",()=>speak(poem)),mk("再练一次",reviewPoem)]);speak("不及汪伦送我情")}
document.querySelector("[data-story]").onclick=readStory;document.querySelector("[data-quiz]").onclick=startQuiz;
document.querySelectorAll("[data-blend]").forEach(b=>b.onclick=()=>openBlend(b.dataset.blend));
document.querySelectorAll("[data-trace]").forEach(b=>b.onclick=()=>trace(b.dataset.trace));
document.querySelectorAll("[data-hear]").forEach(b=>b.onclick=()=>speak(b.dataset.hear+"。"+chars[b.dataset.hear].word));
document.querySelector("[data-review]").onclick=reviewPoem;
$("close").onclick=close;$("modal").onclick=e=>{if(e.target===$("modal"))close()}
})();</script></body></html>
