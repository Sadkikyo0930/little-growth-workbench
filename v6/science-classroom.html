<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小赛车 · 科学探索岛</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf7ff;color:#24485d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:750px;margin:auto;padding:12px}.hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(125deg,#1b729d,#49bda9 65%,#a9d77a);padding:22px;color:white;min-height:160px}.hero h1{font-size:27px;margin:7px 0}.hero p{max-width:70%;line-height:1.6}.hero:after{content:"🔬";font-size:92px;position:absolute;right:12px;bottom:-8px;transform:rotate(-15deg)}.panel{background:white;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 20px #2c708015}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{border:1px solid #b9d8e4;background:#f2fbff;border-radius:12px;padding:10px 12px;color:#256485;font-weight:700}.nav button.on{background:#176f9b;color:white}.pill{background:#e3f8ed;color:#23835c;border-radius:20px;padding:6px 12px;display:inline-block;font-size:13px;font-weight:700}.scene{background:linear-gradient(150deg,#e1f6ff,#f9fbe9);border-radius:18px;text-align:center;padding:22px;margin:16px 0}.scene .emoji{font-size:90px;line-height:1.3}.scene p{line-height:1.7}.q{font-size:23px;font-weight:800;line-height:1.5}.answers{display:grid;gap:10px;margin:16px 0}.answers button{border:2px solid #a9d9e8;background:#f2fbff;border-radius:15px;padding:15px 12px;font-size:18px;color:#245875;text-align:left;font-weight:650}.answers button:disabled{opacity:.7}.answers button.correct{background:#d9f7e6;border-color:#39aa79}.answers button.wrong{background:#fff0e8;border-color:#ec8a6c}.action{border:0;border-radius:13px;padding:13px 17px;background:#157ea5;color:white;font-size:16px;font-weight:800;margin:5px 5px 5px 0}.next{background:#238f68;width:100%}.feedback{min-height:26px;line-height:1.6}.muted{color:#67889a;font-size:14px;line-height:1.7}.hidden{display:none!important}.progress{height:10px;background:#e3edf2;border-radius:20px;overflow:hidden}.progress i{display:block;background:#3aa7a1;height:100%;transition:width .25s}.embedded .nav,.embedded #navCard{display:none}.embedded main{padding:5px}.embedded .panel{box-shadow:none;margin:7px 0}.embedded .hero{min-height:145px}@media(max-width:420px){.hero h1{font-size:23px}.hero:after{font-size:70px}.scene .emoji{font-size:72px}}
</style></head><body><main><header class="hero"><span>🏎️ V6 · 小小赛车成长工坊</span><h1>🌿 科学探索岛</h1><p>发现问题 · 动手观察 · 勇敢猜想</p></header><section class="panel" id="navCard"><strong>家长课程预览 · 9节科学课</strong><p class="muted">按学习日安排，独立完成，不会因休息而跳课。</p><div class="nav" id="nav"></div></section><section class="panel"><span class="pill" id="lessonTag"></span><h2 id="title"></h2><div class="scene"><div class="emoji" id="emoji"></div><p id="hook"></p></div><p id="fact"></p><button class="action" id="listen">🔊 听科学讲解</button><button class="action" id="experiment">🧪 今天的小实验</button><p class="muted hidden" id="experimentText"></p></section><section class="panel"><div class="progress"><i id="bar"></i></div><p class="muted" id="counter"></p><div id="quiz"></div></section><p class="muted">科学实验请家长陪同；不使用火、危险化学品或深水。学习结果保存在本设备浏览器中。</p></main><script>
(()=>{'use strict';const lessons=[["水的旅行","💧","观察一杯水，猜猜它会去哪里。","水会蒸发成看不见的水蒸气；遇冷又可能变成小水滴。","在透明杯外壁观察水珠，和大人讨论水珠从哪里来。",[["湿衣服晒干后，水主要去了哪里？","变成水蒸气进入空气","变成沙子","钻进衣架",0],["冷杯子外面的小水珠主要来自哪里？","杯子里面漏出来","空气中的水蒸气遇冷","杯子长出来",1],["下雨前，云中的小水滴可能怎样变化？","聚集变大落下来","变成石头","永远不动",0],["哪种方法能让地上的水更快变干？","放在通风温暖处","盖住不透气","放进密封盒",0],["水蒸气通常是什么样的？","像白色棉花","通常看不见","像小石头",1]]],["种子的秘密","🌱","一粒小种子怎样长成植物？","多数种子萌发需要适当的水、空气和温度；长大后还需要光。","用湿纸巾和干纸巾各放一粒豆子，连续观察变化。",[["种子发芽通常需要什么？","适量的水","玩具车","彩色纸",0],["把种子一直泡在没有空气的水里，可能怎样？","不利于萌发","一定更快","变成石头",0],["植物长出绿叶后，阳光有什么作用？","帮助制造养分","让根变成铁","让土壤消失",0],["种子先长出的部分常常是什么？","根","花","果实",0],["怎样记录种子生长？","每天画图并标日期","只看一天","一直摇动",0]]],["影子的侦探","🔦","让玩具站在灯光下，影子会移动吗？","光沿直线传播；不透明物体挡住光，就可能出现影子。","手电筒照玩具，改变灯的位置，观察影子方向和长短。",[["影子通常出现在物体的哪一侧？","背着光的一侧","光源正前方","物体内部",0],["让手电筒靠近玩具，影子可能怎样？","变大","一定消失","变成彩虹",0],["什么物体容易形成清晰影子？","不透明积木","透明玻璃","清水",0],["没有光源时，通常能看到清楚影子吗？","不能","一定能","影子发光",0],["要改变影子的方向，可以怎样做？","移动光源","给玩具改名","换桌布颜色",0]]],["声音的旅行","🔔","闭眼听一听，能找到声音从哪里来吗？","物体振动产生声音，声音可通过空气、水和固体传播。","轻弹橡皮筋，观察它振动；停止振动再听声音。",[["拨动橡皮筋发声时，它在做什么？","振动","融化","发芽",0],["声音能通过什么传播？","空气","只有真空","只有光",0],["怎样让鼓声停止？","让鼓面停止振动","把鼓涂红","把鼓放高",0],["远处声音一般听起来怎样？","比较小","一定更大","变成颜色",0],["保护耳朵的好习惯是？","远离过大音量","贴着喇叭听","长时间开最大声",0]]],["磁铁小实验","🧲","哪些物品会被磁铁吸住？","磁铁能吸引铁等某些金属，但不是所有金属和物品都能被吸引。","在大人陪同下测试回形针、纸片、塑料盖，分类记录。",[["哪样物品通常能被磁铁吸住？","铁回形针","纸片","塑料杯",0],["磁铁会吸住所有金属吗？","不会","一定会","只有金色的会",0],["两个磁铁相同的磁极靠近时会怎样？","互相排斥","变成水","一定粘住",0],["做磁铁实验时应避免什么？","靠近电子设备和吞食小磁铁","用纸记录","请大人陪同",0],["怎样判断物品是否被磁铁吸引？","实际测试并记录","只看颜色","猜名字",0]]],["天气观察站","🌤️","今天的天空是什么样？","天气可以用云量、风、降水和气温描述；一天之内也会变化。","观察天空并画天气图标，连续三天记录。",[["天空有很多云，说明什么？","云量较多","一定下雪","太阳消失",0],["什么工具能测量气温？","温度计","尺子","放大镜",0],["风能让什么发生变化？","树叶摆动","石头发芽","水变成铁",0],["雨天出门怎样更安全？","穿防滑鞋并避开积水","在雷雨中站树下","踩深水坑",0],["想比较三天天气，最好怎样做？","每天同一时间记录","只记今天","只听别人猜",0]]],["漂浮与下沉","🚢","为什么大船能浮在水面？","物体浮沉与材料、形状和排开的水有关；相同材料改变形状也可能改变浮沉。","用橡皮泥捏球和小船，观察在水里的不同表现。",[["橡皮泥捏成小船后，可能怎样？","比球形更容易浮起","一定变成木头","不受水影响",0],["观察浮沉时应该怎样做？","逐个放入水中记录","一次丢很多","直接猜答案",0],["为什么空塑料瓶常常能浮？","里面有空气且整体密度较小","因为颜色鲜艳","因为名字叫瓶子",0],["同样一团橡皮泥改变什么可能影响浮沉？","形状","名字","标签",0],["水边做实验应注意？","大人陪同并远离深水","独自去河边","趴在水池边",0]]],["昆虫与小动物","🦋","蝴蝶和蜘蛛有什么不同？","典型昆虫有六条腿、头胸腹三部分；蜘蛛有八条腿，不是昆虫。","观察安全的昆虫图片，数腿、找触角、比较身体结构。",[["蝴蝶通常有几条腿？","6条","8条","10条",0],["蜘蛛是不是昆虫？","不是","是","所有小动物都是",0],["昆虫身体通常分成几部分？","3部分","1部分","6部分",0],["观察小动物的正确做法是？","保持距离不伤害它","随意抓陌生昆虫","破坏巢穴",0],["蝴蝶从毛毛虫变成成虫，经历了什么？","变态发育","变成石头","停止生长",0]]],["小小科学家挑战","🔬","把这个月的观察变成自己的发现！","科学探究常从提出问题开始，再预测、实验、记录和解释。","选一个喜欢的实验，画出预测、结果和新问题。",[["发现两盆植物长得不同，首先可以怎样做？","提出问题并观察条件","立刻宣布原因","不再观察",0],["实验时为什么要记录结果？","方便比较与解释","让纸变厚","让结果自动正确",0],["想知道光对植物的影响，应该尽量保持什么？","除光照外其他条件相似","每盆换不同土和水","随便放置",0],["实验结果与预测不同，应该怎样？","记录并重新思考","偷偷改记录","停止提问",0],["科学家最重要的习惯之一是？","认真观察并愿意修正想法","永远不犯错","只相信猜测",0]]]];const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);let day=Math.min(9,Math.max(1,Number(params.get('lesson'))||1)),index=0,correct=0,wrong=0,answered=false,results=[];if(params.has('embedded'))document.body.classList.add('embedded');function speak(s){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.85;window.speechSynthesis.speak(u)}function draw(){const l=lessons[day-1];$('lessonTag').textContent='科学第 '+day+' / 9 课';$('title').textContent=l[0];$('emoji').textContent=l[1];$('hook').textContent=l[2];$('fact').textContent=l[3];$('experimentText').textContent='👨‍👩‍👧 亲子观察：'+l[4];$('experimentText').classList.add('hidden');$('listen').onclick=()=>speak(l[2]+'。'+l[3]);$('experiment').onclick=()=>{$('experimentText').classList.toggle('hidden');if(!$('experimentText').classList.contains('hidden'))speak(l[4])};$('nav').replaceChildren();lessons.forEach((v,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' · '+v[1];b.className=day===i+1?'on':'';b.onclick=()=>{day=i+1;index=0;correct=0;wrong=0;results=[];draw()};$('nav').append(b)});show()}function show(){const l=lessons[day-1],q=l[5][index];$('bar').style.width=(index/5*100)+'%';$('counter').textContent=index<5?'观察闯关 · 第 '+(index+1)+' / 5 题':'本节挑战完成';$('quiz').replaceChildren();if(!q){finish();return}answered=false;const h=document.createElement('div');h.className='q';h.textContent=q[0];$('quiz').append(h);const a=document.createElement('div');a.className='answers';const f=document.createElement('p');f.className='feedback';q.slice(1,4).forEach((v,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' · '+v;b.onclick=()=>{if(answered)return;answered=true;const ok=i===q[4];if(ok)correct++;else wrong++;results.push({question:q[0],selected:i,correct:ok});a.querySelectorAll('button').forEach((x,k)=>{x.disabled=true;if(k===q[4])x.classList.add('correct');if(k===i&&!ok)x.classList.add('wrong')});f.textContent=ok?'🎉 观察得真仔细！':'🔍 再想一想：正确答案是「'+q[q[4]+1]+'」';speak(ok?'恭喜你回答正确':'哦哦，正确答案是'+q[q[4]+1]);next.classList.remove('hidden')};a.append(b)});$('quiz').append(a,f);const hear=document.createElement('button');hear.className='action';hear.textContent='🔊 听题目';hear.onclick=()=>speak(q[0]);const next=document.createElement('button');next.className='action next hidden';next.textContent=index===4?'完成科学探险 🏆':'下一题 →';next.onclick=()=>{index++;show()};$('quiz').append(hear,next)}function finish(){$('bar').style.width='100%';$('quiz').innerHTML='<h2>🏆 科学探险完成！</h2><p>答对 '+correct+' / 5 题。今天又发现了一个科学秘密！</p><p class="muted">可以把今天的小实验画下来，告诉家人你的发现。</p>';try{const key=params.get('cohort')==='20261109'?'v6_science_course_20261109_progress_v1':'v6_science_preview_progress_v1',p=JSON.parse(localStorage.getItem(key)||'{}');p[day]={correct,total:5,wrong,results,at:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(p))}catch(e){}if(params.get('cohort')==='20261109'&&window.parent!==window)window.parent.postMessage({type:'v6-science-lesson-complete',lesson:day,cohort:'20261109'},location.origin);speak('今天的科学探险完成啦！')}draw()})();
</script></body></html>
