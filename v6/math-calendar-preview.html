function start(){active=selectDaily(day);pos=0;first=0;errors=0;hints=0;results=[];$('lessonTitle').textContent='11月'+mathDates[day-1]+'日 · 数学第'+day+'课 · '+plan[day-1][0];$('challenge').textContent='思维挑战：'+plan[day-1][1];$('status').textContent='完整互动课程 · '+active.length+'题';show()}
function show(){const q=active[pos];miss=false;done=false;const area=$('interactive');area.replaceChildren();area.append(el('h3','', (q.stage||'基础练习')+' · 第'+(pos+1)+' / '+active.length+'题'),el('div','question',q.q));if(q.kind==='sudokuFill'){showSudoku(q,area);return}drawVisual(q,area);const choices=el('div','answers'),feedback=el('p','feedback','');const next=el('button','action next hidden',pos===active.length-1?'完成本日课程 ✓':'下一题 →');next.onclick=()=>{if(!done)return;if(pos===active.length-1)finish();else{pos++;show()}};q.choices.forEach(v=>{let b=el('button','',String(v));b.onclick=()=>{if(done)return;if(v===q.a){if(!miss)first++;done=true;results.push({question:q.q,firstTry:!miss});b.style.background='#c9f2d6';choices.querySelectorAll('button').forEach(x=>x.disabled=true);feedback.textContent='🌟 恭喜你回答正确！';next.classList.remove('hidden');speak('恭喜你回答正确')}else{miss=true;errors++;b.disabled=true;b.style.background='#ffe0dc';feedback.textContent='再想一想，可以点击提示。';speak('再想一想')}};choices.append(b)});area.append(choices,feedback);const hear=el('button','action','🔊 听题');hear.onclick=()=>speak(q.q);const hint=el('button','action','💡 提示');hint.onclick=()=>{hints++;feedback.textContent='💡 '+q.tip;speak(q.tip)};area.append(hear,hint,next)}
function finish(){const area=$('interactive');area.replaceChildren();area.append(el('h2','','🏆 本日数学闯关完成'),el('p','', '首次答对 '+first+' / '+active.length+' 题，错误尝试 '+errors+' 次，使用提示 '+hints+' 次。'));const retry=el('button','action','再练一次');retry.onclick=start;area.append(retry);try{const key='v6_math_month_progress_v1',old=JSON.parse(localStorage.getItem(key)||'{}');old[day]={first,total:active.length,errors,hints,at:new Date().toISOString(),results};localStorage.setItem(key,JSON.stringify(old))}catch(e){}speak('今天的数学探险完成啦！')}
