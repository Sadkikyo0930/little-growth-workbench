<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 数学日课程浏览</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf6fd;color:#224b65;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:790px;margin:auto;padding:14px}.hero{border-radius:22px;background:linear-gradient(110deg,#126ea4,#34b2c4);padding:24px 18px;color:#fff;min-height:150px;position:relative;overflow:hidden}.hero:before{content:"🏎️";position:absolute;right:18px;bottom:-24px;font-size:110px;transform:rotate(-12deg);opacity:.85}.hero h1{font-size:27px;margin:8px 0}.hero p{max-width:60%;line-height:1.6}.card{background:#fff;border-radius:19px;margin:14px 0;padding:17px;box-shadow:0 6px 18px #1b678719}.card h2{margin:0 0 12px;font-size:21px}.muted{color:#66879a;font-size:14px;line-height:1.6}.week{display:flex;gap:7px;overflow:auto;margin:12px 0}.week button{flex:1;min-width:68px}.week button,.dates button{border:1px solid #b5d9e6;background:#f4fbff;color:#235a78;border-radius:12px;padding:11px 6px;font-weight:700;cursor:pointer}.week button.active,.dates button.active{background:#197fae;color:white;border-color:#197fae}.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dates button{min-height:56px}.dates button small{display:block;font-size:11px;font-weight:400;margin-top:3px}.tag{display:inline-block;background:#e1f5ec;color:#21865b;padding:5px 9px;border-radius:12px;font-size:12px;font-weight:800}.question{font-size:25px;font-weight:800;margin:15px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers button{font-size:23px;font-weight:700;min-height:65px;background:#ecfaff;color:#255b78;border:2px solid #acd9e8;border-radius:14px}.answers button:disabled{opacity:.65}.action{border:0;border-radius:13px;padding:13px 17px;background:#167ba9;color:white;font-weight:800;font-size:16px;margin:5px 5px 5px 0}.next{background:#259b6c;width:100%;margin-top:12px}.hidden{display:none!important}.feedback{min-height:32px;font-size:16px;line-height:1.5}.ten{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:12px 0;max-width:480px}.ten i{aspect-ratio:1;background:#e6f0f4;border:1px solid #bad1dd;border-radius:6px}.ten i.on{background:#ffb84f}#lesson h3{margin-bottom:6px}#summary{line-height:1.8}@media(min-width:600px){.dates{grid-template-columns:repeat(7,1fr)}}@media(max-width:420px){.hero h1{font-size:24px}.hero:before{font-size:80px}.dates{grid-template-columns:repeat(4,1fr)}}
.cubeWrap{display:flex;align-items:flex-end;gap:18px;margin:15px 0;min-height:120px}.cubeCol{display:flex;flex-direction:column-reverse}.unitCube{width:43px;height:43px;background:linear-gradient(135deg,#86d8ff,#2c91ce);border:2px solid #14679a;display:grid;place-items:center;color:white;font-size:26px;margin-top:-1px;border-radius:5px}.groups{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.group{padding:9px;border:2px dashed #70b8c5;border-radius:12px;display:flex;flex-wrap:wrap;max-width:180px}.group span{font-size:23px}.sudoku{display:grid;grid-template-columns:repeat(4,46px);margin:12px 0}.sudoku div{width:46px;height:46px;border:1px solid #567b9b;display:grid;place-items:center;font-size:23px;font-weight:bold}.sudoku .missing{background:#ffdf7c;color:#9b5700}</style></head><body><main><header class="hero"><span>🏁 V6 数学探险岛</span><h1>30 个数学学习日</h1><p>赛车闯关 · 计算能力 · 数独与空间思维</p></header><section class="card"><h2>📅 数学日内容浏览</h2><p class="muted">点击学习日查看课程内容。30 个数学学习日均包含18道分层练习；点击日期可直接测试，成绩仅保存在当前浏览器。</p><div class="week" id="weeks"></div><div class="dates" id="dates"></div></section><section class="card" id="lesson"><span class="tag" id="status"></span><h2 id="lessonTitle"></h2><p id="challenge"></p><div id="interactive"></div></section><p class="muted">这是家长验收入口；每个学习日的闯关记录独立保存，不修改正式语文学习进度。</p></main><script>
(()=>{'use strict';
const plan=[
['20以内加法摸底','找规律'],['凑十法入门','十格填满10'],['凑十法进阶','4×4图形数独'],['20以内减法摸底','立体方块计数'],['破十法','数的分合'],['平十法','空间拼搭'],['三种十法综合','每周测评'],
['20以内混合加减','数字迷宫'],['看图列式','应用题条件'],['几个几个数','方块分组'],['相同数量的几组','4×4数独'],['认识乘法','积木阵列'],['2和5的乘法启蒙','模拟购物'],['加减与乘法复习','每周测评'],
['4×4图形数独','排除法'],['4×4数字数独','找规律'],['立体方块计数','隐藏方块'],['正面与俯视图','视角配对'],['方块计数进阶','空间旋转'],['对称与七巧板','图形拼搭'],['数独空间挑战','每周测评'],
['20以内巧算','计算策略'],['乘法分组进阶','阵列拼图'],['人民币购物找零','生活应用题'],['认识钟表','逻辑排序'],['复杂方块计数','三视图'],['多条件数学推理','数独进阶'],['数学侦探挑战','每周测评'],['错题专项训练','薄弱项强化'],['月末大闯关','能力成长报告']];
const $=id=>document.getElementById(id);let day=1,week=0,pos=0,first=0,errors=0,hints=0,miss=false,done=false,active=[],results=[];
const bank=[];const add=(d,q,a,choices,tip,kind='number',visual='')=>bank.push({d,q,a,choices,tip,kind,visual});
const n=(d,a,b,op='+')=>{if(op==='-'&&b>a)b=a-1;let v=op==='+'?a+b:a-b;const opts=[v,v-1,v+1,v+2].filter(x=>x>=0&&x<=30);while(opts.length<4)opts.push(v+opts.length+2);opts.sort((x,y)=>((x*17+d*13)%11)-((y*17+d*13)%11));add(d,a+' '+op+' '+b+' = ?',v,opts,'先想想能不能把一个数凑成10，再计算。','calc',String(a))};
const c=(d,q,a,tip,kind='number',visual='')=>{let choices=typeof a==='number'?[a,a+1,a-1,a+2].filter(x=>x>=0):[a,'左边','右边','都不是'];while(choices.length<4)choices.push(typeof a==='number'?a+choices.length+3:'其他');choices=choices.slice(0,4).sort((x,y)=>String(x).localeCompare(String(y),'zh-CN'));add(d,q,a,choices,tip,kind,visual)};
for(let d=1;d<=30;d++){const type=d===1?'addition':d===2||d===3?'make10':d===4?'sub':d===5?'break10':d===6?'flat10':d===7?'mixed':d===8?'mixed':d===9?'story':d===10?'group':d===11?'group':d===12?'multiply':d===13?'multiply':d===14?'mixed':d===15||d===16?'sudoku':d===17||d===18||d===19?'cube':d===20?'shape':d===21?'mixed':d===22?'mixed':d===23?'multiply':d===24?'money':d===25?'clock':d===26?'cube':d===27?'logic':d===28||d===29||d===30?'mixed':'addition';
if(type==='addition'||type==='make10'){for(let i=0;i<5;i++){const a=type==='make10'?8+(i%2):6+(i%4),b=4+((i+d)%6);n(d,a,b)}}
else if(type==='sub'||type==='break10'||type==='flat10'){for(let i=0;i<5;i++)n(d,12+((i+d)%7),4+(i%5),'-')}
else if(type==='group'||type==='multiply'){for(let i=0;i<5;i++){let groups=2+(i%3),each=2+((i+d)%4);c(d,groups+'组，每组'+each+'个，一共有多少个？',groups*each,'每组一样多，可以一组一组地加起来。','group',groups+'|'+each)}}
else if(type==='story'){for(let i=0;i<5;i++){let a=8+i,b=3+i%4;c(d,'赛车手有'+a+'枚徽章，又赢得'+b+'枚，现在有多少枚？',a+b,'把原来的徽章和新得到的徽章合起来。','story')}}
else if(type==='money'){for(let i=0;i<5;i++){let price=3+i,paid=10+i;c(d,'用'+paid+'元买一件'+price+'元的赛车玩具，应找回几元？',paid-price,'用付的钱减去商品价格。','money')}}
else if(type==='clock'){for(let i=0;i<5;i++){let start=2+i,end=start+2;c(d,'赛车训练从'+start+'时开始，经过2小时，是几时？',end,'在钟面上向前数两格。','clock')}}
else if(type==='cube'){for(let i=0;i<5;i++){let heights=[1+(i%3),2,1+((i+d)%2)];c(d,'三列方块分别叠了'+heights.join('、')+'层，一共有几块？',heights.reduce((a,b)=>a+b,0),'从左到右，每一列的方块都要数进去。','cube',heights.join('|'))}}
else if(type==='sudoku'){for(let i=0;i<5;i++){let sol=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],row=i%4,col=(i+1)%4;const ans=sol[row][col];c(d,'4×4数独：问号格应该填几？',ans,'每行、每列、每个2×2小宫都不能重复。','sudoku',row+'|'+col)}}
else if(type==='shape'){for(let i=0;i<5;i++)c(d,'下面哪种图形有'+(i%2?'4':'3')+'条边？',i%2?'正方形':'三角形','数一数每个图形的边。','shape')}
else if(type==='logic'){for(let i=0;i<5;i++){let a=2+i;c(d,'红赛车排第'+a+'，蓝赛车紧跟在红赛车后面，蓝赛车排第几？',a+1,'紧跟在后面就是序号加1。','logic')}}
else{for(let i=0;i<5;i++){let a=7+(i%4),b=4+((d+i)%6);n(d,a,b,i%2===0?'+':'-')}}
if(d===1){c(d,'2、5、8、11、？',14,'每次增加3。','pattern');}
else if(d%3===0){c(d,'3、6、9、12、？',15,'相邻两个数每次增加3。','pattern')}
else if(d%3===1){c(d,'5、7、9、11、？',13,'相邻两个数每次增加2。','pattern')}
else{c(d,'1、3、5、7、？',9,'观察奇数，每次增加2。','pattern')}

for(let i=0;i<4;i++){const a=7+(d+i)%6,b=2+(i%5);n(d,a,b,i%2?'-':'+');bank[bank.length-1].stage='进阶计算'}
for(let i=0;i<4;i++){const a=6+(d+i)%7,b=2+(i%4);if(d===10||d===11||d===12||d===13||d===23){const g=2+i%3,e=2+(d+i)%4;c(d,g+'排赛车，每排'+e+'辆，共有多少辆？',g*e,'相同数量的几组可以用连加。','group',g+'|'+e)}else if(d===17||d===18||d===19||d===26){const h=[1+i%3,2+i%2,1+d%3];c(d,'三列积木分别有'+h.join('、')+'层，一共几块？',h.reduce((x,y)=>x+y,0),'从底层往上逐列数。','cube',h.join('|'))}else if(d===15||d===16||d===21||d===27){const sol=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],row=(d+i)%4,col=i%4;c(d,'4×4数独：问号格填几？',sol[row][col],'排除同行、同列及同宫的数字。','sudoku',row+'|'+col)}else c(d,'红赛车有'+a+'枚徽章，又得到'+b+'枚，现在共有多少枚？',a+b,'把原来的和新得到的合起来。','story');bank[bank.length-1].stage='情景应用'}
for(let i=0;i<4;i++){if(i%2===0){const h=[1+(d+i)%3,2,1+i%3];c(d,'空间挑战：三列方块高度分别为'+h.join('、')+'，共几块？',h.reduce((x,y)=>x+y,0),'一列一列地数。','cube',h.join('|'))}else{const step=2+(d+i)%4,start=1+i;c(d,start+'、'+(start+step)+'、'+(start+2*step)+'、？',start+3*step,'比较相邻数字的差。','pattern')}bank[bank.length-1].stage='思维挑战'}

}
function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(t).replace(/\+/g,'加').replace(/=/g,'等于').replace(/\?/g,'多少'));u.lang='zh-CN';u.rate=.78;window.speechSynthesis.speak(u)}
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function renderCalendar(){const w=$('weeks');w.replaceChildren();['第1周','第2周','第3周','第4周','第5周'].forEach((s,i)=>{let b=el('button',i===week?'active':'',s);b.onclick=()=>{week=i;renderCalendar()};w.append(b)});const d=$('dates');d.replaceChildren();for(let i=week*7;i<Math.min(week*7+7,30);i++){const b=el('button',day===i+1?'active':'','第'+(i+1)+'天');b.append(el('small','',plan[i][0]));b.onclick=()=>{day=i+1;renderCalendar();start()};d.append(b)}}
function drawVisual(q,area){if(q.kind==='calc'){const a=Number(q.visual);let box=el('div','ten');for(let i=0;i<10;i++)box.append(el('i',i<a?'on':''));area.append(el('p','muted','十格观察：橙色表示第一个数。'),box)}
if(q.kind==='cube'){const h=q.visual.split('|').map(Number),wrap=el('div','cubeWrap');h.forEach(v=>{const column=el('div','cubeCol');for(let k=0;k<v;k++)column.append(el('div','unitCube','▣'));wrap.append(column)});area.append(wrap)}
if(q.kind==='group'){const [groups,each]=q.visual.split('|').map(Number),wrap=el('div','groups');for(let g=0;g<groups;g++){let part=el('div','group');for(let j=0;j<each;j++)part.append(el('span','','🏎️'));wrap.append(part)}area.append(wrap)}
if(q.kind==='sudoku'){const [row,col]=q.visual.split('|').map(Number),grid=el('div','sudoku');const sol=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];for(let r=0;r<4;r++)for(let k=0;k<4;k++){let cell=el('div',r===row&&k===col?'missing':'',r===row&&k===col?'?':String(sol[r][k]));if(r===1)cell.style.borderBottomWidth='3px';if(k===1)cell.style.borderRightWidth='3px';grid.append(cell)}area.append(grid)}
}
function start(){active=bank.filter(x=>x.d===day);pos=0;first=0;errors=0;hints=0;results=[];$('lessonTitle').textContent='第'+day+'天 · '+plan[day-1][0];$('challenge').textContent='思维挑战：'+plan[day-1][1];$('status').textContent='完整互动课程 · '+active.length+'题';show()}
function show(){const q=active[pos];miss=false;done=false;const area=$('interactive');area.replaceChildren();area.append(el('h3','', (q.stage||'基础练习')+' · 第'+(pos+1)+' / '+active.length+'题'),el('div','question',q.q));drawVisual(q,area);const choices=el('div','answers'),feedback=el('p','feedback','');const next=el('button','action next hidden',pos===active.length-1?'完成本日课程 ✓':'下一题 →');next.onclick=()=>{if(!done)return;if(pos===active.length-1)finish();else{pos++;show()}};q.choices.forEach(v=>{let b=el('button','',String(v));b.onclick=()=>{if(done)return;if(v===q.a){if(!miss)first++;done=true;results.push({question:q.q,firstTry:!miss});b.style.background='#c9f2d6';choices.querySelectorAll('button').forEach(x=>x.disabled=true);feedback.textContent='🌟 恭喜你回答正确！';next.classList.remove('hidden');speak('恭喜你回答正确')}else{miss=true;errors++;b.disabled=true;b.style.background='#ffe0dc';feedback.textContent='再想一想，可以点击提示。';speak('再想一想')}};choices.append(b)});area.append(choices,feedback);const hear=el('button','action','🔊 听题');hear.onclick=()=>speak(q.q);const hint=el('button','action','💡 提示');hint.onclick=()=>{hints++;feedback.textContent='💡 '+q.tip;speak(q.tip)};area.append(hear,hint,next)}
function finish(){const area=$('interactive');area.replaceChildren();area.append(el('h2','','🏆 本日数学闯关完成'),el('p','', '首次答对 '+first+' / '+active.length+' 题，错误尝试 '+errors+' 次，使用提示 '+hints+' 次。'));const retry=el('button','action','再练一次');retry.onclick=start;area.append(retry);try{const key='v6_math_month_progress_v1',old=JSON.parse(localStorage.getItem(key)||'{}');old[day]={first,total:active.length,errors,hints,at:new Date().toISOString(),results};localStorage.setItem(key,JSON.stringify(old))}catch(e){}speak('今天的数学探险完成啦！')}
renderCalendar();start();
})();
</script></body></html>
