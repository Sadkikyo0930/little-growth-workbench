<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 数学日课程浏览</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf6fd;color:#224b65;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:790px;margin:auto;padding:14px}.hero{border-radius:22px;background:linear-gradient(110deg,#126ea4,#34b2c4);padding:24px 18px;color:#fff;min-height:150px;position:relative;overflow:hidden}.hero:before{content:"🏎️";position:absolute;right:18px;bottom:-24px;font-size:110px;transform:rotate(-12deg);opacity:.85}.hero h1{font-size:27px;margin:8px 0}.hero p{max-width:60%;line-height:1.6}.card{background:#fff;border-radius:19px;margin:14px 0;padding:17px;box-shadow:0 6px 18px #1b678719}.card h2{margin:0 0 12px;font-size:21px}.muted{color:#66879a;font-size:14px;line-height:1.6}.week{display:flex;gap:7px;overflow:auto;margin:12px 0}.week button{flex:1;min-width:68px}.week button,.dates button{border:1px solid #b5d9e6;background:#f4fbff;color:#235a78;border-radius:12px;padding:11px 6px;font-weight:700;cursor:pointer}.week button.active,.dates button.active{background:#197fae;color:white;border-color:#197fae}.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dates button{min-height:56px}.dates button small{display:block;font-size:11px;font-weight:400;margin-top:3px}.tag{display:inline-block;background:#e1f5ec;color:#21865b;padding:5px 9px;border-radius:12px;font-size:12px;font-weight:800}.question{font-size:25px;font-weight:800;margin:15px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers button{font-size:23px;font-weight:700;min-height:65px;background:#ecfaff;color:#255b78;border:2px solid #acd9e8;border-radius:14px}.answers button:disabled{opacity:.65}.action{border:0;border-radius:13px;padding:13px 17px;background:#167ba9;color:white;font-weight:800;font-size:16px;margin:5px 5px 5px 0}.next{background:#259b6c;width:100%;margin-top:12px}.hidden{display:none!important}.feedback{min-height:32px;font-size:16px;line-height:1.5}.ten{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:12px 0;max-width:480px}.ten i{aspect-ratio:1;background:#e6f0f4;border:1px solid #bad1dd;border-radius:6px}.ten i.on{background:#ffb84f}#lesson h3{margin-bottom:6px}#summary{line-height:1.8}@media(min-width:600px){.dates{grid-template-columns:repeat(7,1fr)}}@media(max-width:420px){.hero h1{font-size:24px}.hero:before{font-size:80px}.dates{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main><header class="hero"><span>🏁 V6 数学探险岛</span><h1>30 个数学学习日</h1><p>赛车闯关 · 计算能力 · 数独与空间思维</p></header><section class="card"><h2>📅 数学日内容浏览</h2><p class="muted">点击学习日查看课程内容。第1天已制作完整互动题目，其余日期展示课程规划，等待逐日制作。</p><div class="week" id="weeks"></div><div class="dates" id="dates"></div></section><section class="card" id="lesson"><span class="tag" id="status"></span><h2 id="lessonTitle"></h2><p id="challenge"></p><div id="interactive"></div></section><p class="muted">这是家长验收入口，浏览其他日期不会修改孩子正式学习进度。</p></main><script>
(()=>{'use strict';const plan=[{"day":1,"title":"20以内加法摸底","challenge":"凑十积木与找规律"},{"day":2,"title":"凑十法入门","challenge":"十格填满10"},{"day":3,"title":"凑十法进阶","challenge":"4×4图形数独"},{"day":4,"title":"20以内减法摸底","challenge":"立体方块数数"},{"day":5,"title":"破十法","challenge":"数的分合"},{"day":6,"title":"平十法","challenge":"空间拼搭"},{"day":7,"title":"三种十法综合","challenge":"每周测评"},{"day":8,"title":"20以内混合加减","challenge":"数字迷宫"},{"day":9,"title":"看图列式","challenge":"应用题条件"},{"day":10,"title":"几个几个数","challenge":"方块分组"},{"day":11,"title":"相同数量的几组","challenge":"4×4数独"},{"day":12,"title":"认识乘法","challenge":"积木阵列"},{"day":13,"title":"2和5的乘法启蒙","challenge":"模拟购物"},{"day":14,"title":"加减与乘法复习","challenge":"每周测评"},{"day":15,"title":"4×4图形数独","challenge":"排除法"},{"day":16,"title":"4×4数字数独","challenge":"找规律"},{"day":17,"title":"立体方块计数","challenge":"隐藏方块"},{"day":18,"title":"正面与俯视图","challenge":"视角配对"},{"day":19,"title":"方块计数进阶","challenge":"空间旋转"},{"day":20,"title":"对称与七巧板","challenge":"图形拼搭"},{"day":21,"title":"数独空间挑战","challenge":"每周测评"},{"day":22,"title":"20以内巧算","challenge":"计算策略"},{"day":23,"title":"乘法分组进阶","challenge":"阵列拼图"},{"day":24,"title":"人民币购物找零","challenge":"生活应用题"},{"day":25,"title":"认识钟表","challenge":"逻辑排序"},{"day":26,"title":"复杂方块计数","challenge":"三视图"},{"day":27,"title":"多条件数学推理","challenge":"数独进阶"},{"day":28,"title":"数学侦探挑战","challenge":"每周测评"},{"day":29,"title":"错题专项训练","challenge":"薄弱项强化"},{"day":30,"title":"月末大闯关","challenge":"能力成长报告"}],qs=[["8 + 5 = ?",13,[12,13,14,15],"8差2凑成10，把5分成2和3。"],["9 + 7 = ?",16,[15,16,17,18],"9差1凑成10，把7分成1和6。"],["6 + 8 = ?",14,[12,13,14,15],"6差4凑成10，把8分成4和4。"],["7 + 9 = ?",16,[15,16,17,18],"7差3凑成10，把9分成3和6。"],["5 + 8 = ?",13,[12,13,14,15],"5差5凑成10，把8分成5和3。"],["9 + 9 = ?",18,[16,17,18,19],"9+1=10，另一个9还剩8。"],["2、5、8、11、？",14,[12,13,14,15],"每次增加3。"],["🔴 🔵 🔵 ｜ 🔴 🔵 🔵 ｜ 🔴 ？","🔵",["🔴","🔵","🟢","🟡"],"三个图形一组：红、蓝、蓝。"]];let week=0,day=1,pos=0,first=0,errors=0,hints=0,miss=false,done=false;const $=id=>document.getElementById(id);
function speak(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replaceAll('+','加').replaceAll('=','等于').replaceAll('?','多少'));u.lang='zh-CN';u.rate=.78;window.speechSynthesis.speak(u)}
function calendar(){const w=$('weeks');w.replaceChildren();['第1周','第2周','第3周','第4周','第5周'].forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.className=i===week?'active':'';b.onclick=()=>{week=i;calendar()};w.append(b)});const d=$('dates');d.replaceChildren();const start=week*7,end=Math.min(start+7,30);for(let i=start;i<end;i++){const item=plan[i],b=document.createElement('button');b.className=day===item.day?'active':'';b.innerHTML='第'+item.day+'天<small>'+item.title+'</small>';b.onclick=()=>{day=item.day;calendar();showLesson()};d.append(b)}}
function showLesson(){const p=plan[day-1];$('lessonTitle').textContent='第'+day+'天 · '+p.title;$('challenge').textContent='思维挑战：'+p.challenge;$('status').textContent=day===1?'可互动体验':'课程规划预览';$('interactive').replaceChildren();if(day===1){pos=0;first=0;errors=0;hints=0;renderQuestion()}else{const info=document.createElement('p');info.className='muted';info.textContent='本日计划包含：① 情景讲解 ② 动手操作 ③ 逐题闯关 ④ '+p.challenge+'。完整题目与互动素材将在第1天验收后制作。';$('interactive').append(info)}}
function renderQuestion(){const q=qs[pos];miss=false;done=false;const area=$('interactive');area.replaceChildren();const label=document.createElement('h3');label.textContent='第'+(pos+1)+'/8题 · '+(pos<6?'20以内加法':'找规律');const title=document.createElement('div');title.className='question';title.textContent=q[0];area.append(label,title);if(pos<6){const ten=document.createElement('div');ten.className='ten';const n=parseInt(q[0],10);for(let i=0;i<10;i++){let c=document.createElement('i');if(i<n)c.className='on';ten.append(c)}area.append(ten)}const choices=document.createElement('div');choices.className='answers';const feedback=document.createElement('p');feedback.className='feedback';const next=document.createElement('button');next.className='action next hidden';next.textContent=pos===7?'查看今日成绩 ✓':'下一题 →';next.onclick=()=>{if(!done)return;if(pos===7){area.replaceChildren();const s=document.createElement('p');s.id='summary';s.textContent='🏆 完成！首次答对 '+first+'/8 题，错误尝试 '+errors+' 次，使用提示 '+hints+' 次。';area.append(s);try{localStorage.setItem('v6_math_day1_preview',JSON.stringify({first,total:8,errors,hints,at:new Date().toISOString()}))}catch(e){}}else{pos++;renderQuestion()}};q[2].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(done)return;if(v===q[1]){if(!miss)first++;done=true;b.style.background='#c9f2d6';choices.querySelectorAll('button').forEach(x=>x.disabled=true);feedback.textContent='🌟 恭喜你回答正确！';next.classList.remove('hidden');speak('恭喜你回答正确')}else{miss=true;errors++;b.disabled=true;b.style.background='#ffe0dc';feedback.textContent='再想一想，或者点击提示。';speak('再想一想')}};choices.append(b)});area.append(choices,feedback);const hear=document.createElement('button');hear.className='action';hear.textContent='🔊 听题';hear.onclick=()=>speak(q[0]);const hint=document.createElement('button');hint.className='action';hint.textContent='💡 提示';hint.onclick=()=>{hints++;feedback.textContent='💡 '+q[3];speak(q[3])};area.append(hear,hint,next)}
calendar();showLesson()})();
</script></body></html>
