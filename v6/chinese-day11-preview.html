<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#e8f6ff,#f4fff5);margin:0;color:#234b5b}main{width:min(100%,760px);padding:10px;margin:auto}.panel{background:white;margin-bottom:14px;border-radius:17px;overflow:hidden;padding:10px;box-shadow:0 5px 20px #6ba6b32b}h2{font-size:20px;margin:7px 7px 12px}.image-wrap{position:relative;overflow:hidden;border-radius:13px}.image-wrap img{width:100%;height:auto;display:block}.overlay{position:absolute;inset:0}.overlay button{position:absolute;cursor:pointer;background:transparent;border:0;touch-action:manipulation}.overlay button:focus-visible{outline:3px solid #ffb940;background:#ffd86450}.hint{color:#56818c;font-size:13px;padding:0 6px;line-height:1.6}.big{width:100%;background:#1c9fc4;border:0;color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:16px;margin:4px 0 10px;cursor:pointer}.dialogBack{position:fixed;inset:0;background:#1b374ccc;display:none;align-items:center;justify-content:center;padding:12px;z-index:500}.dialogBack.open{display:flex}.dialog{max-width:540px;width:100%;max-height:92dvh;overflow:auto;background:white;border-radius:20px;padding:18px}.exit{float:right;border:0;border-radius:50%;height:43px;width:43px;font-size:25px;background:#e9f6fa}.dialog h2{margin:8px 0 20px}.bodyText{font-size:17px;line-height:1.9}.option{display:block;width:100%;padding:14px;margin:10px 0;border-radius:13px;background:#effbff;border:2px solid #9ad8e5;text-align:left;font-size:16px;cursor:pointer}.option:disabled{opacity:.7}.answerRow{display:flex;gap:8px;align-items:stretch;margin:10px 0}.answerRow .option{flex:1;margin:0;min-width:0}.speakOption{flex:0 0 58px;border:2px solid #89ccdc;background:#e9faff;border-radius:13px;font-size:23px;cursor:pointer;touch-action:manipulation}.speakOption:focus-visible{outline:3px solid #ffb940}.feedback{font-size:16px;font-weight:700;color:#108d6a}.traceArea{position:relative;height:260px;border:2px solid #9cdae4;border-radius:15px;background:linear-gradient(0deg,transparent 49.7%,#b8dce2 50%,transparent 50.3%),linear-gradient(90deg,transparent 49.7%,#b8dce2 50%,transparent 50.3%)}.traceArea span{position:absolute;inset:0;display:grid;place-items:center;font-size:150px;color:#d2e1e6;pointer-events:none}.traceArea canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
</style></head><body><main><section class="panel"><h2>一、拼音小课堂</h2><div class="image-wrap"><img src="./11-20_01_pinyin.jpg?v=1" alt="一、拼音小课堂"><div class="overlay"><button type="button" style="left:5%;top:45%;width:29%;height:45%" aria-label="光" onclick="learn('光')"></button><button type="button" style="left:36%;top:45%;width:28%;height:45%" aria-label="长" onclick="learn('长')"></button><button type="button" style="left:67%;top:45%;width:28%;height:45%" aria-label="短" onclick="learn('短')"></button></div></div><p class="hint">点击三个生字或词语，听读光、长、短。</p></section><section class="panel"><h2>二、绘本故事</h2><div class="image-wrap"><img src="./11-20_02_story.jpg?v=1" alt="二、绘本故事"><div class="overlay"><button type="button" style="left:0%;top:0%;width:100%;height:100%" aria-label="story" onclick="listenStory()"></button></div></div><p class="hint">点击绘本图片，收听完整故事。</p></section><section class="panel"><h2>三、阅读理解</h2><div class="image-wrap"><img src="./11-20_03_quiz.jpg?v=1" alt="三、阅读理解"><div class="overlay"><button type="button" style="inset:0;width:100%;height:100%" aria-label="打开阅读理解答题框" onclick="startQuiz()"></button></div></div><p class="hint">点击整张图片，弹出阅读理解第一题；听题目与每个选项后，再选择答案。</p></section><section class="panel"><h2>四、识字描红</h2><div class="image-wrap"><img src="./11-20_04_trace.jpg?v=1" alt="四、识字描红"><div class="overlay"><button type="button" style="left:4%;top:46%;width:29%;height:30%" aria-label="光" onclick="trace('光')"></button><button type="button" style="left:36%;top:46%;width:28%;height:30%" aria-label="长" onclick="trace('长')"></button><button type="button" style="left:67%;top:46%;width:29%;height:30%" aria-label="短" onclick="trace('短')"></button></div></div><p class="hint">点击田字格中的生字，直接手指描红。</p></section></main><div id="back" class="dialogBack"><div class="dialog"><button class="exit" onclick="closeDialog()" aria-label="关闭">×</button><div id="body"></div></div></div>
<script>
"use strict";
const story="星期五早晨，小宇和小美来到学校操场。小宇发现，脚边有一条长长的影子。他举起右手，影子也跟着动起来。小美说：我的影子比你的还长，难道我比你高吗？小宇说：影子的长短，不一定只和身高有关。他们决定做个实验。早上八点，两个人站在同一个位置，请老师帮忙标记影子的末端。中午十二点，他们再次来到操场。小美惊讶地说：咦，影子怎么变短了？小宇发现，太阳已经升得很高。下午四点，他们再次观察，影子又变长了，还朝着另一个方向。小美想：是不是太阳的位置变了，影子也会变化？老师点头说：阳光照在身上，被身体挡住的地方形成影子。太阳位置不同，影子的方向和长短也可能变化。第二天是阴天，影子变得很淡。小宇和小美把结果写在观察本上：晴天影子清楚，阴天影子可能很淡；通常早晚的影子比较长，中午比较短。小宇说：原来生活里藏着这么多有趣的秘密！";
const questions=[["中午的影子与早上相比，通常会怎样？",["变短了","变成红色了","完全不会动"],0],["为什么影子的长短会变化？",["因为身高突然变了","因为太阳的位置变化了","因为粉笔的颜色变了"],1],["阴天时，为什么影子可能很淡？",["因为云层让阳光变得分散","因为地面变高了","因为人没有站好"],0]];
const vocab={光:["guāng","阳光、光亮"],长:["cháng","长短、长影子"],短:["duǎn","短小、短影子"]};
const $=id=>document.getElementById(id);
let qi=0,score=0,locked=false,answered=[null,null,null],voice=null;
function say(t){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(t);utter.lang="zh-CN";utter.rate=.8;window.speechSynthesis.speak(utter)}
function modal(h){$("body").innerHTML=h;$("back").classList.add("open")}
function closeDialog(){if("speechSynthesis" in window)window.speechSynthesis.cancel();$("back").classList.remove("open")}
$("back").addEventListener("click",e=>{if(e.target===$("back"))closeDialog()});
function learn(w){modal('<h2>'+w+' · '+vocab[w][0]+'</h2><p class="bodyText">'+vocab[w][1]+'</p><button class="big" onclick="say(\''+w+'。'+vocab[w][1]+'\')">🔊 再听一遍</button>');say(w+"。"+vocab[w][1])}
function listenStory(){modal('<h2>📖 操场上会变长的影子</h2><p class="bodyText">'+story+'</p><button class="big" onclick="say(story)">🔊 再听故事</button>');say(story)}
function startQuiz(){qi=0;score=0;answered=[null,null,null];showQuestion()}
function readQuestionAndOptions(){const q=questions[qi];say(q[0]+"。"+q[1].map((v,j)=>String.fromCharCode(65+j)+"，"+v).join("。"))}
function readOption(j){const q=questions[qi];say(String.fromCharCode(65+j)+"，"+q[1][j])}
function showQuestion(){
 if(qi>=3){finishQuiz();return}
 locked=answered[qi]!==null;
 const q=questions[qi];
 modal('<h2>阅读闯关 · 第'+(qi+1)+'题</h2><p class="bodyText">'+q[0]+'</p><button class="big" onclick="readQuestionAndOptions()">🔊 朗读题目和全部选项</button>'+
 q[1].map((x,j)=>'<div class="answerRow"><button class="option" data-opt="'+j+'" '+(locked?'disabled':'')+'>'+String.fromCharCode(65+j)+'．'+x+'</button><button type="button" class="speakOption" data-speak="'+j+'" aria-label="朗读'+String.fromCharCode(65+j)+'选项">🔊</button></div>').join('')+
 '<p class="feedback" id="response"></p><button class="big" id="nextQ" style="display:'+(locked?'block':'none')+'" onclick="nextQuestion()">下一题 →</button>');
 $("body").querySelectorAll("[data-opt]").forEach(el=>el.onclick=()=>choose(Number(el.dataset.opt)));
 $("body").querySelectorAll("[data-speak]").forEach(el=>el.onclick=()=>readOption(Number(el.dataset.speak)));
 if(locked)$("response").textContent=answered[qi]===q[2]?"恭喜你回答正确！":"正确答案："+q[1][q[2]];
}
function choose(j){
 if(answered[qi]!==null)return;
 const q=questions[qi];answered[qi]=j;const ok=j===q[2];
 if(ok)score++;
 showQuestion();
 const answer=q[1][q[2]];
 $("response").textContent=ok?"恭喜你回答正确！":"哦哦，正确答案是："+answer;
 say(ok?"恭喜你回答正确！":"哦哦，正确答案是"+answer);
}
function nextQuestion(){qi++;showQuestion()}
function finishQuiz(){const msg="本次阅读闯关完成，答对"+score+"题，共三题。";modal('<h2>🌟 阅读闯关完成</h2><p class="bodyText">'+msg+'</p><button class="big" onclick="closeDialog()">完成</button>');try{sessionStorage.setItem("shadowDay11Quiz",JSON.stringify({score,total:3,at:new Date().toISOString()}))}catch(e){}if(new URLSearchParams(location.search).get("embed")==="1"&&window.parent!==window)window.parent.postMessage({type:"v6-shadow-quiz-complete",lessonDay:20,score,total:3},location.origin);say(msg)}
function trace(w){modal('<h2>✍️ '+w+' · 手指描红</h2><p>在田字格里跟着范字描写，完成后点击「完成描红」。</p><div class="traceArea"><span>'+w+'</span><canvas id="pad"></canvas></div><button class="big" onclick="trace(\''+w+'\')">清除重写</button><button class="big" onclick="say(\''+w+'\')">🔊 听读</button><button class="big" onclick="closeDialog()">完成描红</button>');const c=$("pad"),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const ctx=c.getContext("2d");ctx.scale(d,d);ctx.strokeStyle="#ed5147";ctx.lineWidth=8;ctx.lineCap="round";ctx.lineJoin="round";let down=false;c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const rr=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-rr.left,e.clientY-rr.top)};c.onpointermove=e=>{if(!down)return;const rr=c.getBoundingClientRect();ctx.lineTo(e.clientX-rr.left,e.clientY-rr.top);ctx.stroke()};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false}
</script></body></html>
