ün</div><button class="wordBtn" data-blend="寻">🧩 拼音闯关</button><button class="wordBtn listen" data-hear="寻">🔊 听完整读音</button><button class="wordBtn write" data-trace="寻">✍️ 手指描红</button></article><article class="wordCard"><div>🏛️</div><div class="wordChar">馆</div><div class="wordPinyin">guǎn</div><div class="wordParts">g + u + an</div><button class="wordBtn" data-blend="馆">🧩 拼音闯关</button><button class="wordBtn listen" data-hear="馆">🔊 听完整读音</button><button class="wordBtn write" data-trace="馆">✍️ 手指描红</button></article></div></section><section class="panel"><h2>二、四格绘本故事</h2><div class="pic storyImage"><img src="./11-30_02_story.jpg?v=1" alt="孩子在博物馆观察恐龙脚印，寻找线索，听讲解员介绍足迹化石"><button class="tap" aria-label="听完整故事" data-story></button></div><p class="help">点击整张绘本图，听完整《博物馆里的神秘脚印》。</p></section><section class="panel"><h2>三、阅读理解闯关</h2><p class="help">四道观察和推理题，题目、每个答案都可独立听读。</p><button class="action readBtn" data-quiz>▶ 开始四题阅读闯关</button></section><section class="panel"><h2>五、月末学习总结</h2><p class="help">展示本课实际完成情况，完整月度进度和成绩以 V6 已保存的学习记录为准，不生成演示数字。</p><button class="action" id="summaryBtn">🦁 查看本课成长小结</button></section></main><div id="dialog" class="dialog"><div class="dialogPanel"><div class="dialogHead"><h2 id="dialogTitle"></h2><button id="close" class="close" aria-label="关闭">×</button></div><p class="dialogText" id="dialogText"></p><div id="dialogBody"></div><p id="hint" class="help"></p></div></div><script>(function lesson(){
"use strict";
const $=id=>document.getElementById(id);
const words=[{c:"迹",p:"jì",parts:["j","i"],tone:4,word:"足迹",emoji:"👣"},{c:"寻",p:"xún",parts:["x","ün"],tone:2,word:"寻找",emoji:"🔎"},{c:"馆",p:"guǎn",parts:["g","u","an"],tone:3,word:"博物馆",emoji:"🏛️"}];
const story="星期六，小宇和妹妹朵朵跟着妈妈来到自然博物馆。一进展厅，他们就看见一副高大的恐龙骨架。朵朵忽然发现地上有一串巨大的三趾脚印，惊讶地问：难道这里有活恐龙吗？小宇仔细观察，发现脚印间的距离几乎一样，排列得十分整齐。他想：恐龙不是早就灭绝了吗？他们沿着脚印向前走，发现脚印在蓝色地毯前消失了。地毯旁边有一块牌子：请跟随脚印，寻找远古动物的秘密。讲解员走过来，解释说：这些脚印是根据足迹化石制作的展示图案。很久以前，恐龙踩过柔软泥地，脚印被泥沙掩埋，经过漫长变化形成了化石。研究脚印能帮助科学家了解恐龙如何行走。但仅凭一串脚印，往往不能确定具体是哪一种恐龙，还需要别的证据。离开博物馆时，朵朵说：我们学会像科学家一样寻找线索了！小宇点点头：遇到奇怪的事，要仔细观察，寻找证据，不能马上下结论。";
const qs=[
["朵朵一开始为什么觉得博物馆里有恐龙？",["因为她看见了活恐龙","因为她发现地上的巨大脚印","因为讲解员告诉她"],1],
["小宇发现脚印整齐，说明他在做什么？",["仔细观察并提出疑问","急着离开博物馆","准备把脚印擦掉"],0],
["为什么不能只凭一串脚印就确定恐龙的种类？",["因为所有恐龙脚印都一样","因为还需要结合其他证据","因为恐龙没有脚趾"],1],
["故事最想告诉我们什么？",["博物馆晚上一定有恐龙","遇到奇怪的事，要观察并寻找证据","脚印越大，恐龙一定越高"],1]
];
let qi=0,answers=[],score=0,active="",step=0,poemSeen={},traced={},blended={};
function say(t){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;window.speechSynthesis.speak(u)}
function btn(label,fn,cls="action"){const e=document.createElement("button");e.type="button";e.className=cls;e.textContent=label;e.onclick=fn;return e}
function modal(title,description,content){$("dialogTitle").textContent=title;$("dialogText").textContent=description;$("dialogBody").replaceChildren(...content);$("dialog").classList.add("open")}
function close(){window.speechSynthesis?.cancel();$("dialog").classList.remove("open")}
function readStory(){modal("📖 博物馆里的神秘脚印",story,[btn("🔊 再听完整故事",()=>say(story))]);say(story)}
function openQuiz(){qi=0;answers=Array(qs.length).fill(null);score=0;showQuiz()}
function showQuiz(){if(qi>=qs.length){finishQuiz();return}const q=qs[qi],locked=answers[qi]!==null;const controls=[btn("🔊 朗读题目与所有选项",()=>say(q[0]+"。"+q[1].map((t,i)=>String.fromCharCode(65+i)+"，"+t).join("。")))];
q[1].forEach((option,i)=>{const row=document.createElement("div");row.className="answerRow";const select=btn(String.fromCharCode(65+i)+"．"+option,()=>choose(i),"choice");select.disabled=locked;row.append(select,btn("🔊",()=>say(String.fromCharCode(65+i)+"，"+option),"voice"));controls.push(row)});
if(locked){const note=document.createElement("p");note.className="result";note.textContent=answers[qi]===q[2]?"恭喜你回答正确！":"正确答案："+q[1][q[2]];controls.push(note,btn("下一题 →",()=>{qi++;showQuiz()}))}
modal("🦕 阅读闯关 · 第"+(qi+1)+"/4题",q[0],controls)}
function choose(i){if(answers[qi]!==null)return;answers[qi]=i;const q=qs[qi];if(i===q[2])score++;showQuiz();say(i===q[2]?"恭喜你回答正确！":"哦哦，正确答案是："+q[1][q[2]])}
function finishQuiz(){const msg="四题完成，答对"+score+"题。";modal("🌟 阅读闯关完成",msg,[btn("查看月末成长小结",()=>showSummary()),btn("完成",close)]);try{sessionStorage.setItem("museumDay17Quiz",JSON.stringify({score,total:4,at:new Date().toISOString()}))}catch(e){}if(new URLSearchParams(location.search).get("embed")==="1"&&parent!==window)parent.postMessage({type:"v6-museum-quiz-complete",lessonDay:30,score,total:4},location.origin);say(msg)}
function blend(w){active=w;step=0;renderBlend();say(w+"。"+words.find(x=>x.c===w).word)}
function renderBlend(){const d=words.find(x=>x.c===active);const tasks=d.parts.map((v,i)=>({label:["声母","介母","韵母"][d.parts.length===2?(i===0?0:2):i],value:v,choices:i===0?["j","x","g"]:i===1&&d.parts.length===3?["u","i","ü"]:["i","ün","an"]}));tasks.push({label:"声调",value:d.tone,choices:[1,2,3,4]});if(step>=tasks.length){blended[active]=true;modal("🌟 拼读成功："+active,d.parts.join(" + ")+" → "+d.p,[btn("🔊 听完整读音",()=>say(active+"。"+d.word)),btn("✍️ 手指描红",()=>trace(active)),btn("🔁 再练一次",()=>blend(active))]);say(active+"。"+d.word);return}
const task=tasks[step];const choices=task.choices.map(v=>btn(task.label==="声调"?["","一声","二声","三声","四声"][v]:v,()=>{if(v!==task.value){$("hint").textContent="再仔细看看拼音的组成。";return}step++;renderBlend()},"choosePart"));choices.push(btn("🔊 听整字",()=>say(active+"。"+d.word)));
modal("🔤 "+active+" · "+d.p,"第"+(step+1)+"/"+tasks.length+"步：找出"+task.label,choices);$("hint").textContent="「寻」的韵母 ün 遇 x 时写作 un；不单独使用系统语音读字母。"}
function trace(w){const content=[btn("清除重写",()=>trace(w)),btn("🔊 听汉字",()=>say(w)),btn("✅ 完成描红",()=>{traced[w]=true;close()})];modal("✍️ "+w+" · 手指描红","沿着田字格里的浅色字形描写。",content);const area=document.createElement("div");area.className="traceArea";const letter=document.createElement("span");letter.textContent=w;const canvas=document.createElement("canvas");area.append(letter,canvas);$("dialogBody").prepend(area);const rect=canvas.getBoundingClientRect(),scale=devicePixelRatio||1;canvas.width=Math.round(rect.width*scale);canvas.height=Math.round(rect.height*scale);const g=canvas.getContext("2d");g.scale(scale,scale);g.strokeStyle="#f45a3d";g.lineWidth=8;g.lineCap="round";g.lineJoin="round";let down=false;canvas.onpointerdown=e=>{down=true;canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();g.beginPath();g.moveTo(e.clientX-r.left,e.clientY-r.top)};canvas.onpointermove=e=>{if(!down)return;const r=canvas.getBoundingClientRect();g.lineTo(e.clientX-r.left,e.clientY-r.top);g.stroke()};canvas.onpointerup=()=>down=false;canvas.onpointercancel=()=>down=false}
const verses=[["《画》· 王维","远看山有色，","近听水无声。"],["《池上》· 白居易","不解藏踪迹，","浮萍一道开。"],["《悯农》· 李绅","谁知盘中餐，","粒粒皆辛苦。"]];
function poem(i){const v=verses[i];modal("🌸 "+v[0]+" · 古诗接句",v[1]+" ________",[btn("🔊 听上句",()=>say(v[1])),btn("揭晓下句",()=>{poemSeen[i]=true;modal(v[0]+" · 答案",v[1]+v[2],[btn("🔊 听完整句",()=>say(v[1]+v[2])),btn("再练一次",()=>poem(i))]);say(v[2])})]);say(v[1])}
function showSummary(){const result=answers.filter(x=>x!==null).length===qs.length?"本课阅读答对 "+score+"/4 题":"本课阅读闯关尚未完成";modal("🦁 11月语文成长小结",result+"。本课拼音闯关 "+Object.keys(blended).length+"/3 字；手指描红 "+Object.keys(traced).length+"/3 字；古诗接句 "+Object.keys(poemSeen).length+"/3 首。完整月度统计请以 V6 主学习记录为准。",[btn("🔊 听鼓励",()=>say("你完成了本月的语文学习挑战，继续保持好奇心！")),btn("完成",close)])}
document.querySelector("[data-story]").onclick=readStory;
document.querySelector("[data-quiz]").onclick=openQuiz;
document.querySelectorAll("[data-blend]").forEach(b=>b.onclick=()=>blend(b.dataset.blend));
document.querySelectorAll("[data-trace]").forEach(b=>b.onclick=()=>trace(b.dataset.trace));
document.querySelectorAll("[data-hear]").forEach(b=>b.onclick=()=>{const d=words.find(x=>x.c===b.dataset.hear);say(d.c+"。"+d.word)});
document.querySelectorAll("[data-poem]").forEach(b=>b.onclick=()=>poem(Number(b.dataset.poem)));
document.getElementById("summaryBtn").onclick=showSummary;
$("close").onclick=close;$("dialog").onclick=e=>{if(e.target===$("dialog"))close()}
})();</script><script src="./poem-speech-check.js?v=6" data-day="30" defer></script></body></html>
