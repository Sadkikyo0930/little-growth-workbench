<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V6 学习记录安全备份</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9f6ff;color:#173e64;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:560px;margin:0 auto;padding:26px 18px}h1{font-size:23px}.card{background:white;padding:20px;border-radius:20px;margin:18px 0;box-shadow:0 5px 20px #1b528022}p{line-height:1.7}button{border:0;border-radius:13px;background:#1975d2;color:#fff;padding:16px;width:100%;font:inherit;font-weight:800;margin:10px 0}button:disabled{opacity:.45}.note{font-size:14px;color:#58728a}.stat{font-size:24px;font-weight:800;color:#1464ae}a{color:#1464ae}#status{white-space:pre-wrap}</style></head>
<body><main><h1>🏎️ V6 学习记录安全备份</h1><p>这一步先保护原有成绩，再进行家庭云端同步。请在<strong>孩子平时学习的同一个浏览器</strong>打开。</p>
<section class="card"><p id="status">正在读取本浏览器的 V6 学习数据……</p><p>答题记录：<span class="stat" id="records">—</span></p><p>周测记录：<span class="stat" id="weekly">—</span></p><p>已完成项目：<span class="stat" id="finished">—</span></p>
<button id="backup" disabled>备份本机 V6 学习记录（JSON）</button><p class="note">备份仅下载到本机，不会上传到 GitHub、CloudBase 或其他服务器；不会重置、覆盖或改动成绩。</p></section>
<p><a href="./">返回 V6 学习台</a> · <a href="./family-dashboard.html">家庭云端记录</a></p></main>
<script>(function(){"use strict";var key="growth-workbench-v6-adaptive-2",state=null,raw;
var el=id=>document.getElementById(id);
try{raw=localStorage.getItem(key);if(!raw){el("status").textContent="这个浏览器尚未找到 V6 学习记录。请使用孩子实际学习时的浏览器打开本页面；不要清理浏览器数据。";return}
state=JSON.parse(raw);if(!state||!Array.isArray(state.records))throw Error("数据结构不符合预期，未执行任何修改");
el("records").textContent=state.records.length;
el("weekly").textContent=Object.keys(state.weeklyExams||{}).length;
el("finished").textContent=Object.keys(state.finished||{}).filter(k=>state.finished[k]).length;
el("status").textContent="✅ 已找到本浏览器的学习记录。可以先保存完整备份。";
el("backup").disabled=false;
}catch(e){el("status").textContent="读取失败："+String(e.message||e)+"。没有改动原始数据。";return}
el("backup").onclick=function(){try{var obj={backup_version:1,source:"V6 localStorage",key:key,exported_at:new Date().toISOString(),data:state};var blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json;charset=utf-8"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="V6-learning-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},15000);el("status").textContent="✅ 已生成本地备份文件。请确认 Safari 下载列表中有该文件。没有上传任何数据。"}catch(e){el("status").textContent="备份失败："+String(e.message||e)}}};
})();</script></body></html>
