<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11月18日语文 · 图书角的最后一本书</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#e8f6ff,#f4fff5);margin:0;color:#234b5b}main{width:min(100%,760px);padding:10px;margin:auto}.panel{background:white;margin-bottom:14px;border-radius:17px;overflow:hidden;padding:10px;box-shadow:0 5px 20px #6ba6b32b}h2{font-size:20px;margin:7px 7px 12px}.image-wrap{position:relative;overflow:hidden;border-radius:13px}.image-wrap img{width:100%;height:auto;display:block}.overlay{position:absolute;inset:0}.overlay button{position:absolute;cursor:pointer;background:transparent;border:0;touch-action:manipulation}.overlay button:focus-visible{outline:3px solid #ffb940;background:#ffd86450}.hint{color:#56818c;font-size:13px;padding:0 6px;line-height:1.6}.big{width:100%;background:#1c9fc4;border:0;color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:16px;margin:4px 0 10px;cursor:pointer}.dialogBack{position:fixed;inset:0;background:#1b374ccc;display:none;align-items:center;justify-content:center;padding:12px;z-index:500}.dialogBack.open{display:flex}.dialog{max-width:540px;width:100%;max-height:92dvh;overflow:auto;background:white;border-radius:20px;padding:18px}.exit{float:right;border:0;border-radius:50%;height:43px;width:43px;font-size:25px;background:#e9f6fa}.dialog h2{margin:8px 0 20px}.bodyText{font-size:17px;line-height:1.9}.option{display:block;width:100%;padding:14px;margin:10px 0;border-radius:13px;background:#effbff;border:2px solid #9ad8e5;text-align:left;font-size:16px;cursor:pointer}.option:disabled{opacity:.7}.feedback{font-size:16px;font-weight:700;color:#108d6a}.traceArea{position:relative;height:260px;border:2px solid #9cdae4;border-radius:15px;background:linear-gradient(0deg,transparent 49.7%,#b8dce2 50%,transparent 50.3%),linear-gradient(90deg,transparent 49.7%,#b8dce2 50%,transparent 50.3%)}.traceArea span{position:absolute;inset:0;display:grid;place-items:center;font-size:150px;color:#d2e1e6;pointer-events:none}.traceArea canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
</style></head><body><main><section class="panel"><h2>一、拼音小课堂</h2><div class="image-wrap"><img src="./11-18_01_拼音认读.png?v=1" alt="一、拼音小课堂"><div class="overlay"><button type="button" style="left:5%;top:45%;width:29%;height:45%" aria-label="借" onclick="learn('借')"></button><button type="button" style="left:36%;top:45%;width:28%;height:45%" aria-label="书" onclick="learn('书')"></button><button type="button" style="left:67%;top:45%;width:28%;height:45%" aria-label="还" onclick="learn('还')"></button></div></div><p class="hint">点击三个生字或词语，听读借、书、还。</p></section><section class="panel"><h2>二、绘本故事</h2><div class="image-wrap"><img src="./11-18_02_绘本故事.png?v=1" alt="二、绘本故事"><div class="overlay"><button type="button" style="left:0%;top:0%;width:100%;height:100%" aria-label="story" onclick="listenStory()"></button></div></div><p class="hint">点击绘本图片，收听完整故事。</p></section><section class="panel"><h2>三、阅读理解</h2><div class="image-wrap"><img src="./11-18_03_阅读理解.png?v=1" alt="三、阅读理解"><div class="overlay"><button type="button" style="left:30%;top:53%;width:21%;height:8%" aria-label="0,0" onclick="answerFromImage(0,0)"></button><button type="button" style="left:52%;top:53%;width:21%;height:8%" aria-label="0,1" onclick="answerFromImage(0,1)"></button><button type="button" style="left:74%;top:53%;width:23%;height:8%" aria-label="0,2" onclick="answerFromImage(0,2)"></button><button type="button" style="left:28%;top:70%;width:23%;height:8%" aria-label="1,0" onclick="answerFromImage(1,0)"></button><button type="button" style="left:52%;top:70%;width:22%;height:8%" aria-label="1,1" onclick="answerFromImage(1,1)"></button><button type="button" style="left:75%;top:70%;width:23%;height:8%" aria-label="1,2" onclick="answerFromImage(1,2)"></button><button type="button" style="left:28%;top:88%;width:23%;height:8%" aria-label="2,0" onclick="answerFromImage(2,0)"></button><button type="button" style="left:52%;top:88%;width:22%;height:8%" aria-label="2,1" onclick="answerFromImage(2,1)"></button><button type="button" style="left:75%;top:88%;width:23%;height:8%" aria-label="2,2" onclick="answerFromImage(2,2)"></button></div></div><p class="hint">点击题目的答案直接作答。</p><button class="big" onclick="startQuiz()">📖 开始三道阅读题（也可直接点击图片答案）</button></section><section class="panel"><h2>四、识字描红</h2><div class="image-wrap"><img src="./11-18_04_识字描红.png?v=1" alt="四、识字描红"><div class="overlay"><button type="button" style="left:4%;top:46%;width:29%;height:30%" aria-label="借" onclick="trace('借')"></button><button type="button" style="left:36%;top:46%;width:28%;height:30%" aria-label="书" onclick="trace('书')"></button><button type="button" style="left:67%;top:46%;width:29%;height:30%" aria-label="还" onclick="trace('还')"></button></div></div><p class="hint">点击田字格中的生字，直接手指描红。</p></section></main><div id="back" class="dialogBack"><div class="dialog"><button class="exit" onclick="closeDialog()" aria-label="关闭">×</button><div id="body"></div></div></div>
<script>
"use strict";
const story="星期一早上，小宇来到教室的图书角，想借一本《动物的家》。可是书架上只剩下一个空空的位置。小宇和小美一起寻找，发现桌上放着一张借书卡，上面写着小乐的名字。这时，小乐抱着书走进教室。他说：对不起，我怕雨水打湿书页，所以把书包好再带回来。小宇明白了：原来小乐不是不爱惜图书，而是在认真保护它。大家决定做一张借书登记表。老师说：懂得分享，也要懂得爱护图书。";
const questions=[
["谁借走了《动物的家》？",["小宇","小乐","小美"],1],
["小乐为什么把书包上纸？",["怕雨水打湿书","想让书变新","因为书坏了"],0],
["这个故事告诉我们什么？",["可以忘记还书","书只给自己看","懂得分享，也要爱护图书"],2]
];
const vocab={借:["jiè","借书、借阅"],书:["shū","图书、书本"],还:["huán","还书、归还"]};
const $=id=>document.getElementById(id);
let qi=0,score=0,locked=false,answered=[null,null,null],voice=null;
function say(t){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(t);utter.lang="zh-CN";utter.rate=.8;window.speechSynthesis.speak(utter)}
function modal(h){$("body").innerHTML=h;$("back").classList.add("open")}
function closeDialog(){if("speechSynthesis" in window)window.speechSynthesis.cancel();$("back").classList.remove("open")}
$("back").addEventListener("click",e=>{if(e.target===$("back"))closeDialog()});
function learn(w){modal('<h2>'+w+' · '+vocab[w][0]+'</h2><p class="bodyText">'+vocab[w][1]+'</p><button class="big" onclick="say(\''+w+'。'+vocab[w][1]+'\')">🔊 再听一遍</button>');say(w+"。"+vocab[w][1])}
function listenStory(){modal('<h2>📖 图书角的最后一本书</h2><p class="bodyText">'+story+'</p><button class="big" onclick="say(story)">🔊 再听故事</button>');say(story)}
function startQuiz(){qi=0;score=0;answered=[null,null,null];showQuestion()}
function answerFromImage(i,j){if(qi===3||answered.every(x=>x!==null)){qi=0;score=0;answered=[null,null,null]}if(i!==qi){qi=i}if(answered[i]!==null){showQuestion();return}choose(j)}
function showQuestion(){if(qi>=3){finishQuiz();return}locked=answered[qi]!==null;const q=questions[qi];modal('<h2>阅读闯关 · 第'+(qi+1)+'题</h2><p class="bodyText">'+q[0]+'</p>'+q[1].map((x,j)=>'<button class="option" data-opt="'+j+'" '+(locked?'disabled':'')+'>'+String.fromCharCode(65+j)+'．'+x+'</button>').join('')+'<p class="feedback" id="response"></p><button class="big" onclick="say(questions[qi][0])">🔊 听题目</button><button class="big" id="nextQ" style="display:'+(locked?'block':'none')+'" onclick="nextQuestion()">下一题 →</button>');$("body").querySelectorAll("[data-opt]").forEach(el=>el.onclick=()=>choose(Number(el.dataset.opt)));if(locked)$("response").textContent=answered[qi]===q[3]?"恭喜你回答正确！":"正确答案："+q[1][q[3]]}
function choose(j){if(answered[qi]!==null)return;const q=questions[qi];answered[qi]=j;const ok=j===q[2];if(ok)score++;showQuestion();const answer=q[1][q[2]];$("response").textContent=ok?"恭喜你回答正确！":"哦哦，正确答案是："+answer;say(ok?"恭喜你回答正确！":"哦哦，正确答案是"+answer)}
function nextQuestion(){qi++;showQuestion()}
function finishQuiz(){const msg="本次阅读闯关完成，答对"+score+"题，共三题。";modal('<h2>🌟 阅读闯关完成</h2><p class="bodyText">'+msg+'</p><button class="big" onclick="closeDialog()">完成</button>');try{sessionStorage.setItem("libraryDay10Quiz",JSON.stringify({score,total:3,at:new Date().toISOString()}))}catch(e){}if(new URLSearchParams(location.search).get("embed")==="1"&&window.parent!==window)window.parent.postMessage({type:"v6-library-quiz-complete",lessonDay:18,score,total:3},location.origin);say(msg)}
function trace(w){modal('<h2>✍️ '+w+' · 手指描红</h2><p>在田字格里跟着范字描写，完成后点击「完成描红」。</p><div class="traceArea"><span>'+w+'</span><canvas id="pad"></canvas></div><button class="big" onclick="trace(\''+w+'\')">清除重写</button><button class="big" onclick="say(\''+w+'\')">🔊 听读</button><button class="big" onclick="closeDialog()">完成描红</button>');const c=$("pad"),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const ctx=c.getContext("2d");ctx.scale(d,d);ctx.strokeStyle="#ed5147";ctx.lineWidth=8;ctx.lineCap="round";ctx.lineJoin="round";let down=false;c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const rr=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-rr.left,e.clientY-rr.top)};c.onpointermove=e=>{if(!down)return;const rr=c.getBoundingClientRect();ctx.lineTo(e.clientX-rr.left,e.clientY-rr.top);ctx.stroke()};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false}
</script></body></html>
