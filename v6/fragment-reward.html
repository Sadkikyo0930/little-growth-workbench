<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f63b7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>学习奖励 · 小小赛车成长工坊</title>
<style>
  :root{--ink:#153963;--blue:#0f63b7}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#58b9ff,#c7efff 45%,#ebf8ff);
    display:grid;place-items:center;padding:24px 18px;text-align:center;
  }
  .box{max-width:420px;width:100%}
  .emoji{font-size:58px;line-height:1;filter:drop-shadow(0 8px 14px rgba(21,79,145,.28))}
  h1{margin:12px 0 6px;font-size:21px;font-weight:1000;color:#fff;text-shadow:0 3px #2767b8,0 5px 12px #1b6cb0}
  p{margin:0 0 8px;font-size:13px;font-weight:800;color:#12518f;line-height:1.7}
  .hint{margin-top:14px;font-size:11.5px;font-weight:800;color:#2f6ea5;background:rgba(255,255,255,.75);
    border:2px dashed #9ad4f5;border-radius:14px;padding:10px 12px}
  .link{display:inline-block;margin-top:14px;text-decoration:none;background:#fff;color:#12548f;
    border:3px solid #fff;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:1000;
    box-shadow:0 4px 0 rgba(21,79,145,.2)}
</style>
</head>
<body>
<div class="box">
  <div class="emoji">⭐</div>
  <h1>今日学习完成啦</h1>
  <p id="title">正在结算碎片…</p>
  <div class="hint" id="hint">这一页只负责展示碎片奖励，不改动课程、题目、语音、测评与学习进度。</div>
  <a class="link" id="centerLink" href="./assemble-center.html">去赛车组装中心 ›</a>
</div>

<script type="module">
import { showFragmentReward } from './r5/fragment-reward.mjs';

const qs = new URLSearchParams(location.search);
const record = qs.get('record') || '';
const d = qs.get('d') || '';
const family = qs.get('family') || '';

// 把设备凭证继续传给组装中心，避免验收时断链
try {
  const p = new URLSearchParams();
  if (d) p.set('d', d);
  if (family) p.set('family', family);
  const s = p.toString();
  if (s) document.getElementById('centerLink').href = './assemble-center.html?' + s;
} catch { /* 忽略 */ }

const title = document.getElementById('title');
if (!record) {
  title.textContent = '没有指定学习记录编号';
} else {
  showFragmentReward({ recordId: record }).then(r => {
    title.textContent = r && r.status ? `结算状态：${r.status}` : '结算完成';
  });
}
</script>
</body>
</html>
