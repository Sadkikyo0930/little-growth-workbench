<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>语文第二、第三天课堂验收</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dff8f5,#f6fffc);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#194e5f}header{padding:14px 16px;background:#fff;box-shadow:0 3px 15px #92c8c83a;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px}a{color:#077f82;text-decoration:none;font-weight:700}main{max-width:740px;margin:auto;padding:16px 12px 110px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.switch button{min-height:70px;border:2px solid #b5e3df;background:white;border-radius:18px;font-size:16px;font-weight:850;color:#17636b}.switch button.active{background:#009c9a;color:white;border-color:#009c9a}.panel{background:white;border-radius:22px;padding:15px;margin-bottom:15px;box-shadow:0 5px 20px #308b9122}.cover{width:100%;display:block;border-radius:18px}.panel h2{margin:6px 0 13px;font-size:23px}.hint{color:#637f89;font-size:14px;line-height:1.7}.pills{display:flex;flex-wrap:wrap;gap:8px}.pills span{padding:9px 13px;background:#fff0c9;border-radius:20px;font-weight:800}.big{display:block;width:100%;padding:15px 12px;background:#009b96;color:white;border:0;border-radius:15px;font-weight:900;font-size:17px;margin:10px 0;min-height:55px}.small{padding:12px 16px;border:2px solid #a8deda;border-radius:14px;background:white;color:#107379;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{padding:18px 7px;border:2px solid #a6e1dc;background:#fff;border-radius:16px;color:#12777b;font-size:19px;font-weight:850}.grid button.good{background:#cff8d8}.grid button.bad{background:#ffdfdf}.grid button:disabled{opacity:.85}img{max-width:100%;height:auto}.art{width:100%;border-radius:17px;display:block;margin:10px 0}details{margin-top:12px;background:#f1faf9;padding:12px;border-radius:14px}summary{cursor:pointer;font-weight:800}#feedback{font-weight:800;min-height:24px}.foot{font-size:12px;color:#68838c;text-align:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:390px){.switch button{font-size:14px}.panel{padding:12px}} .poem{background:#fffaf0;border:2px solid #f0d7ad;border-radius:18px;padding:16px;text-align:center;font-size:clamp(22px,5vw,29px);font-weight:700;line-height:2.1;letter-spacing:2px}.poem small{display:block;font-size:15px;color:#876b42;line-height:1.5}.sample-words{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.sample-words button{flex:1;min-width:105px;border:2px solid #bde7e2;border-radius:14px;padding:12px 8px;background:#fffbef;font-size:17px;color:#1c6970;font-weight:800}.trace-box{position:relative;height:205px;border:2px solid #afdeda;border-radius:16px;margin:15px 0;background:repeating-linear-gradient(to bottom,#fff 0px,#fff 50px,#d4e5df 51px,#fff 52px,#fff 102px);overflow:hidden}.trace-box>span{position:absolute;inset:0;display:grid;place-items:center;font-size:125px;font-weight:700;color:#dcebe7;pointer-events:none}.trace-box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.trace-nav{display:flex;gap:8px}.trace-nav button{flex:1}.step-note{font-size:13px;color:#6a7a80}</style></head><body><header><a href="./index.html">← 原版 V6</a><strong>🦁 语文课堂验收</strong></header><main><div class="switch"><button id="d2" onclick="choose(2)">第二个语文日<br>古诗《画》</button><button id="d3" onclick="choose(3)">第三个语文日<br>复韵母 ai / ao</button></div><div id="view"></div><p class="foot">临时验收页面 · 不修改 V6 原学习记录 · 后续可删除本页面</p></main>
<script>
const files={"2":["11-04_语文_新版01_古诗画全文.jpg","11-04_语文_新版02_拼音ang_eng例字.jpg","11-04_语文_新版03_识字桥船河描红.jpg","11-04_语文_新版04_综合闯关.jpg"],"3":["11-06_语文_新版01_ai_ao主图.jpg","11-06_语文_新版02_ai_ao例字.jpg","11-06_语文_新版03_ai_ao拼读描红.jpg","11-06_语文_新版04_ai_ao综合闯关.jpg"]};
const lessons={2:{name:'古诗《画》',words:['桥','船','河'],sounds:['ang','eng'],poem:'远看山有色，近听水无声。春去花还在，人来鸟不惊。',questions:[['诗中远远能看到什么？','山有颜色','下雪','夜空',0],['诗中靠近听，水有什么特点？','无声','很吵','在唱歌',0],['哪张图表示“桥”？','桥','船','河',0]]},3:{name:'复韵母 ai / ao',words:['爱','白','开','袄','桃','猫'],sounds:['ai','ao'],poem:'今天认识两个复韵母，ai 和 ao。看一看图，听一听词语，分清两个韵母。',questions:[['“白”字的拼音含哪个韵母？','ai','ao','ong',0],['“猫”字的拼音含哪个韵母？','ao','ai','eng',0],['“开”字的拼音含哪个韵母？','ai','ao','ang',0]]}};
let day=2,qi=0,score=0,playing=null,traceIndex=0;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pic(i){return '<img class="art" loading="lazy" src="./'+encodeURIComponent(files[day][i])+'" alt="'+esc(lessons[day].name)+'教学图片 '+(i+1)+'">'}
function say(s){if(playing){playing.pause();playing=null}if(!('speechSynthesis'in window)){alert('当前浏览器没有语音功能');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}
function syllable(s){if(playing)playing.pause();speechSynthesis?.cancel();const a=new Audio('https://raw.githubusercontent.com/cmguo/PinYinSound/master/'+s+'1.mp3');playing=a;const v=$('soundStatus');v.textContent='正在播放 '+s;a.onerror=()=>v.textContent='录音加载失败，请检查网络；不会用其他音节代替。';a.play().catch(()=>v.textContent='录音无法自动播放，请重试');}
function choose(n){day=n;qi=0;score=0;traceIndex=0;document.querySelectorAll('.switch button').forEach(x=>x.classList.remove('active'));$('d'+n).classList.add('active');const l=lessons[n];const p=n===2?'<div class="poem"><small>《画》 · 唐代·王维</small>远看山有色，<br>近听水无声。<br>春去花还在，<br>人来鸟不惊。</div>':'<div class="poem"><small>今日学习</small>ai · ao<br>听音辨认、看图拼读</div>';
$('view').innerHTML='<section class="panel">'+pic(0)+'<h2>'+l.name+'</h2>'+p+'<button class="big" id="narrate">🔊 '+(n===2?'完整朗读古诗《画》':'朗读今天的学习提示')+'</button></section><section class="panel"><h2>🌈 拼音认读与例字</h2>'+pic(1)+'<p class="hint">点击音节听韵母，再点例字听标准带声调的字音。</p><div class="grid" id="syllables">'+l.sounds.map(x=>'<button data-s="'+x+'">'+x+' 🔊</button>').join('')+'</div><div class="sample-words">'+(n===2?['羊 yáng','房 fáng','灯 dēng','风 fēng']:['爱 ài','白 bái','袄 ǎo','桃 táo']).map(x=>'<button data-example="'+x+'">'+x+' 🔊</button>').join('')+'</div><p id="soundStatus" class="hint"></p></section><section class="panel"><h2>✍️ 看图识字与手指描红</h2>'+pic(2)+'<div class="pills">'+l.words.map(w=>'<span>'+w+'</span>').join('')+'</div><button class="small" id="wordRead">🔊 老师读今天的字词</button><p class="step-note">笔顺应以规范教材和字形动画为准；此处可练习描写，但不自动判断笔顺是否正确。</p><h3 id="traceTitle"></h3><div class="trace-box"><span id="traceGuide"></span><canvas id="traceCanvas"></canvas></div><div class="trace-nav"><button class="small" id="clearTrace">清除重写</button><button class="big" id="nextTrace">✅ 我写好了 · 下一个</button></div></section><section class="panel"><h2>⭐ 综合闯关</h2>'+pic(3)+'<div id="questions"></div></section>';
$('narrate').onclick=()=>say(l.poem);$('wordRead').onclick=()=>say(l.words.join('，'));document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>syllable(b.dataset.s));document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>say(b.dataset.example.split(' ')[0]));$('nextTrace').onclick=()=>{traceIndex=(traceIndex+1)%l.words.length;initTrace()};$('clearTrace').onclick=()=>initTrace();initTrace();draw();}
function initTrace(){const word=lessons[day].words[traceIndex];$('traceTitle').textContent='第 '+(traceIndex+1)+' / '+lessons[day].words.length+' 个：'+word;$('traceGuide').textContent=word;const c=$('traceCanvas'),rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,Math.round(rect.width*dpr));c.height=Math.max(1,Math.round(rect.height*dpr));const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=7;ctx.strokeStyle='#129f9b';ctx.lineCap='round';ctx.lineJoin='round';let drawing=false;const pt=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pt(e))};c.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...pt(e));ctx.stroke()};c.onpointerup=c.onpointercancel=()=>{drawing=false};}
function draw(){const qs=lessons[day].questions;if(qi>=qs.length){$('questions').innerHTML='<h3>🏆 闯关结束！答对 '+score+' / '+qs.length+' 题</h3><button class="big" id="again">再挑战一次</button>';$('again').onclick=()=>{qi=0;score=0;draw()};return}const q=qs[qi];$('questions').innerHTML='<h3>第 '+(qi+1)+' / '+qs.length+' 题</h3><p>'+esc(q[0])+'</p><button class="small" id="readq">🔊 听题目与选项</button><div class="grid" id="choices">'+q.slice(1,4).map((x,i)=>'<button data-choice="'+i+'">'+esc(x)+'</button>').join('')+'</div><p id="feedback" aria-live="polite"></p><button class="big" id="next" style="display:block" disabled>下一题 →</button>';$('readq').onclick=()=>say(q[0]+'，A，'+q[1]+'。B，'+q[2]+'。C，'+q[3]);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.choice===q[4];if(ok)score++;$('feedback').textContent=ok?'🌟 恭喜你答对了！':'再想一想，正确答案是：'+q[1+q[4]];say(ok?'恭喜你回答正确':'正确答案是'+q[1+q[4]]);document.querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;x.classList.add(+x.dataset.choice===q[4]?'good':(+x.dataset.choice===+b.dataset.choice?'bad':''))});$('next').disabled=false;$('next').style.display='block'});$('next').onclick=()=>{qi++;draw()};}
let hash=location.hash;choose(hash==='#day3'?3:2);
</script></body></html>
