<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V6 · 高频词英语赛车岛</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#b9e8ff,#f8fdff);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#214c70}main{max-width:700px;margin:auto;padding:12px 12px 40px}.hero{padding:22px;border-radius:24px;background:linear-gradient(120deg,#285cc0,#32adca);color:#fff}.hero h1{margin:8px 0;font-size:25px}.card{background:white;border-radius:21px;padding:19px;margin-top:13px;box-shadow:0 6px 18px #23537c12}.pill{display:inline-block;border-radius:20px;padding:7px 13px;background:#e5efff;font-size:13px;font-weight:800;color:#235eaa}.muted{color:#647f96;font-size:14px;line-height:1.6}.hero .muted{color:#f1fbff}.button{width:100%;border:0;border-radius:15px;background:#2564b9;padding:14px;color:#fff;font-size:17px;font-weight:800;margin:8px 0}.button.soft{background:#eaf4ff;color:#285b87;border:1px solid #a5c9e8}.button:disabled{opacity:.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.word{background:#f1f9ff;border:2px solid #b5d7ef;color:#254e74;border-radius:18px;padding:20px 6px;min-height:85px;font-size:27px;font-weight:900}.word.correct{border-color:#2aab83;background:#dcfae9}.word.wrong{border-color:#e18a7a;background:#fff0eb}.word:disabled{opacity:.85}.big{font-size:55px;text-align:center;padding:17px 0}.question{font-size:22px;font-weight:900;line-height:1.5}.feedback{min-height:22px;font-weight:850;line-height:1.7}.hidden{display:none}.bar{height:11px;background:#e4f0f9;border-radius:20px;overflow:hidden;margin:14px 0}.bar i{display:block;background:#46c5ac;height:100%}.steps{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #98c8e8;background:#e9f6ff;border-radius:14px;padding:10px;font-weight:800;font-size:20px;color:#31577b}.pyramid{border-radius:15px;background:#edf7ff;padding:14px;text-align:center;font-size:23px;font-weight:850;line-height:2}.selected{background:#d9f6e7!important}.road{text-align:center;font-size:62px;margin:15px 0}.status{font-size:13px;color:#687e91}@media(max-width:400px){.word{font-size:23px;padding:15px 4px}.card{padding:14px}}
.hero{position:relative;overflow:hidden;min-height:150px;padding:23px 22px;background:linear-gradient(110deg,#146da4,#35b2c4)}.hero:before{content:"🏁";position:absolute;right:18px;top:3px;font-size:66px;opacity:.24;transform:rotate(-12deg)}.hero h1{font-size:clamp(23px,5vw,30px);position:relative}.hero.half-two{background:linear-gradient(110deg,#3558ae,#8b67c5)}.hero.half-two:before{content:"🏆"}.hero .period{display:inline-block;background:#ffffff29;border:1px solid #ffffff88;padding:6px 12px;border-radius:22px;font-size:13px;font-weight:800}.hero .muted{max-width:82%}.scene-art{padding:8px!important;min-height:0!important}.scene-art svg{filter:drop-shadow(0 5px 9px #1b5e7b26)}.meaning-option .button{margin:4px 0} .english-banner{width:100%;margin:0 0 12px;overflow:hidden;border-radius:19px;background:#d5efff;box-shadow:0 6px 18px #23537c12;line-height:0}.english-banner img{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:cover}.english-banner img:not([src]){min-height:120px}</style></head><body><main><header class="english-banner"><img id="englishBanner" src="./english_banner_first_half.webp" alt="英语学习：赛车主题横幅" width="2172" height="724" decoding="async"></header><section class="card" id="intro"><span class="pill" id="stage"></span><div class="big">🏎️ 📖 ⭐</div><h2 id="lessonTitle"></h2><p id="words"></p><p class="muted">先练今天的固定字母组合与拼读，再学 4 个高频词，最后完成听力、拼句与情境挑战。没有麦克风识别。</p><button class="button soft" id="listenWords">🔊 听今天四个高频词</button><button class="button" id="start">开始：先学固定字母组合 →</button><a class="button soft" href="./phonics-v4-original.html" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">🔤 打开原版 V4 字母组合探险</a></section><section class="card hidden" id="dailyPhonics"><div id="dailyPhonicsBody"></div></section><section class="card hidden" id="game"><span class="pill" id="mode"></span><div class="bar"><i id="bar"></i></div><p class="muted" id="step"></p><h2 class="question" id="question"></h2><div id="body"></div><p class="feedback" id="feedback" aria-live="polite"></p><button class="button hidden" id="next">下一题 →</button></section><section class="card hidden" id="finish"><div class="big">🏆</div><h2>高频词赛车挑战完成</h2><p id="result"></p><button class="button soft" id="againListen">🔊 再听金字塔句子</button><button class="button" id="restart">🔁 再练习一次</button><a class="button soft" href="./phonics-v4-original.html" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">🔤 继续 V4 自然拼读</a></section><p class="muted">正式学习从 2026年11月9日开始，预览不计入主工作台的正式学习进度。练习记录仅保存在当前设备。</p></main><script>
(()=>{'use strict';
const lessons=[["a","and","away","big"],["blue","can","come","down"],["find","for","funny","go"],["help","here","I","in"],["is","it","jump","little"],["look","make","me","my"],["not","one","play","red"],["run","said","see","the"],["three","to","two","up"],["we","where","yellow","you"],["all","am","are","at"],["ate","be","black","brown"],["but","came","did","do"],["eat","four","get","good"],["have","he","into","like"],["must","new","no","now"],["on","our","out","please"]];
const titles=["I 和你","一起出发","颜色和动作","找到它","来玩吧","我的小赛车","开心和数字","跑起来","看见什么","你在哪里","新朋友","喜欢的事","看看这里","一起读一读","勇敢前进","认识更多词","高频词挑战"];
const phrases=["I can go.","We can go.","I see blue.","Find it.","I can play.","Look at me.","One, two, three.","I can run.","I see you.","Where is it?","We are here.","I like it.","Look at this.","I am here.","You can go.","I want to play.","We can do it."];
const meanings={"a":"一个","and":"和","away":"离开","big":"大的","blue":"蓝色","can":"能够","come":"来","down":"向下","find":"寻找","for":"为了","funny":"有趣的","go":"走","help":"帮助","here":"这里","I":"我","in":"在里面","is":"是","it":"它","jump":"跳","little":"小的","look":"看","make":"制作","me":"我","my":"我的","not":"不","one":"一","play":"玩","red":"红色","run":"跑","said":"说过","see":"看见","the":"这个","three":"三","to":"向","two":"二","up":"向上","we":"我们","where":"哪里","yellow":"黄色","you":"你","all":"全部","am":"是","are":"是","at":"在","ate":"吃过","be":"成为","black":"黑色","brown":"棕色","but":"但是","came":"来了","did":"做了","do":"做","eat":"吃","four":"四","get":"得到","good":"好的","have":"有","he":"他","into":"进入","like":"喜欢","must":"必须","new":"新的","no":"不","now":"现在","on":"在上面","our":"我们的","out":"出去","please":"请"};
const days=[1,3,4,7,8,10,11,14,15,17,18,21,22,24,25,28,29];
const qs=new URLSearchParams(location.search),lesson=Number(qs.get('lesson')||1);if(!Number.isInteger(lesson)||lesson<1||lesson>17)return;
const words=lessons[lesson-1],phrase=phrases[lesson-1];const secondHalf=days[lesson-1]>=16;document.getElementById('englishBanner').src=secondHalf?'./english_banner_second_half.webp':'./english_banner_first_half.webp';const $=id=>document.getElementById(id);
let stage=0,score=0,answers=[],sceneAnswers=[],phonicsResult=null,locked=false,utter=null;const hasScenes=()=>!!(window.V6EnglishScenes&&window.V6EnglishScenes.has(lesson));const lessonSteps=()=>hasScenes()?9:6;
function speech(s,lang='en-US'){if(!window.speechSynthesis)return;try{speechSynthesis.cancel();utter=new SpeechSynthesisUtterance(s);utter.lang=lang;utter.rate=lang==='en-US'?.78:.9;const voices=speechSynthesis.getVoices();utter.voice=voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)))||null;speechSynthesis.speak(utter)}catch(e){}}
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function button(cls,txt,fn){const b=el('button',cls,txt);b.onclick=fn;return b}
function record(ok,chosen,correct,mode){if(locked)return;locked=true;score+=ok?1:0;answers.push({correct:ok,selected:chosen,expected:correct,mode,word:words[Math.min(stage,3)]});$('feedback').textContent=ok?'🌟 恭喜你，回答正确！':'💡 哦哦，正确答案是：'+correct;$('next').classList.remove('hidden');speech(ok?'恭喜你回答正确':'哦哦，正确答案是','zh-CN')}

$('stage').textContent=lesson<=10?'Pre-Primer 级 · 入门高频词':'Pre-Primer / Primer 级 · 进阶高频词';
$('lessonTitle').textContent='第 '+lesson+' 课 · '+titles[lesson-1];
$('words').textContent='今天的词：'+words.map(w=>w+'（'+(meanings[w]||'高频词')+'）').join('　');
$('listenWords').onclick=()=>speech(words.join('. '));
function beginDailyPhonics(){$('intro').classList.add('hidden');$('finish').classList.add('hidden');$('game').classList.add('hidden');$('dailyPhonics').classList.remove('hidden');window.V6PhonicsLesson.open(lesson,$('dailyPhonicsBody'),speech,result=>{phonicsResult=result;$('dailyPhonics').classList.add('hidden');$('game').classList.remove('hidden');stage=0;render()})}$('start').onclick=beginDailyPhonics;
$('next').onclick=()=>{stage++;if(stage>=lessonSteps())finish();else render()};
function render(){try{if(window.speechSynthesis)window.speechSynthesis.cancel()}catch(e){}if(stage>=6&&hasScenes()){locked=false;$('feedback').textContent='';$('next').classList.add('hidden');$('bar').style.width=(stage/lessonSteps()*100)+'%';$('step').textContent='情境互动 · 第 '+(stage-5)+' / 3 关';$('mode').textContent='🎮 看图、听指令、组句子';$('question').textContent=['看图选句子','听力与句子挑战','情境游戏'][stage-6];$('body').replaceChildren();window.V6EnglishScenes.render(lesson,stage-6,$('body'),speech,result=>{sceneAnswers.push(result);stage++;if(stage>=lessonSteps())finish();else render()});return}locked=false;$('feedback').textContent='';$('next').classList.add('hidden');$('bar').style.width=stage/6*100+'%';$('step').textContent='第 '+(stage+1)+' / 6 关 · 目前答对 '+score+' 题';$('body').replaceChildren();
if(stage<4){const target=words[stage];const spoken=target==='I'?'eye':target;$('mode').textContent='👂 听音认词';$('question').textContent='每题只读一个英文单词，听清楚后选择对应单词。';const listen=button('button soft','🔊 播放本题单词（可反复听）',()=>{try{if(window.speechSynthesis)window.speechSynthesis.cancel()}catch(e){}speech(spoken,'en-US')});listen.setAttribute('aria-label','只播放当前题的一个英语单词');$('body').append(listen);
const grid=el('div','grid');const order=[0,1,2,3].map((_,i)=>(i+stage)%4);
order.forEach(i=>{const w=words[i],b=button('word',w,()=>{if(locked)return;const ok=w===target;b.classList.add(ok?'correct':'wrong');grid.querySelectorAll('button').forEach(x=>x.disabled=true);record(ok,w,target,'listen')});grid.append(b)});$('body').append(grid);return}
if(stage===4){$('mode').textContent='💡 理解词义';$('question').textContent='听英语单词，找出正确的中文意思。';const target=words[1];$('body').append(button('button soft','🔊 听单词',()=>speech(target)));const grid=el('div','grid');[2,0,3,1].forEach(i=>{const w=words[i],cell=el('div','meaning-option');cell.style.cssText='background:#f0f8ff;border:2px solid #b7d9f1;border-radius:17px;padding:9px;min-width:0';const audio=button('button soft','🔊 点我听中文',()=>speech(meanings[w]||w,'zh-CN'));audio.style.cssText='width:100%;font-size:16px;background:#fff0bf;color:#714900;border:2px solid #f3c965';const b=button('button','选择：'+(meanings[w]||w),()=>{if(locked)return;const ok=w===target;grid.querySelectorAll('.meaning-select').forEach(x=>x.disabled=true);record(ok,w,target+' · '+(meanings[target]||''),'meaning')});b.classList.add('meaning-select');b.style.cssText='width:100%;font-size:17px';cell.append(audio,b);grid.append(cell)});$('body').append(grid);return}
$('mode').textContent='🔺 金字塔句子';$('question').textContent='听完整句子，再点击词块按顺序拼出来。';
const tokens=phrase.replace(/[.!?]/g,'').split(' ');
$('body').append(button('button soft','🔊 听完整句子（可重复）',()=>speech(phrase)));$('body').append(el('p','muted','先听整句话，再按听到的顺序点击下方英文词块。完成检查后才显示正确句子。'));
const chosen=[],result=el('div','steps'),pool=el('div','steps');$('body').append(el('p','muted','下面将词语重新排列成完整的句子：'),result,pool);
const order=tokens.map((_,i)=>i).reverse();const submit=button('button','✅ 检查句子',()=>{if(locked)return;const reply=chosen.map(i=>tokens[i]).join(' ');const ok=chosen.every((v,i)=>v===i);pool.querySelectorAll('button').forEach(b=>b.disabled=true);result.querySelectorAll('button').forEach(b=>b.disabled=true);record(ok,reply,phrase,'pyramid');$('body').append(el('p','pyramid','正确句子：'+phrase));if(!ok)speech(phrase)});submit.disabled=true;
order.forEach(i=>{const b=button('chip',tokens[i],()=>{if(locked||b.disabled)return;b.disabled=true;chosen.push(i);const c=button('chip selected',tokens[i],()=>{if(locked)return;const at=chosen.indexOf(i);if(at>=0)chosen.splice(at,1);c.remove();b.disabled=false;submit.disabled=chosen.length!==tokens.length});result.append(c);submit.disabled=chosen.length!==tokens.length});pool.append(b)});$('body').append(submit);
}
function finish(){const payload={score,total:6,answers,words,sceneAnswers,phonicsResult,at:new Date().toISOString()};$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('result').textContent='完成 6 关高频词'+(sceneAnswers.length?'，以及 3 关情境游戏（答对 '+sceneAnswers.filter(x=>x.correct).length+' 关）':'')+'，高频词答对 '+score+' / 6 题。今天学习：'+words.join('、')+'。';$('againListen').onclick=()=>speech(phrase);$('restart').onclick=()=>{stage=0;score=0;answers=[];sceneAnswers=[];phonicsResult=null;beginDailyPhonics()};
try{const key=qs.get('cohort')==='20261109'?'v6_english_course_20261109_progress_v1':'v6_english_preview_progress_v1';const data=JSON.parse(localStorage.getItem(key)||'{}');data[lesson]=payload;localStorage.setItem(key,JSON.stringify(data))}catch(e){}
if(qs.get('cohort')==='20261109'&&window.parent!==window)window.parent.postMessage({type:'v6-english-lesson-complete',cohort:'20261109',lesson,total:6,answers,score,sceneAnswers,phonicsResult},location.origin);
speech('今天的字母组合和英语学习完成了。','zh-CN')}
})();
</script><script src="./english-phonics-audio.js?v=20261105-chunks1"></script><script src="./english-daily-phonics.js?v=20261105-chunks1"></script><script src="./english-scenes.js?v=20261105-listenfix1"></script></body></html>
