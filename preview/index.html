<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4b9df3"><title>小小成长工作台 · 冒险首页测试</title><style>
*{box-sizing:border-box}body{margin:0;color:#26375b;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#d6efff}button{font:inherit;cursor:pointer}.world{min-height:100vh;background:radial-gradient(circle at 85% 10%,#fff4b9 0,transparent 27%),linear-gradient(#78c8ff 0%,#c7f1ff 50%,#e6f9e8 100%);padding:16px 16px 100px;overflow:hidden}.shell{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:clamp(20px,4vw,34px);font-weight:1000;color:#fff;text-shadow:0 3px #285ac2,2px 5px #285ac2,0 7px 14px #3561a7}.pill{background:#ffffffd9;border:2px solid white;border-radius:30px;padding:9px 14px;box-shadow:0 5px 12px #3381bb20;font-weight:800}.banner{margin:18px 0;position:relative;overflow:hidden;background:linear-gradient(110deg,#4a76ec,#7457e4 65%,#c26df1);border:4px solid #ffffffaa;border-radius:28px;padding:24px 25px;color:white;box-shadow:0 12px 0 #3558a75c,0 22px 25px #4776bd30}.banner h1{font-size:clamp(23px,4vw,37px);margin:0 0 7px;text-shadow:0 3px #413c9b}.banner p{margin:0;line-height:1.7;max-width:570px}.banner:after{content:"🚀";font-size:100px;position:absolute;right:5%;top:-8px;transform:rotate(-18deg);filter:drop-shadow(0 10px 6px #2a348666)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px}.section-title{font-size:23px;font-weight:950;color:#2557a2;text-shadow:0 2px white;margin:5px 0 12px}.islands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.island{position:relative;display:flex;flex-direction:column;align-items:center;overflow:hidden;min-height:256px;border:4px solid white;border-radius:27px;padding:4px 8px 15px;box-shadow:0 10px 0 #5b96c95c,0 16px 22px #4986b330;transition:transform .16s;background:linear-gradient(#c3f2ff,#e5fbff)}.island:active{transform:translateY(5px)}.island.cn{background:linear-gradient(#ffe6f3,#d5fce7)}.island.ma{background:linear-gradient(#e4f9d0,#d5f1ff)}.island.en{background:linear-gradient(#e5d9ff,#ffeaf7)}.island.sc{background:linear-gradient(#d9f9ff,#e3f4ff)}.island-art{width:min(100%,250px);height:155px}.island-art svg{height:100%;width:100%;filter:drop-shadow(0 7px 4px #38638d2c)}.island-name{font-size:22px;font-weight:1000;color:#31538b}.island-desc{font-size:12px;color:#6e7d9b;margin:5px 0}.island-arrow{font-size:13px;font-weight:800;color:#4463c5}.side{display:flex;flex-direction:column;gap:15px}.panel{border:4px solid #fff;background:#ffffffd9;border-radius:25px;padding:18px;box-shadow:0 9px 0 #669bd33b,0 14px 20px #417dbd20}.panel h2{font-size:20px;margin:0 0 12px;color:#3a57a0}.task{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #d9e7fa;font-size:14px}.task:last-child{border:0}.task .tick{font-size:22px}.bar{height:14px;background:#dce7fb;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,#5bd2aa,#4d8cff);transition:width .3s}.reward{background:linear-gradient(140deg,#fff8d7,#ffe3a4)}.reward .car{font-size:66px;text-align:center;filter:drop-shadow(0 5px 4px #bb8b3555)}.action{border:0;border-radius:16px;background:linear-gradient(#ffcf66,#ff9e37);box-shadow:0 5px 0 #c97d20;padding:13px 20px;font-weight:900;color:#663e16}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffeb;backdrop-filter:blur(12px);display:flex;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:2px solid white;box-shadow:0 -4px 22px #4b84ba22;z-index:10}.bottom button{border:0;border-radius:15px;padding:11px 18px;background:#eaf0ff;color:#3b5ca5;font-weight:850}.bottom button.active{background:#458fee;color:white}.screen{display:none}.screen.active{display:block}.study{max-width:750px;margin:15px auto}.question{font-size:clamp(22px,4vw,30px);font-weight:900;line-height:1.6}.answers{display:grid;gap:12px;margin:15px 0}.answer{border:3px solid #dce8ff;background:#f7faff;border-radius:18px;padding:17px;text-align:left;font-weight:800;font-size:18px}.answer:disabled{opacity:.7}.speaker{border:0;border-radius:14px;background:#dcecff;color:#285ca5;padding:11px 15px;font-weight:850}.back{border:0;border-radius:13px;background:#ffffffd8;color:#285ca5;padding:10px 16px;font-weight:850;margin-bottom:12px}.tip{font-size:13px;color:#697d9e}.badge{display:inline-block;background:#e4f7f0;color:#188b6d;padding:7px 12px;border-radius:15px;font-weight:800}.footer-note{text-align:center;font-size:12px;color:#5681a6;margin:16px}.choice-row{display:flex;align-items:center;gap:8px}.choice-row .answer{flex:1;margin:0}.speak-option{flex:none}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.banner:after{font-size:70px;right:0;top:10px}.banner p{max-width:75%}.island{min-height:224px}.island-art{height:130px}.island-name{font-size:19px}}
@media(max-width:520px){.world{padding:12px 12px 100px}.pill{font-size:12px;padding:8px}.banner{padding:19px}.banner:after{font-size:60px;right:-8px;top:22px}.banner h1{font-size:24px}.banner p{font-size:13px}.islands{gap:10px}.island{border-width:3px;min-height:206px;padding:2px 4px 12px;border-radius:21px}.island-art{height:125px}.island-name{font-size:17px}.island-desc{font-size:11px}.side{grid-template-columns:1fr}.bottom{gap:5px}.bottom button{padding:10px 9px;font-size:12px;flex:1}.section-title{font-size:20px}}
</style></head><body><div class="world"><div class="shell"><header class="top"><div class="logo">🚀 小小成长工作台</div><div class="pill">⭐ 冒险体验版</div></header><div class="banner"><h1>欢迎来到知识星球！</h1><p>今天想探索哪座岛屿？<br>完成两科任务，就能领取赛车通行证！</p></div>
<section id="home" class="screen active"><div class="layout"><div><h2 class="section-title">🗺️ 四大知识岛屿</h2><div class="islands"><button class="island cn" data-sub="cn" aria-label="进入语文森林"><div class="island-art"><svg viewBox="0 0 240 185" aria-hidden="true"><defs><linearGradient id="gcn" x2="0" y2="1"><stop stop-color="#a9f18b"/><stop offset="1" stop-color="#2fb18c"/></linearGradient></defs><ellipse cx="120" cy="142" rx="106" ry="28" fill="#213e85" opacity=".18"/><path d="M25 103 Q120 45 215 103 L171 155 Q120 187 69 155Z" fill="#7560a7"/><path d="M25 103 Q120 50 215 103 Q216 128 120 136 Q24 128 25 103" fill="url(#gcn)" stroke="#fff" stroke-width="5"/><path d="M60 83Q120 45 180 83" stroke="#ffffff90" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M74 74V35Q96 27 119 40V95Q98 80 74 88Z" fill="#fff5da" stroke="#ad6936" stroke-width="5"/><path d="M120 40Q143 27 166 35V88Q143 80 120 95Z" fill="#fffaf0" stroke="#ad6936" stroke-width="5"/><path d="M88 48h18m-18 10h18m26-10h18m-18 10h18" stroke="#d88e5b" stroke-width="3"/></svg></div><div class="island-name">语文森林</div><div class="island-desc">识字 · 拼音 · 故事</div><span class="island-arrow">进入探索 →</span></button><button class="island ma" data-sub="ma" aria-label="进入数学城堡"><div class="island-art"><svg viewBox="0 0 240 185" aria-hidden="true"><defs><linearGradient id="gma" x2="0" y2="1"><stop stop-color="#d6ef70"/><stop offset="1" stop-color="#55bce9"/></linearGradient></defs><ellipse cx="120" cy="142" rx="106" ry="28" fill="#213e85" opacity=".18"/><path d="M25 103 Q120 45 215 103 L171 155 Q120 187 69 155Z" fill="#7560a7"/><path d="M25 103 Q120 50 215 103 Q216 128 120 136 Q24 128 25 103" fill="url(#gma)" stroke="#fff" stroke-width="5"/><path d="M60 83Q120 45 180 83" stroke="#ffffff90" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="71" y="30" width="100" height="70" rx="15" fill="#f8f9ff" stroke="#365fae" stroke-width="6"/><rect x="84" y="40" width="74" height="16" rx="5" fill="#a9e6ff"/><path d="M91 69h17m-9-9v18m30-9h17m-17 10h17" stroke="#4269b7" stroke-width="6" stroke-linecap="round"/></svg></div><div class="island-name">数学城堡</div><div class="island-desc">数字 · 逻辑 · 计算</div><span class="island-arrow">进入探索 →</span></button><button class="island en" data-sub="en" aria-label="进入英语港湾"><div class="island-art"><svg viewBox="0 0 240 185" aria-hidden="true"><defs><linearGradient id="gen" x2="0" y2="1"><stop stop-color="#ffc2e6"/><stop offset="1" stop-color="#9b7bea"/></linearGradient></defs><ellipse cx="120" cy="142" rx="106" ry="28" fill="#213e85" opacity=".18"/><path d="M25 103 Q120 45 215 103 L171 155 Q120 187 69 155Z" fill="#7560a7"/><path d="M25 103 Q120 50 215 103 Q216 128 120 136 Q24 128 25 103" fill="url(#gen)" stroke="#fff" stroke-width="5"/><path d="M60 83Q120 45 180 83" stroke="#ffffff90" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M76 35h56v60H76z" fill="#e9d3ff" stroke="#7e4fc3" stroke-width="5"/><text x="83" y="80" font-size="42" font-weight="900" fill="#7e4fc3">Aa</text><circle cx="162" cy="68" r="24" fill="#72d5ff"/><path d="M151 69h22m-11-11v22" stroke="#fff" stroke-width="6"/></svg></div><div class="island-name">英语港湾</div><div class="island-desc">听力 · 拼读 · 单词</div><span class="island-arrow">进入探索 →</span></button><button class="island sc" data-sub="sc" aria-label="进入科学实验岛"><div class="island-art"><svg viewBox="0 0 240 185" aria-hidden="true"><defs><linearGradient id="gsc" x2="0" y2="1"><stop stop-color="#c4f1ff"/><stop offset="1" stop-color="#62bbdd"/></linearGradient></defs><ellipse cx="120" cy="142" rx="106" ry="28" fill="#213e85" opacity=".18"/><path d="M25 103 Q120 45 215 103 L171 155 Q120 187 69 155Z" fill="#7560a7"/><path d="M25 103 Q120 50 215 103 Q216 128 120 136 Q24 128 25 103" fill="url(#gsc)" stroke="#fff" stroke-width="5"/><path d="M60 83Q120 45 180 83" stroke="#ffffff90" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M94 34h40v12h-9v27l26 25q5 8-6 10H84q-11-2-6-10l26-25V46h-10Z" fill="#b0effb" stroke="#417ac6" stroke-width="5"/><path d="M89 91q28-12 53 0l7 11H81Z" fill="#8de5b4"/><circle cx="161" cy="51" r="16" fill="#fbd774"/><circle cx="176" cy="29" r="7" fill="#fff"/></svg></div><div class="island-name">科学实验岛</div><div class="island-desc">观察 · 发现 · 探索</div><span class="island-arrow">进入探索 →</span></button></div></div><aside class="side"><div class="panel"><h2>🎯 今日冒险任务</h2><div id="tasks"></div><div class="bar"><div class="fill" id="progress"></div></div><div class="tip" id="progressText"></div></div><div class="panel reward"><h2>🏁 赛车通行证</h2><div class="car">🏎️</div><p id="unlock">再完成两科任务，解锁赛车！</p><button class="action" id="rewardBtn">查看奖励</button></div></aside></div></section>
<section id="study" class="screen"><div class="study"><button class="back" id="back">← 返回知识星球</button><div class="panel"><div class="badge" id="studyName"></div><p class="tip" id="counter"></p><div class="question" id="question"></div><div style="margin:14px 0"><button class="speaker" id="read">🔊 听题目</button></div><p class="tip" id="readTip"></p><div class="answers" id="answers"></div><p id="feedback" aria-live="polite"></p><button class="action" id="next" style="display:none">下一关 →</button></div></div></section>
<section id="parent" class="screen"><div class="study"><button class="back" id="parentBack">← 返回首页</button><div class="panel"><h2>⚙️ 体验版设置</h2><p>这个版本重点验证儿童首页的视觉与点击体验，暂不改变正式学习系统。</p><p class="tip">记录只保存在当前浏览器，可随时清除。</p><button class="action" id="clear">清空本页测试记录</button></div></div></section><p class="footer-note">独立视觉原型 · 非真实 3D 场景 · 仅用于验收首页和基础交互</p></div></div><nav class="bottom"><button class="active" data-nav="home">🏠 首页</button><button data-nav="home">🗺️ 岛屿</button><button data-nav="parent">⚙️ 设置</button></nav>
<script>
const subjects={cn:{name:'语文森林',q:[['🔊 点击听题，选出正确的汉字。',['山','水','火'],0,true,'请找出表示高高山峰的那个汉字。'],['🔊 点击听题，选出正确的汉字。',['猫','狗','鸟'],0,true,'请找出表示会喵喵叫的小动物的那个汉字。']]},ma:{name:'数学城堡',q:[['8 加 7 等于多少？',['14','15','16'],1],['20 减 6 等于多少？',['12','14','16'],1]]},en:{name:'英语港湾',q:[['哪个英文单词表示猫？',['cat','cup','dog'],0],['哪个单词表示太阳？',['sun','pen','hat'],0]]},sc:{name:'科学实验岛',q:[['植物生长通常需要什么？',['阳光和水','玩具','电视'],0],['哪种动物会下蛋？',['小鸡','小猫','小狗'],0]]}};
let done={};try{done=JSON.parse(localStorage.getItem('growth-island-demo')||'{}')}catch(e){}let current=null,idx=0,answered=false;const $=id=>document.getElementById(id);function persist(){try{localStorage.setItem('growth-island-demo',JSON.stringify(done))}catch(e){}}function count(){return Object.values(done).filter(Boolean).length}function home(){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$('home').classList.add('active');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav==='home'));const n=count();$('tasks').innerHTML=Object.keys(subjects).map(k=>'<div class="task"><span class="tick">'+(done[k]?'✅':'⭕')+'</span><span>'+subjects[k].name+'</span></div>').join('');$('progress').style.width=Math.min(100,n/2*100)+'%';$('progressText').textContent='已完成 '+n+' 科 · 今日目标 2 科';$('unlock').textContent=n>=2?'🎉 已解锁！这是演示通行证，暂未连接赛车游戏。':'再完成 '+(2-n)+' 科任务，解锁赛车！'}function showParent(){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$('parent').classList.add('active');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav==='parent'))}
function speak(t,lang='zh-CN'){if(!('speechSynthesis'in window)){alert('浏览器不支持朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.83;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)))||null;speechSynthesis.speak(u)}
function start(k){current=k;idx=0;document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$('study').classList.add('active');renderQuestion()}function renderQuestion(){const s=subjects[current],q=s.q[idx];answered=false;$('studyName').textContent=s.name;$('counter').textContent='第 '+(idx+1)+' / '+s.q.length+' 关';$('question').textContent=q[0];$('question').style.fontSize=q[3]?'clamp(100px,24vw,150px)':'';$('question').style.textAlign=q[3]?'center':'';$('question').setAttribute('aria-label',q[3]?'看图选字':q[0]);$('feedback').textContent='';$('next').style.display='none';$('readTip').textContent=q[3]?'听音选字：点击喇叭听题。屏幕不会显示目标字，选项不朗读。':'点喇叭可以听题目和每个选项。';$('read').onclick=()=>speak(q[3]?q[4]:q[0]);$('answers').innerHTML=q[1].map((a,i)=>'<div class="choice-row"><button class="answer" data-a="'+i+'">'+['A','B','C'][i]+'．'+a+'</button>'+(q[3]?'':'<button class="speaker speak-option" data-s="'+i+'">🔊</button>')+'</div>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const t=q[1][+b.dataset.s];speak(t,current==='en'?'en-US':'zh-CN')});document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const correct=+b.dataset.a===q[2];$('feedback').textContent=correct?'🌟 答对啦！':'💡 正确答案是：'+q[1][q[2]];document.querySelectorAll('[data-a]').forEach(x=>x.disabled=true);$('next').style.display='inline-block'});$('next').onclick=()=>{idx++;if(idx<s.q.length)renderQuestion();else{done[current]=true;persist();home();alert('🎉 完成 '+s.name+' 的体验关卡！')}}}
document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>start(b.dataset.sub));document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>b.dataset.nav==='parent'?showParent():home());$('back').onclick=home;$('parentBack').onclick=home;$('rewardBtn').onclick=()=>alert(count()>=2?'赛车通行证已解锁！正式版再连接赛车游戏。':'先完成任意两科体验任务哦！');$('clear').onclick=()=>{if(confirm('清空本页的所有测试进度？')){done={};persist();home()}};home();
</script></body></html>
