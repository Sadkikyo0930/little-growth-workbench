<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小成长工作台</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:linear-gradient(140deg,#e5f6ff,#f7f0ff);color:#33345a}.wrap{max-width:900px;margin:auto;padding:16px}header,.panel{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 25px #7882b21c}.hero{background:linear-gradient(120deg,#6b5be8,#41a4df);color:white;padding:28px;border-radius:24px}.hero h1{margin:0}nav,.grid,.buttons{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button{border:0;background:#eceaff;color:#5146b3;padding:12px 15px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:#625ee2;color:white}.card{flex:1 1 170px;background:white;border-radius:20px;padding:20px;box-shadow:0 6px 20px #7882b218}.card h2{margin:6px 0}.question{font-size:23px;font-weight:700}.option{display:block;width:100%;margin:9px 0;text-align:left;background:#f3f2ff;padding:16px}.small{color:#7a7f9b;font-size:14px}.bar{height:13px;background:#eae8fb;border-radius:20px;overflow:hidden}.fill{height:100%;background:#58b6a8}select{padding:10px;border-radius:10px;border:1px solid #bbb;font-size:16px}footer{text-align:center;color:#8185a3;font-size:12px;padding:20px}</style><style>
.hero{position:relative;overflow:hidden;min-height:185px}.hero:after{content:"🚀 🪐 ⭐";position:absolute;right:20px;top:20px;font-size:36px;transform:rotate(-9deg);opacity:.7}.hero h1{position:relative;z-index:1}.card{transition:transform .18s,box-shadow .18s;border:1px solid #ebe8ff}.card:hover{transform:translateY(-3px);box-shadow:0 12px 24px #7c82b32b}.card:nth-child(4n+1){background:#fff9e9}.card:nth-child(4n+2){background:#effcf9}.card:nth-child(4n+3){background:#f4f1ff}.card:nth-child(4n){background:#eff7ff}.question{letter-spacing:.3px}.option{border:2px solid transparent}.option:focus{border-color:#7a74e9}.voicebar{display:flex;gap:8px;align-items:center;margin:10px 0}.voicebar button{background:#e1f4ff;color:#2478a5}.stepper{font-weight:700;color:#695ee4}.reward{background:linear-gradient(120deg,#fff1c9,#fff8e7);border:2px dashed #efcb76}.tips{padding:12px;border-radius:15px;background:#e9f8f3;color:#29755f}
</style><div class="wrap"><div class="hero"><h1>🌈 小小成长工作台</h1><p>和小星星一起探索知识星球！每天完成 2～3 科任务，解锁赛车世界 🏎️</p></div><nav id="nav"></nav><main id="main"></main><footer>V3 星球探险版 · 数据仅保存在当前浏览器 · 赛车尚未接入</footer></div><script>
const S=[['cn','📚','语文'],['ma','🧮','数学'],['en','🔤','英语'],['sc','🔬','科学']],B={cn:[['哪个字表示山？',['山','水','火'],0,1],['哪个字表示太阳的太？',['大','太','天'],1,1],['请选择“木”字',['木','本','术'],0,1],['拼音 mā 是第几声？',['一声','二声','三声'],0,0]],ma:[['8 加 7 等于多少？',['14','15','16'],1],['下面哪个数最大？',['69','96','89'],1],['20 减 6 等于多少？',['12','14','16'],1],['2、4、6、下一个数字是？',['7','8','10'],1]],en:[['哪个英文单词表示猫？',['cat','cup','dog'],0],['哪个单词表示太阳？',['sun','pen','hat'],0],['哪个单词表示红色？',['red','bed','run'],0],['哪个单词表示狗？',['dog','dig','dot'],0]],sc:[['植物生长通常需要什么？',['阳光和水','玩具','电视'],0],['下雨时天空通常有什么？',['云','沙子','星星'],0],['哪种动物会下蛋？',['小鸡','小猫','小狗'],0],['白天给地球带来光和热的是？',['月亮','太阳','星星'],1]]};
let state;try{state=JSON.parse(localStorage.getItem('growth-v2-live'))||{}}catch(e){state={}}state.done||={};state.test||={};state.required||=2;state.minutes||=20;let page='home',q=null;const $=id=>document.getElementById(id),day=()=>new Date().toLocaleDateString('sv-SE'),save=()=>localStorage.setItem('growth-v2-live',JSON.stringify(state)),todayDone=()=>state.done[day()]||{},count=()=>Object.values(todayDone()).filter(Boolean).length;
function say(t,lang='zh-CN'){if(!('speechSynthesis'in window)){alert('此浏览器暂不支持朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.82;u.pitch=1.07;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))||null;speechSynthesis.speak(u)}
function go(p){page=p;q=null;draw()}function draw(){const pages=[['home','🏠 今日任务'],['test','🧭 能力摸底'],['growth','🏅 成长档案'],['care','💗 外婆陪学'],['parent','⚙️ 家长设置']];$('nav').innerHTML=pages.map(([k,n])=>'<button class="'+(page===k?'primary':'')+'" data-page="'+k+'">'+n+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));if(q)return quiz();let html='';if(page==='home'){let idx=Math.floor(Date.now()/86400000)%4,rec=[S[idx],S[(idx+1)%4],S[(idx+2)%4]];html='<div class="panel"><h2>🗺️ 今日探索地图</h2><p class="small">跟着小星星完成学习关卡，解锁赛车通行证！</p><div class="bar"><div class="fill" style="width:'+Math.min(100,100*count()/state.required)+'%"></div></div><p>已完成 '+count()+' / '+state.required+' 科</p><strong>'+(count()>=state.required?'🎉 赛车通行证已解锁！':'继续完成学习，解锁赛车！')+'</strong></div><div class="grid">'+rec.map(([id,ic,name])=>'<div class="card"><div style="font-size:36px">'+ic+'</div><h2>'+name+'</h2><p class="small">🪄 今日推荐任务</p><button class="primary" data-start="'+id+'">'+(todayDone()[id]?'再练一次':'开始学习')+'</button></div>').join('')+'</div><div class="panel">🎁 🏎️ 今日冒险奖励：'+state.minutes+' 分钟（目前仅演示解锁状态，未连接赛车游戏）</div>'}else if(page==='test'){html='<div class="panel"><h2>🔎 知识探险 · 趣味摸底</h2><p>每科 4 题，先体验，不代表完整能力水平。识字题不会念出需要识别的汉字。</p></div><div class="grid">'+S.map(([id,ic,name])=>'<div class="card"><h2>'+ic+' '+name+'</h2><p>'+(state.test[id]?'上次答对 '+state.test[id]+'/4':'尚未测试')+'</p><button class="primary" data-test="'+id+'">开始摸底</button></div>').join('')+'</div>'}else if(page==='growth'){html='<div class="panel"><h2>🏅 成长档案</h2><p>今天已完成 '+count()+' 科</p>'+S.map(([id,ic,name])=>'<p>'+ic+' '+name+'：'+(state.test[id]===undefined?'未摸底':'摸底 '+state.test[id]+'/4')+'；'+(todayDone()[id]?'今日完成':'今日未完成')+'</p>').join('')+'</div>'}else if(page==='care'){html='<div class="panel"><h2>💗 外婆陪学</h2><p>陪孩子完成系统推荐的任务即可，遇到不认识的字可以点喇叭。</p><div class="buttons">'+['太简单','刚刚好','有点难','今天累了'].map(x=>'<button data-feel="'+x+'">'+x+'</button>').join('')+'</div><p>今日反馈：'+(state.feel?.[day()]||'尚未填写')+'</p></div>'}else{html='<div class="panel"><h2>⚙️ 家长设置</h2><p>每天完成 <select id="req"><option value="2">2 科</option><option value="3">3 科</option></select> 解锁赛车</p><p>奖励时长 <select id="mins"><option>10</option><option>15</option><option>20</option><option>30</option></select> 分钟</p><button class="primary" id="save">保存设置</button> <button id="reset">清空体验数据</button><p class="small">本地设置不是家长账户保护；不同手机暂不自动同步。</p></div>'}$('main').innerHTML=html;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start,false));document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>start(b.dataset.test,true));document.querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{state.feel||={};state.feel[day()]=b.dataset.feel;save();draw()});if(page==='parent'){$('req').value=state.required;$('mins').value=state.minutes;$('save').onclick=()=>{state.required=+$('req').value;state.minutes=+$('mins').value;save();draw()};$('reset').onclick=()=>{if(confirm('确定清空本机所有体验记录吗？')){localStorage.removeItem('growth-v2-live');state={done:{},test:{},required:2,minutes:20};draw()}}}}
function start(id,test){q={id,test,i:0,score:0,answered:false};quiz()}function quiz(){let item=B[q.id][q.i];if(!item){if(q.test)state.test[q.id]=q.score;else{state.done[day()]||={};state.done[day()][q.id]=true}save();q=null;$('main').innerHTML='<div class="panel"><h2>🎉 完成啦！</h2><p>本次答对 '+(page==='test'?state.test[Object.keys(state.test).at(-1)]+' / 4 题':'题目已经记录完成')+'</p><button class="primary" id="back">返回今日任务</button></div>';$('back').onclick=()=>go('home');return}let cn=q.id==='cn'&&item[3]===1;$('main').innerHTML='<div class="panel"><p class="small"><span class="stepper">⭐ 第 '+(q.i+1)+' / 4 关</span></p><p class="question">'+item[0]+'</p><button id="speak">🔊 听题目</button><p class="small">'+(cn?'识字摸底只朗读操作说明，不泄露答案。':'不认识字也可以点喇叭听题目和选项。')+'</p>'+item[1].map((a,i)=>'<div class="buttons"><button class="option" data-answer="'+i+'">'+['A','B','C'][i]+'．'+a+'</button>'+(cn?'':'<button data-voice="'+i+'">🔊</button>')+'</div>').join('')+'<p id="hint"></p><button class="primary" id="next" style="display:none">下一题 →</button></div>';$('speak').onclick=()=>say(cn?'请选出你认识的汉字。':item[0]);document.querySelectorAll('[data-voice]').forEach(b=>b.onclick=()=>{let t=item[1][+b.dataset.voice];say(t,q.id==='en'?'en-US':'zh-CN')});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(q.answered)return;q.answered=true;let ok=+b.dataset.answer===item[2];if(ok)q.score++;$('hint').textContent=ok?'🌟 答对啦！':'💡 正确答案是：'+item[1][item[2]];$('next').style.display='inline-block'});$('next').onclick=()=>{q.i++;q.answered=false;quiz()}}draw();
</script></html>
