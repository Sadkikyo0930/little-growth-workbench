<!doctype html><html lang="zh-CN"><head><script src="./isolation.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="./selftest-auth.js"></script><title>R5 独立测试账号校验</title><style>body{font:17px/1.65 -apple-system,sans-serif;background:#edf5ff;color:#183d65;padding:22px}main{max-width:640px;margin:auto;background:white;padding:24px;border-radius:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:6px 0;border:1px solid #9bb9db;border-radius:10px;font:inherit}button{background:#185dc7;color:white}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>R5 独立测试环境</h1><p>目标家庭：<strong>r5-selftest-family</strong><br>测试记录、设备和游戏计时与正式家庭分开。</p><p>只用独立测试账号，必须唯一属于测试家庭且是 owner/parent。没有成员关系会停止，不会自动迁移成员。</p><label>测试账号<input id="username" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password"></label><button id="login">登录并执行只读隔离检查</button><button id="bind" disabled>新建本次测试专用设备</button><pre id="status">尚未验证，暂时不要答题。课程开始日仍为2026-11-09。</pre><p id="links" hidden><a href="./">进入测试V6</a> · <a href="https://sadkikyo0930.github.io/little-racing-v2-test/">进入赛车测试站</a></p><button id="localclear">仅清理本机测试数据</button><p><a href="./SAFETY_AND_CLEANUP.md">隔离和云端安全清理方案</a></p></main><script>
const status=document.querySelector('#status'),bind=document.querySelector('#bind');let ready=false;
const started=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai'}).format(new Date())>='2026-11-09';
document.querySelector('#login').onclick=async()=>{bind.disabled=true;ready=false;document.querySelector('#links').hidden=true;try{const input=document.querySelector('#password'),password=input.value;input.value='';await R5TestAuth.login(document.querySelector('#username').value.trim(),password);ready=true;bind.disabled=false;status.textContent='测试账号归属与数据污染检查通过。请建立本次测试设备。'+(!started()?'\n课程尚未开始，11月9日后再次校验，不要提前答题。':'');}catch(e){status.textContent=e.message==='TEST_ACCOUNT_MEMBERSHIP_REQUIRED'?'账号不是独立测试家庭的唯一 owner/parent，已停止。请核实测试账号成员关系，不要改用正式账号。':e.message.startsWith('TEST_FIXTURES_PRESENT_TODAY')?'检测到当天预置/其他账号演示成绩，不能开始真实答题验收。请按清理方案审核，不能把现有80%当成真实作答结果。':e.message;}};
bind.onclick=async()=>{if(!ready)return;bind.disabled=true;try{await R5TestAuth.createDevice();status.textContent=started()?'隔离账号与新测试设备校验通过。可进入真实当天课程；计划冲突时会停止同步。':'设备仅绑定测试家庭。11月9日重新校验后再开始，不提前修改学习日。';document.querySelector('#links').hidden=!started();}catch(e){status.textContent=e.message;}finally{bind.disabled=false}};
document.querySelector('#localclear').onclick=async()=>{if(confirm('仅删除 r5-selftest.v1: 本机测试数据；云端和正式本地存档不动。继续？')){await R5Isolation.clearLocal();location.reload()}};
</script></body></html>
