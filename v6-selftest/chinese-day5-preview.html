<!doctype html><html lang="zh-CN"><head><script src="./isolation.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第五个语文日·赠汪伦</title><style>*{box-sizing:border-box}body{margin:0;background:#ecfaf8;color:#17586a;font-family:-apple-system,"PingFang SC",sans-serif}main{max-width:700px;margin:auto;padding:12px 12px 36px}.card{padding:18px 14px;background:white;border-radius:24px;margin-bottom:16px;box-shadow:0 5px 18px #75b0aa30}h2{font-size:23px}.hero{border-radius:22px;background:linear-gradient(#6ecff2,#c5f7d9);padding:24px 10px;text-align:center}.hero h1{font-size:28px;margin:5px}.scene{font-size:clamp(37px,9vw,65px);margin:15px 0}.poem{background:#fff8e9;border-radius:20px;padding:16px;text-align:center;font-size:clamp(24px,6vw,35px);font-weight:700;line-height:2.05;color:#583b21}.poem small{display:block;font-size:15px;line-height:1.5}.pinyin,.vocab,.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button{font:inherit;cursor:pointer}button.btn{background:#009b97;color:white;border:0;border-radius:16px;padding:15px;min-height:54px;font-weight:800;font-size:17px;width:100%;margin-top:12px}.pinyin button,.answers button,.vocab button{background:#f4fefb;border:2px solid #a9dfd4;border-radius:15px;padding:18px 8px;font-size:21px;font-weight:750;color:#126b70}.vocab{grid-template-columns:repeat(3,1fr)}.vocab button{font-size:30px}.vocab small{display:block;font-size:13px}.paper{height:230px;border:2px solid #a3d8d1;border-radius:15px;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,#fff 0,#fff 56px,#d1e6e2 57px,#fff 58px,#fff 114px)}.paper span{position:absolute;inset:0;display:grid;place-items:center;font-size:140px;color:#dfeee9;pointer-events:none}.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}.actions button{font-size:14px}.note{color:#638086;font-size:14px;line-height:1.7}#feedback{font-weight:750} .answers button.correct{background:#c7f6d2}.answers button.wrong{background:#ffe0e0}.lesson-art{display:block;width:100%;height:auto;border-radius:18px;margin:10px 0 16px;box-shadow:0 4px 14px #75b0aa30}</style><style>.lesson-art{cursor:pointer;touch-action:manipulation}.lesson-art:focus-visible{outline:3px solid #02a49b}.lesson-touch-note{font-size:13px;color:#6a817a;text-align:center;padding:8px}.lesson-overlay{position:fixed;inset:0;z-index:500;background:#122a28bb;display:none;align-items:center;justify-content:center;padding:12px}.lesson-overlay.open{display:flex}.lesson-overlay-card{background:white;border-radius:20px;padding:18px;max-width:540px;width:100%;max-height:90dvh;overflow:auto}.lesson-overlay-card .close{float:right;border:0;background:#eaf6f1;border-radius:50%;height:42px;width:42px;font-size:23px}main .hero,main .poem,main .note,main .card>h2,main .paper,main .actions,main #traceTitle,main #quiz,main #tones,main #chars{display:none!important}main .card{padding:8px;margin-bottom:10px}main .lesson-art{margin:0;border-radius:16px}.lesson-overlay-card .paper{min-height:240px}.lesson-overlay-card .btn{margin:10px 0}</style></head><body><main><div class="card"><img class="lesson-art" src="./%E6%A1%83%E8%8A%B1%E6%BD%AD%E7%95%94%E8%B5%A0%E6%B1%AA%E4%BC%A6.png" alt="桃花潭畔赠汪伦.png"><div class="hero"><strong>🦁 第五个语文日 · 古诗与复韵母</strong><h1>《赠汪伦》</h1><div class="scene">🌸 🛶 👨‍🏫 🤝</div><p>李白乘舟将欲行，忽闻岸上踏歌声</p></div><h2>📖 听完整古诗</h2><div class="poem"><small>《赠汪伦》· 唐·李白</small>李白乘舟将欲行，<br>忽闻岸上踏歌声。<br>桃花潭水深千尺，<br>不及汪伦送我情。</div><button class="btn" id="read">🔊 老师朗读整首诗</button><p class="note">先听，再说说：谁来给李白送行？他们的友情有多深？</p></div><div class="card"><h2>🎵 复韵母复习</h2><img class="lesson-art" src="./%E4%B8%80%E5%B9%B4%E7%BA%A7%E6%8B%BC%E9%9F%B3%E5%A4%8D%E4%B9%A0_ai%E4%B8%8Eao%E5%B0%8F%E8%AF%BE%E5%A0%82.png" alt="一年级拼音复习_ai与ao小课堂.png"><p class="note">听一听复韵母 ai、ao，并跟着读含这些韵母的常见字。</p><div class="pinyin" id="tones"></div><p class="note">复习 ai、ao：白 bái、来 lái、桃 táo、好 hǎo。</p></div><div class="card"><h2>✍️ 今天只写三个基础字</h2><img class="lesson-art" src="./%E4%B8%80%E5%B9%B4%E7%BA%A7%E8%AF%86%E5%AD%97%E6%8F%8F%E7%BA%A2%E8%AF%BE%E5%A0%82_poster.png" alt="一年级识字描红课堂_poster.png"><div class="vocab" id="chars"></div><p class="note">听老师念字，然后手指描写。笔画顺序需依照课堂示范，当前练习不自动判定笔顺。</p><h3 id="traceTitle">第 1 / 3 个：小</h3><div class="paper"><span id="guide">小</span><canvas id="paper"></canvas></div><div class="actions"><button class="btn" id="clear">清除</button><button class="btn" id="nextChar">✅ 写好了 · 下一个</button></div></div><div class="card"><h2>⭐ 古诗小闯关</h2><img class="lesson-art" src="./%E4%B8%80%E5%B9%B4%E7%BA%A7%E8%AF%AD%E6%96%87%E8%B6%A3%E5%91%B3%E9%97%AF%E5%85%B3.png" alt="一年级语文趣味闯关.png"><div id="quiz"></div></div></main><script>
const chars=['人','水','来'],tones=[['ai','爱 ài'],['ai','白 bái'],['ao','桃 táo'],['ao','好 hǎo']],qs=[['是谁在岸边为李白送行？',['汪伦','小娃','渔夫'],0],['李白听到了什么声音？',['踏歌声','雷声','鸟叫声'],0],['诗人用什么比喻友情深厚？',['桃花潭水','一座高山','一片白云'],0]];let char=0,q=0,score=0,timer=null;const $=id=>document.getElementById(id);
function say(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.72;speechSynthesis.speak(u)}
$('read').onclick=()=>say('赠汪伦。唐，李白。李白乘舟将欲行。忽闻岸上踏歌声。桃花潭水深千尺。不及汪伦送我情。');$('tones').innerHTML=tones.map(([a,b])=>'<button data-voice="'+b+'">'+a+'<small style="display:block">'+b+'</small></button>').join('');document.querySelectorAll('[data-voice]').forEach(b=>b.onclick=()=>say(b.dataset.voice));$('chars').innerHTML=chars.map(c=>'<button data-char="'+c+'">'+c+'<small>🔊 点我听</small></button>').join('');document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>say(b.dataset.char));let ctx,c;
function trace(){const z=chars[char];$('traceTitle').textContent='第 '+(char+1)+' / 3 个：'+z;$('guide').textContent=z;c=$('paper');let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=7;ctx.strokeStyle='#0a9d97';ctx.lineCap='round';let down=false;c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();let p=c.getBoundingClientRect();ctx.moveTo(e.clientX-p.left,e.clientY-p.top)};c.onpointermove=e=>{if(!down)return;let p=c.getBoundingClientRect();ctx.lineTo(e.clientX-p.left,e.clientY-p.top);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>down=false}
$('nextChar').onclick=()=>{char=(char+1)%3;trace()};$('clear').onclick=()=>trace();trace();
function render(){if(q>=qs.length){$('quiz').innerHTML='<h3>🏆 完成！答对 '+score+' / '+qs.length+' 题</h3><button class="btn" id="again">再练一次</button>';$('again').onclick=()=>{q=score=0;render()};return}let [question,opts,correct]=qs[q];$('quiz').innerHTML='<h3>第 '+(q+1)+' / '+qs.length+' 题</h3><p>'+question+'</p><button class="btn" id="ask">🔊 听题目与选项</button><div class="answers">'+opts.map((o,i)=>'<button data-answer="'+i+'">'+o+'</button>').join('')+'</div><p id="feedback"></p><button class="btn" id="next">下一题 →</button>';$('ask').onclick=()=>say(question+'。A '+opts[0]+'。B '+opts[1]+'。C '+opts[2]);let done=false;function next(){clearTimeout(timer);q++;render()}$('next').onclick=next;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(done)return;done=true;let good=+b.dataset.answer===correct;if(good)score++;$('feedback').textContent=good?'🌟 回答正确！即将进入下一题。':'正确答案是：'+opts[correct];say(good?'恭喜你回答正确':'正确答案是'+opts[correct]);document.querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;x.classList.add(+x.dataset.answer===correct?'correct':'wrong')});timer=setTimeout(next,2100)})}render();
</script>
<script>
(function(){
const imgs=[...document.querySelectorAll('img.lesson-art')];
const modal=document.createElement('div');modal.className='lesson-overlay';modal.innerHTML='<div class="lesson-overlay-card"><button class="close" type="button" aria-label="关闭">×</button><div class="lesson-modal-content"></div></div>';document.body.appendChild(modal);
const content=modal.querySelector('.lesson-modal-content');let moved=[];
function dismiss(){modal.classList.remove('open');for(const r of moved){if(r.next&&r.next.parentNode===r.parent)r.parent.insertBefore(r.node,r.next);else r.parent.appendChild(r.node)}moved=[]}
modal.querySelector('.close').onclick=dismiss;modal.onclick=e=>{if(e.target===modal)dismiss()};
function popup(items){dismiss();for(const node of items){if(!node)continue;moved.push({node,parent:node.parentNode,next:node.nextSibling});content.appendChild(node)}modal.classList.add('open')}
if(imgs.length!==4)return;
const poemButton=document.getElementById('read'),poem=document.querySelector('main .poem');if(poemButton){imgs[0].onclick=()=>{popup([poem,poemButton]);poemButton.style.display='block';poemButton.click()};imgs[0].setAttribute('role','button');imgs[0].setAttribute('tabindex','0');imgs[0].setAttribute('aria-label','点击古诗图片，查看并朗读整首诗');imgs[0].onkeydown=e=>{if(e.key==='Enter')imgs[0].click()}}
const phonetics=document.getElementById('tones');if(phonetics){
 imgs[1].onclick=e=>{const b=imgs[1].getBoundingClientRect();const x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;const btns=[...phonetics.querySelectorAll('button')];let idx=0;
 if(btns.length===4)idx=(x<.5?(y<.55?0:1):(y<.55?2:3));
 if(btns[idx])btns[idx].click();
 };imgs[1].setAttribute('role','button');imgs[1].setAttribute('aria-label','点击图片听拼音和例字');phonetics.style.display='none'
}
const vocab=document.getElementById('chars');if(vocab)vocab.style.display='none';
const paper=document.querySelector('.paper'),actions=document.querySelector('.actions'),traceTitle=document.getElementById('traceTitle');
imgs[2].onclick=e=>{const b=imgs[2].getBoundingClientRect();const y=(e.clientY-b.top)/b.height;char=Math.min(2,Math.max(0,Math.floor((y-.13)/.28)));popup([traceTitle,paper,actions]);trace();};
imgs[2].setAttribute('role','button');imgs[2].setAttribute('aria-label','点击图片任一生字进行手指描红');
const quiz=document.getElementById('quiz');if(quiz){imgs[3].onclick=()=>{popup([quiz]);};imgs[3].setAttribute('role','button');imgs[3].setAttribute('aria-label','点击图片进入古诗闯关')}
})();
</script><script src="./poem-speech-check.js?v=5" data-day="9" defer></script></body></html>
