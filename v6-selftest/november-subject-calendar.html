<!doctype html><html lang="zh-CN"><head><script src="./isolation.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 · 11月四科学习排课表</title><style>*{box-sizing:border-box}body{margin:0;background:#eff6fc;color:#244760;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:820px;margin:auto;padding:14px}header{background:linear-gradient(125deg,#197ca8,#31b3b4);color:white;padding:24px;border-radius:22px}h1{font-size:25px;margin:8px 0}p{line-height:1.6}.week{background:white;border-radius:18px;padding:15px;margin:15px 0;box-shadow:0 5px 15px #33668814}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.day{border:1px solid #d8e7ee;border-radius:13px;padding:12px}.date{font-weight:800;font-size:16px;margin-bottom:8px}.subjects{display:flex;gap:5px;flex-wrap:wrap}.tag{border-radius:12px;padding:7px 9px;font-size:14px;font-weight:700}.ch{background:#fce6ea;color:#a83f65}.ma{background:#d9edff;color:#216ca4}.en{background:#fff0ce;color:#9a650d}.sc{background:#e1f4dc;color:#398345}.note{color:#59778b;font-size:13px}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main><header><div>🏎️ V6 成长工坊 · 家长排课总览</div><h1>2026 年 11 月四科学习日历</h1><p>每天严格安排两科，已完成的语文日期全部保留。数学、英语和科学按固定日期轮换。</p></header><section class="week"><h2>排课原则</h2><p>语文 17 天、数学 17 天、英语 17 天、科学 9 天，共 60 个学科课次。数学第 1～17 课对应本月的 17 个数学日，后续课程顺延。</p><div class="legend"><span class="tag ch">语文</span><span class="tag ma">数学</span><span class="tag en">英语</span><span class="tag sc">科学</span></div></section><div id="calendar"></div><p class="note">这是课程排期页面，不改变孩子的学习记录；未制作完成的英语、科学内容不标记为已完成。</p></main><script src="./november-subject-schedule.js?v=1"></script><script>(function(){const s=window.V6_NOV_SCHEDULE;if(!s){document.getElementById('calendar').textContent='排课数据加载失败';return}const host=document.getElementById('calendar');const cls={'语文':'ch','数学':'ma','英语':'en','科学':'sc'};for(let start=1;start<=30;start+=7){const sec=document.createElement('section');sec.className='week';const h=document.createElement('h2');h.textContent='第'+(Math.floor((start-1)/7)+1)+'周';sec.append(h);const grid=document.createElement('div');grid.className='grid';s.days.slice(start-1,start+6).forEach(x=>{const card=document.createElement('div');card.className='day';const date=document.createElement('div');date.className='date';date.textContent='11月'+x.day+'日';card.append(date);const sub=document.createElement('div');sub.className='subjects';x.subjects.forEach(t=>{const b=document.createElement('span');b.className='tag '+cls[t];b.textContent=t;sub.append(b)});card.append(sub);grid.append(card)});sec.append(grid);host.append(sec)}})();</script></body></html>
