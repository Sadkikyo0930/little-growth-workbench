utton class="back" id="settingsBack">← 返回冒险世界</button><div class="panel"><h2>⚙️ 家长体验设置</h2><p>这是美术与交互验收版本，不会影响原来的正式网页。</p><button class="primary" id="reset">清空本页测试进度</button><p class="hint">进度仅保存在当前浏览器；这不是正式的能力评估。</p></div></div></section><p class="artnote">美术验收版：采用已确认的概念图素材进行分区交互，非实时 3D；手机可点击地图和学科卡片。</p></div><nav class="tabs"><button class="active" data-tab="home">🏠 首页</button><button data-tab="home">🗺️ 探索</button><button data-tab="settings">⚙️ 设置</button></nav><script>
const subjects={cn:{name:'语文岛',questions:[['🔊 请先听题，再选择正确的汉字。',['山','水','火'],0,'请找出表示高高山峰的那个汉字。',true],['🔊 请先听题，再选择正确的汉字。',['猫','狗','鸟'],0,'请找出会喵喵叫的小动物的那个汉字。',true]]},ma:{name:'数学岛',questions:[['8 加 7 等于多少？',['14','15','16'],1],['20 减 6 等于多少？',['12','14','16'],1]]},en:{name:'英语岛',questions:[['哪个英文单词表示猫？',['cat','cup','dog'],0],['哪个英文单词表示太阳？',['sun','pen','hat'],0]]},sc:{name:'科学岛',questions:[['植物生长通常需要什么？',['阳光和水','玩具','电视'],0],['哪种动物会下蛋？',['小鸡','小猫','小狗'],0]]}};
const $=id=>document.getElementById(id);let done={};try{done=JSON.parse(localStorage.getItem('growth-art-review')||'{}')}catch(e){}let subject=null,index=0,answered=false;
function save(){try{localStorage.setItem('growth-art-review',JSON.stringify(done))}catch(e){}}
function count(){return Object.values(done).filter(Boolean).length}
function openScreen(name){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===name));document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('active',e.dataset.tab===name));window.scrollTo({top:0,behavior:'instant'})}
function home(){openScreen('home');const n=count();$('tasks').innerHTML=Object.entries(subjects).map(([id,s])=>'<div class="task"><span>'+(done[id]?'✅':'⭕')+'</span>'+s.name+'</div>').join('');$('progress').style.width=Math.min(100,n/2*100)+'%';$('progressText').textContent='已完成 '+n+' 科，今日目标 2 科';$('stars').textContent=n*10;$('unlock').textContent=n>=2?'🎉 通行证已解锁！当前仅为演示。':'再完成 '+(2-n)+' 科体验关卡，即可解锁。'}
function speak(text,lang='zh-CN'){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.82;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)))||null;speechSynthesis.speak(u)}
function start(id){subject=id;index=0;openScreen('study');renderQuestion()}
function renderQuestion(){const s=subjects[subject],q=s.questions[index];answered=false;$('subjectName').textContent='🌟 '+s.name;$('step').textContent='第 '+(index+1)+' / '+s.questions.length+' 关';$('question').textContent=q[0];$('tip').textContent=q[4]?'识字测评：题目内容只通过语音播放，屏幕不显示答案提示。':'可以点喇叭听题目和选项。';$('feedback').textContent='';$('next').style.display='none';$('read').onclick=()=>speak(q[4]?q[3]:q[0]);$('options').innerHTML=q[1].map((a,i)=>'<div class="answerline"><button class="opt" data-answer="'+i+'">'+['A','B','C'][i]+'．'+a+'</button>'+(q[4]?'':'<button class="speaker" data-voice="'+i+'">🔊</button>')+'</div>').join('');document.querySelectorAll('[data-voice]').forEach(b=>b.onclick=()=>speak(q[1][+b.dataset.voice],subject==='en'?'en-US':'zh-CN'));document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=+b.dataset.answer===q[2];$('feedback').textContent=ok?'🌟 答对啦！':'💡 正确答案：'+q[1][q[2]];$('next').style.display='inline-block';document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true)});$('next').onclick=()=>{index++;if(index<s.questions.length)renderQuestion();else{done[subject]=true;save();home();alert('🎉 完成 '+s.name+' 的体验关卡！')}}}
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>b.dataset.tab==='home'?home():openScreen('settings'));$('back').onclick=home;$('settingsBack').onclick=home;$('rewardBtn').onclick=()=>alert(count()>=2?'🎉 已解锁演示通行证！正式赛车游戏尚未接入。':'先完成两科任务哦！');$('reset').onclick=()=>{if(confirm('清空当前浏览器中的测试进度？')){done={};save();home()}};home();
