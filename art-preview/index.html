/* Adventure quest board: consistent with illustrated islands and racing reward */
.quest-panel{position:relative;overflow:hidden;border:5px solid #fff4cc;background:linear-gradient(160deg,#fff6ce 0%,#ffe9a5 52%,#f8ce80 100%);box-shadow:0 9px 0 #a56d3c66,0 18px 25px #6e6b7a35,inset 0 0 0 3px #e4ac5c;border-radius:26px;padding:19px 16px 18px}
.quest-panel:before{content:"✦";position:absolute;right:17px;top:12px;font-size:47px;color:#fff7c4;text-shadow:0 2px 2px #e2a652}
.quest-panel h2{position:relative;z-index:1;display:inline-block;margin:0 0 9px;color:#74431d;text-shadow:0 2px #fff4c8;font-size:22px}
.quest-subtitle{font-size:13px;color:#996a3b;font-weight:750;margin:0 0 13px}
.quest-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quest-tile{position:relative;display:flex;align-items:center;gap:8px;min-width:0;padding:11px 8px;border:2px solid #fff9dd;border-radius:17px;background:linear-gradient(150deg,#fffdf2,#fce5b3);box-shadow:0 4px 0 #c79255a8;color:#70451f;font-weight:900;text-align:left;cursor:pointer}
.quest-tile .quest-icon{font-size:24px;line-height:1;flex:none;filter:drop-shadow(0 2px 1px #dba45e)}
.quest-tile .quest-name{font-size:14px;white-space:nowrap}
.quest-tile .quest-mark{position:absolute;right:5px;top:2px;font-size:12px;color:#fff;background:#cc8650;border-radius:9px;padding:2px 4px}
.quest-tile.done{background:linear-gradient(150deg,#e9fff0,#c5efbd);border-color:#fff9d8;color:#357450}
.quest-tile.done .quest-mark{background:#319b6d}
.quest-tile.recommended:not(.done){outline:2px solid #ffbd49;outline-offset:-3px}
.quest-progress{margin-top:17px;border-top:2px dashed #c88f57;padding-top:13px}
.quest-progress-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:950;color:#81502d}
.quest-panel .progress{height:19px;background:#c78e54;border:3px solid #fff0c0;box-shadow:inset 0 2px 3px #9e683b;border-radius:30px;margin:10px 0 5px}
.quest-panel .progress i{background:linear-gradient(90deg,#64d7b2,#3cc48e);box-shadow:inset 0 2px #caffec}
.quest-panel .hint{color:#8c5d35;font-weight:750}
.quest-tile:focus-visible{outline:3px solid #3476ff}
@media(max-width:520px){.quest-panel{padding:17px 15px}.quest-panel h2{font-size:23px}.quest-tile{min-height:62px;padding:12px 10px}.quest-tile .quest-icon{font-size:27px}.quest-tile .quest-name{font-size:16px}}

const subjects={cn:{name:'语文岛',questions:[['🔊 请先听题，再选择正确的汉字。',['山','水','火'],0,'请找出表示高高山峰的那个汉字。',true],['🔊 请先听题，再选择正确的汉字。',['猫','狗','鸟'],0,'请找出会喵喵叫的小动物的那个汉字。',true]]},ma:{name:'数学岛',questions:[['8 加 7 等于多少？',['14','15','16'],1],['20 减 6 等于多少？',['12','14','16'],1]]},en:{name:'英语岛',questions:[['哪个英文单词表示猫？',['cat','cup','dog'],0],['哪个英文单词表示太阳？',['sun','pen','hat'],0]]},sc:{name:'科学岛',questions:[['植物生长通常需要什么？',['阳光和水','玩具','电视'],0],['哪种动物会下蛋？',['小鸡','小猫','小狗'],0]]}};
const $=id=>document.getElementById(id);let done={};try{done=JSON.parse(localStorage.getItem('growth-art-review')||'{}')}catch(e){}let subject=null,index=0,answered=false;
function save(){try{localStorage.setItem('growth-art-review',JSON.stringify(done))}catch(e){}}
function count(){return Object.values(done).filter(Boolean).length}
function openScreen(name){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===name));document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('active',e.dataset.tab===name));window.scrollTo({top:0,behavior:'instant'})}
function home(){openScreen('home');const n=count();$('tasks').innerHTML=Object.entries(subjects).map(([id,s],i)=>'<button class="quest-tile '+(done[id]?'done':i<2?'recommended':'')+'" data-quest="'+id+'"><span class="quest-icon">'+({cn:'📚',ma:'🧮',en:'🔤',sc:'🔬'}[id])+'</span><span class="quest-name">'+s.name+'</span><span class="quest-mark">'+(done[id]?'完成':i<2?'推荐':'可选')+'</span></button>').join('');$('progress').style.width=Math.min(100,n/2*100)+'%';$('progressText').textContent=n>=2?'🏆 赛车能量充满，通行证已解锁！':'还差 '+(2-n)+' 科即可充满赛车能量';$('questCount').textContent=Math.min(n,2)+' / 2';document.querySelectorAll('[data-quest]').forEach(b=>b.onclick=()=>start(b.dataset.quest));$('stars').textContent=n*10;$('unlock').textContent=n>=2?'🎉 通行证已解锁！当前仅为演示。':'再完成 '+(2-n)+' 科体验关卡，即可解锁。'}
function speak(text,lang='zh-CN'){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.82;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)))||null;speechSynthesis.speak(u)}
function start(id){subject=id;index=0;openScreen('study');renderQuestion()}
function renderQuestion(){const s=subjects[subject],q=s.questions[index];answered=false;$('subjectName').textContent='🌟 '+s.name;$('step').textContent='第 '+(index+1)+' / '+s.questions.length+' 关';$('question').textContent=q[0];$('tip').textContent=q[4]?'识字测评：题目内容只通过语音播放，屏幕不显示答案提示。':'可以点喇叭听题目和选项。';$('feedback').textContent='';$('next').style.display='none';$('read').onclick=()=>speak(q[4]?q[3]:q[0]);$('options').innerHTML=q[1].map((a,i)=>'<div class="answerline"><button class="opt" data-answer="'+i+'">'+['A','B','C'][i]+'．'+a+'</button>'+(q[4]?'':'<button class="speaker" data-voice="'+i+'">🔊</button>')+'</div>').join('');document.querySelectorAll('[data-voice]').forEach(b=>b.onclick=()=>speak(q[1][+b.dataset.voice],subject==='en'?'en-US':'zh-CN'));document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=+b.dataset.answer===q[2];$('feedback').textContent=ok?'🌟 答对啦！':'💡 正确答案：'+q[1][q[2]];$('next').style.display='inline-block';document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true)});$('next').onclick=()=>{index++;if(index<s.questions.length)renderQuestion();else{done[subject]=true;save();home();alert('🎉 完成 '+s.name+' 的体验关卡！')}}}
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>b.dataset.tab==='home'?home():openScreen('settings'));$('back').onclick=home;$('settingsBack').onclick=home;$('rewardBtn').onclick=()=>alert(count()>=2?'🎉 已解锁演示通行证！正式赛车游戏尚未接入。':'先完成两科任务哦！');$('reset').onclick=()=>{if(confirm('清空当前浏览器中的测试进度？')){done={};save();home()}};home();
</script></body></html>
